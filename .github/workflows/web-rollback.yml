# WEB-002 rollback: redeploy a site the web explorer workflow kept as a GitHub Release (tag web-<release>), without rebuilding.
# Actions → Web rollback → Run workflow → tag (for example web-20261022-a5ceda2). Every file is checked against the release's own
# release.json (size and SHA-256) before it is deployed. The next push to main deploys the current build again.
name: Web rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to redeploy (web-<release>)'
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Redeploy ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download and verify the kept site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^web-[0-9]{8}-[0-9a-f]{7}$ ]] || { echo "::error::not a web release tag: $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "wayfarer-site-$TAG.tar.gz"
          mkdir _site && tar -xzf "wayfarer-site-$TAG.tar.gz" -C _site
          python3 - <<'EOF'
          import hashlib, json, pathlib, sys
          site = pathlib.Path('_site'); rel = json.loads((site / 'release.json').read_text())
          bad = [n for n, f in rel['files'].items() if n != 'release.json' and (not (site / n).is_file()
                 or (site / n).stat().st_size != f['bytes'] or hashlib.sha256((site / n).read_bytes()).hexdigest() != f['sha256'])]
          print(f"release {rel['release']} at {rel['git_revision']}: {len(rel['files'])} files, {len(bad)} mismatched")
          sys.exit(1 if bad else 0)
          EOF
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
