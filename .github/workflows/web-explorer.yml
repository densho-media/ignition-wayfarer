# WEB-001: build the Wayfarer browser explorer from a clean checkout.
# Every push to main or a claude/* or local/* branch builds, validates and uploads the site as an artifact.
# Only main deploys to GitHub Pages, and only after the tests and the build/export/browser-check job pass.
# No pull_request trigger: forks never run this workflow or reach the deploy job.
name: Web explorer

on:
  push:
    branches: [main, 'claude/**', 'local/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-explorer-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: 5.2.2
  BLENDER_SERIES: '5.2'
  BLENDER_SHA256: 84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168
  PYTHONUNBUFFERED: '1'

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python3 --version && python3 -m unittest discover -s tests

  build:
    name: Build, export and browser-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Blender tarball (cached)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/blender-dl
          key: blender-${{ env.BLENDER_VERSION }}-${{ env.BLENDER_SHA256 }}

      - name: Install Blender ${{ env.BLENDER_VERSION }} (SHA-256 pinned)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6
          mkdir -p ~/blender-dl
          tarball=~/blender-dl/blender-$BLENDER_VERSION-linux-x64.tar.xz
          [ -f "$tarball" ] || curl -sSfL -o "$tarball" "https://download.blender.org/release/Blender$BLENDER_SERIES/blender-$BLENDER_VERSION-linux-x64.tar.xz"
          echo "$BLENDER_SHA256  $tarball" | sha256sum -c -
          tar -xf "$tarball" -C ~
          echo "WAYFARER_BLENDER=$HOME/blender-$BLENDER_VERSION-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Three.js package (cached; integrity checked by web_export.py)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/wayfarer/web
          key: three-${{ hashFiles('tools/web_export.py') }}

      - name: Build the vehicle and diff its geometry against the baseline
        run: |
          set -euo pipefail
          "$WAYFARER_BLENDER" --version | head -1
          SECONDS=0
          python3 tools/workflow.py pipeline --quick --previews none --tests none | tee pipeline.json
          echo "PIPELINE_SECONDS=$SECONDS" >> "$GITHUB_ENV"
          echo "PIPELINE_RUN=$(python3 -c 'import json; print(json.load(open("pipeline.json"))["run_dir"])')" >> "$GITHUB_ENV"

      - name: Export the browser GLB and assemble the site
        run: |
          set -euo pipefail
          SECONDS=0
          python3 tools/workflow.py web --pipeline-run "$PIPELINE_RUN" --out _site | tee web.json
          echo "WEB_SECONDS=$SECONDS" >> "$GITHUB_ENV"

      - name: Browser check (headless Chrome, served under /ignition-wayfarer/)
        run: |
          set -euo pipefail
          SECONDS=0
          python3 tools/web_check.py _site --out web-check --chrome google-chrome --no-sandbox   # ubuntu-24.04 AppArmor blocks Chrome's sandbox; local content only
          echo "CHECK_SECONDS=$SECONDS" >> "$GITHUB_ENV"

      - name: Report
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          def read(p):
              try: return json.loads(Path(p).read_text())
              except Exception: return {}
          pipe, web, build, check = read('pipeline.json'), read('web.json'), read('_site/build.json'), read('web-check/check.json')
          diff = pipe.get('geometry_diff', {})
          print('## Wayfarer web explorer')
          print(f"- Commit `{build.get('git_revision', os.environ.get('GITHUB_SHA'))}`, {build.get('blender', '')}, three {build.get('three', '')}")
          print(f"- Pipeline: **{pipe.get('result', 'not run')}** ({pipe.get('steps', '')}); geometry diff vs `{os.path.basename(diff.get('baseline', ''))}`: "
                f"{diff.get('result', '-')}, changed {diff.get('changed', '-')}, added {diff.get('added', '-')}, removed {diff.get('removed', '-')}")
          print(f"- Web export: **{web.get('result', 'not run')}**; GLB {web.get('glb_mb', '-')} MB, site {web.get('site_mb', '-')} MB, "
                f"{web.get('mesh_nodes', '-')} mesh nodes, {web.get('assemblies', '-')} assemblies, {web.get('triangles', '-')} triangles")
          checks = check.get('checks', [])
          print(f"- Browser check: **{check.get('result', 'not run')}** ({sum(c['ok'] for c in checks)}/{len(checks)}), {check.get('browser', '')}, {check.get('renderer', '')}")
          for c in checks:
              if not c['ok']:
                  print(f"  - FAIL {c['check']}: {json.dumps({k: v for k, v in c.items() if k not in ('check', 'ok')})}")
          print(f"- Wall time: pipeline {os.environ.get('PIPELINE_SECONDS', '-')} s, export {os.environ.get('WEB_SECONDS', '-')} s, "
                f"browser check {os.environ.get('CHECK_SECONDS', '-')} s")
          EOF

      - name: Upload the site (downloadable, every branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wayfarer-web-site
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Upload the browser check and run logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wayfarer-web-check
          path: |
            web-check
            pipeline.json
            web.json
            runs/*/logs
            runs/*/export.log
            runs/*/web.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Package for GitHub Pages (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [tests, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
