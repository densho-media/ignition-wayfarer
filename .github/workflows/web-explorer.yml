# WEB-001/002: build the Wayfarer website (start page, Explore Ship, Enter Wayfarer, review) from a clean checkout.
# Every push to main or a claude/* or local/* branch builds, validates and uploads the site as an artifact (the preview build).
# Only main deploys to GitHub Pages, and only after the tests and the build/export/browser-check job pass; a failed run never
# replaces the live site. After a deploy, the release job keeps the exact site and the native Linux build as a GitHub Release
# (web-<release>), which web-rollback.yml can redeploy without rebuilding.
# No pull_request trigger: forks never run this workflow or reach the deploy job. A push that changes only project documentation
# (none of it is in the site or read by a test) runs nothing; the live site then stays at the last built commit.
name: Web explorer

on:
  push:
    branches: [main, 'claude/**', 'local/**']
    paths-ignore: ['docs/**', 'TODO.md', 'README.md', 'AGENTS.md', 'CLAUDE.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-explorer-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: 5.2.2
  BLENDER_SERIES: '5.2'
  BLENDER_SHA256: 84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168
  PYTHONUNBUFFERED: '1'

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: python3 --version && python3 -m unittest discover -s tests

  build:
    name: Build and export
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Blender (cached unpacked; the tarball is SHA-256 checked when the cache is filled)
        id: blender
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/blender-${{ env.BLENDER_VERSION }}-linux-x64
          key: blender-dir-${{ env.BLENDER_VERSION }}-${{ env.BLENDER_SHA256 }}

      - name: Install Blender ${{ env.BLENDER_VERSION }} (SHA-256 pinned)
        env:
          CACHED: ${{ steps.blender.outputs.cache-hit }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6 \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libegl1 libgl1 libxi6 libxkbcommon0 libxxf86vm1 libxfixes3 libxrender1 libsm6; }
          if [ "$CACHED" != true ]; then
            tarball=$RUNNER_TEMP/blender-$BLENDER_VERSION-linux-x64.tar.xz
            curl -sSfL -o "$tarball" "https://download.blender.org/release/Blender$BLENDER_SERIES/blender-$BLENDER_VERSION-linux-x64.tar.xz"
            echo "$BLENDER_SHA256  $tarball" | sha256sum -c -
            tar -xf "$tarball" -C ~
          fi
          echo "WAYFARER_BLENDER=$HOME/blender-$BLENDER_VERSION-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Godot 4.7.2 editor and templates (cached; SHA-512 checked by web_play.py)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/wayfarer/godot-4.7.2
          key: godot-4.7.2-ca4d71c4-web-linux   # the pinned template archive (web_play.GODOT); change with the pin

      - name: Three.js package (cached; integrity checked by web_export.py)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/wayfarer/web
          key: three-${{ hashFiles('tools/web_export.py') }}

      - name: Build the vehicle and diff its geometry against the baseline
        run: |
          set -euo pipefail
          "$WAYFARER_BLENDER" --version | head -1
          SECONDS=0
          python3 tools/workflow.py pipeline --quick --previews none --tests none | tee pipeline.json
          echo "PIPELINE_SECONDS=$SECONDS" >> "$GITHUB_ENV"
          echo "PIPELINE_RUN=$(python3 -c 'import json; print(json.load(open("pipeline.json"))["run_dir"])')" >> "$GITHUB_ENV"

      - name: Previous verified release (its Enter Wayfarer files are reused when the play inputs are unchanged)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Releases exist only for main deploys that passed live verification; any failure here just means a full play build.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName \
                --jq '[.[].tagName | select(test("^web-[0-9]{8}-[0-9a-f]{7}$"))][0] // empty' 2>/dev/null)
          if [ -n "$tag" ] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir ~/previous \
               --pattern "wayfarer-site-$tag.tar.gz" --pattern wayfarer-demo01-linux-x86_64.zip 2>/dev/null; then
            mkdir -p ~/previous/site && tar -xzf ~/previous/wayfarer-site-$tag.tar.gz -C ~/previous/site \
              && echo "REUSE=--reuse-play $HOME/previous/site --reuse-native $HOME/previous/wayfarer-demo01-linux-x86_64.zip" >> "$GITHUB_ENV" \
              && echo "::notice title=play reuse::comparing with release $tag"
          else
            echo "::notice title=play reuse::no previous release with a native build (${tag:-none}); full play build"
          fi

      - name: Export the viewer GLB and the Godot Web build, assemble the site
        run: |
          set -euo pipefail
          SECONDS=0
          python3 tools/workflow.py web --pipeline-run "$PIPELINE_RUN" --out _site --native ${REUSE:-} | tee web.json
          python3 -c "import json; p = json.load(open('web.json')).get('play') or {}; print('::notice title=play reuse::' + str(p.get('reuse_note')))"
          echo "WEB_SECONDS=$SECONDS" >> "$GITHUB_ENV"
          echo "WEB_RUN=$(python3 -c 'import json; print(json.load(open("web.json"))["run_dir"])')" >> "$GITHUB_ENV"

      - name: Report
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          def read(p):
              try: return json.loads(Path(p).read_text())
              except Exception: return {}
          pipe, web, build = read('pipeline.json'), read('web.json'), read('_site/viewer/build.json')
          diff = pipe.get('geometry_diff', {})
          print('## Wayfarer web explorer: build')
          print(f"- Commit `{build.get('git_revision', os.environ.get('GITHUB_SHA'))}`, {build.get('blender', '')}, three {build.get('three', '')}")
          print(f"- Pipeline: **{pipe.get('result', 'not run')}** ({pipe.get('steps', '')}); geometry diff vs `{os.path.basename(diff.get('baseline', ''))}`: "
                f"{diff.get('result', '-')}, changed {diff.get('changed', '-')}, added {diff.get('added', '-')}, removed {diff.get('removed', '-')}")
          print(f"- Web export: **{web.get('result', 'not run')}** release `{web.get('release', '-')}`; start page {web.get('start_page_bytes', '-')} B, "
                f"viewer {web.get('viewer_mb', '-')} MB (GLB {web.get('glb_mb', '-')} MB, {web.get('mesh_nodes', '-')} mesh nodes, "
                f"{web.get('triangles', '-')} triangles), play {(web.get('play') or {}).get('mb', '-')} MB, site {web.get('site_mb', '-')} MB")
          native = (web.get('play') or {}).get('native_reference') or {}
          print(f"- Native Demonstrator 01 check on the web package: **{native.get('result', 'not run')}** ({native.get('checks', '-')} checks), "
                f"recording {json.dumps(native.get('recording'))}")
          print(f"- Wall time: pipeline {os.environ.get('PIPELINE_SECONDS', '-')} s, export and Godot {os.environ.get('WEB_SECONDS', '-')} s")
          EOF

      - name: Upload the site for the browser check (its release.json gets the results in the site job)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wayfarer-web-site-unchecked
          path: _site
          if-no-files-found: error
          retention-days: 1

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wayfarer-web-build-logs
          path: |
            pipeline.json
            web.json
            runs/*/logs
            runs/*/*.log
            runs/*/web.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the native Linux build of Demonstrator 01
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wayfarer-demo01-linux-x86_64
          path: ${{ env.WEB_RUN }}/wayfarer-demo01-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  # The browser check in four parts, each on its own runner against the same site (software WebGL is CPU-bound, so the parts no
  # longer share one runner): the main visitor walk, browser-vs-native equivalence, the touch journey and the touch walk.
  browser-check:
    name: Browser check (${{ matrix.part }})
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [main, equivalence, touch, walk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wayfarer-web-site-unchecked
          path: _site
      - name: Browser check, ${{ matrix.part }} (headless Chrome, served under /ignition-wayfarer/)
        run: python3 tools/web_check.py _site --part ${{ matrix.part }} --out web-check-${{ matrix.part }} --chrome google-chrome --no-sandbox   # ubuntu-24.04 AppArmor blocks Chrome's sandbox; local content only
      - name: Upload this part's results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wayfarer-web-check-${{ matrix.part }}
          path: web-check-${{ matrix.part }}
          if-no-files-found: ignore
          retention-days: 14

  site:
    name: Record the browser check, package the site
    needs: [build, browser-check]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wayfarer-web-site-unchecked
          path: _site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wayfarer-web-check-*
          path: parts
      - name: Merge the parts into release.json (a missing part fails)
        run: |
          python3 tools/web_check.py _site --merge parts/wayfarer-web-check-main parts/wayfarer-web-check-equivalence \
            parts/wayfarer-web-check-touch parts/wayfarer-web-check-walk --out web-check --record

      - name: Report
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          try: check = json.loads(Path('web-check/check.json').read_text())
          except Exception: check = {}
          print('## Wayfarer web explorer: browser check')
          for k, m in (check.get('metrics') or {}).items():
              print(f"- Browser {k}: `{json.dumps(m)}`")
          checks = check.get('checks', [])
          print(f"- Browser check: **{check.get('result', 'not run')}** ({sum(c['ok'] for c in checks)}/{len(checks)}), {check.get('browser', '')}, {check.get('renderer', '')}")
          for c in checks:
              if not c['ok']:
                  print(f"  - FAIL {c['check']}: {json.dumps({k: v for k, v in c.items() if k not in ('check', 'ok')})}")
          print(f"- Wall time per part (s): `{json.dumps(check.get('part_seconds'))}`")
          EOF

      - name: Upload the site (downloadable, every branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wayfarer-web-site
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Upload the merged browser check
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wayfarer-web-check
          path: web-check
          if-no-files-found: ignore
          retention-days: 14

      - name: Package for GitHub Pages (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [tests, build, browser-check, site]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  verify:
    name: Verify the live site
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Wait for this commit on the live site, record its headers
        env:
          LIVE: https://densho-media.github.io/ignition-wayfarer/
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            rev=$(curl -sSf -H 'Cache-Control: no-cache' "${LIVE}release.json?t=$(date +%s)" | python3 -c 'import json,sys; print(json.load(sys.stdin)["git_revision"])' || true)
            [ "$rev" = "$GITHUB_SHA" ] && break
            echo "live release.json shows ${rev:-nothing}; waiting"; sleep 15
          done
          [ "$rev" = "$GITHUB_SHA" ] || { echo "::error::the live site never showed $GITHUB_SHA"; exit 1; }
          python3 - <<'EOF2' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request
          live = os.environ['LIVE']
          rel = json.loads(urllib.request.urlopen(live + 'release.json').read())
          paths = ['', 'site.css', 'viewer/', rel['experiences']['viewer']['glb_file'], 'viewer/vendor/three/draco/draco_decoder.wasm', 'play/']
          paths += [f"play/{f}" for k, f in rel['experiences'].get('play', {}).get('files', {}).items() if k in ('html', 'js', 'wasm', 'pck')]
          print(f"## Live site {live} — release {rel['release']}\n\n| path | status | type | encoding | wire bytes | file bytes | cache |\n|---|---|---|---|---|---|---|")
          bad = 0
          for p in paths:
              req = urllib.request.Request(live + p, headers={'Accept-Encoding': 'gzip, br'})
              with urllib.request.urlopen(req) as r:
                  body = r.read(); h = r.headers
              size = rel['files'].get(p, {}).get('bytes') or rel['files'].get(p + 'index.html', {}).get('bytes')
              print(f"| {p or '/'} | {r.status} | {h.get('Content-Type')} | {h.get('Content-Encoding', '-')} | {len(body)} | {size} | {h.get('Cache-Control')} |")
              bad += r.status != 200 or (p.endswith('.wasm') and 'wasm' not in h.get('Content-Type', ''))
          raise SystemExit(bad)
          EOF2

  # The browser check against the live URL in the same parts as browser-check (equivalence needs the recording, which a live check
  # leaves out); one runner for every part outgrew its time limit on slow runners.
  verify-browser:
    name: Live browser check (${{ matrix.part }})
    needs: [verify]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [main, touch, walk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Browser check against the live site, ${{ matrix.part }}
        run: python3 tools/web_check.py --live https://densho-media.github.io/ignition-wayfarer/ --part ${{ matrix.part }} --out live-check-${{ matrix.part }} --chrome google-chrome --no-sandbox --no-recording
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: wayfarer-live-check-${{ matrix.part }}
          path: live-check-${{ matrix.part }}
          retention-days: 30

  release:
    name: Keep the deployed site and native build as a GitHub Release
    needs: [verify, verify-browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wayfarer-web-site
          path: _site
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wayfarer-demo01-linux-x86_64
          path: native
      - name: Create release web-<release>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="web-$(python3 -c 'import json; print(json.load(open("_site/release.json"))["release"])')"
          tar -czf "wayfarer-site-$tag.tar.gz" -C _site .
          cp _site/release.json "release-$tag.json"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists (a rerun of this commit); kept as it is"; exit 0
          fi
          url="https://densho-media.github.io/ignition-wayfarer/"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Wayfarer web $tag" \
            --notes "Deployed to $url from $GITHUB_SHA (run $GITHUB_RUN_ID). Assets: the exact site (redeploy with the Web rollback workflow), its release.json, and the native Linux build of Integrated Demonstrator 01 (same package as the browser build). SIMULATION_ONLY, REP_PROXY geometry." \
            "wayfarer-site-$tag.tar.gz" "release-$tag.json" native/wayfarer-demo01-linux-x86_64.zip
