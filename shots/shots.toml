# FUT-002 example shots. Shot-local presentation data: timing, framing, colours and labels live here,
# never in data/wayfarer_3d.toml or the assets. Each shot links saved assets and builds shot-local representation
# objects that reuse the linked geometry (src/wayfarer/representation.py, src/wayfarer/shots/shot_tools.py).
#
# Sources: asset = path under assets/<library> (library = "wayfarer", the default, or "characters"); collection = the asset's root collection;
#   group = explode grouping: "drive_node" (nearest drive hierarchy node), "assembly" (top-level subsystem instance),
#   "subassembly" (the instance inside it, e.g. one radiator or ring sector) or "fixed" (never exploded).
# Selectors: "field:pattern" (fnmatch) on key, id (component_id), kind, group, source or name.
# Operations: isolate | reveal | conceal | highlight (value) | explode (value) | recombine, each at frame over duration.
# Camera: either `camera` (direction, fov, margin: fitted to the sources) or `cuts`, a list of { frame, camera } where camera names a saved
#   camera of a source (copied at its saved pose) or "stop" (the eye-level view of the cut's induction `stop`, characters.stop_views); a cut
#   with a `stop` is captioned from [induction] (sequence, scenes, operating state). materials = "source" keeps the saved look (linked
#   materials, so lit fixtures glow; no bevel), and conceal/reveal then only hide and show. controls = { <control object> = { <property> =
#   value } } poses display controls in memory and the drivers that read them (shot_tools.pose_controls).
schema = 1
fps = 24
highlight_color = [1.0, 0.72, 0.28]

[shot.SH_ENGINE_HOLOGRAM]
description = "Engine exposition: the real propulsion assembly as a hologram, revealed along the causal chain core -> common plasma -> throat -> manifold -> four flux channels and nozzles, then the field lines, the optical gate layer, an explosion and a recombination."
representation = "REP_HOLOGRAM"
frame_end = 300
review_frames = [1, 60, 112, 168, 228, 290]
camera = { direction = [0.55, -1.0, 0.42], fov_deg = 30.0, margin = 1.04 }
initial = ["group:DRIVE_FUSION_CORE"]
explode = { axial = 0.8, radial = 1.6 }
sources = [
    { asset = "subsystems/WF_PROPULSION.blend", collection = "WF_PROPULSION", group = "drive_node" },
    { asset = "subsystems/WF_DEBUG_MAGNETICS.blend", collection = "WF_DEBUG_MAGNETICS", group = "fixed" },
    { asset = "subsystems/WF_DEBUG_OPTICS.blend", collection = "WF_DEBUG_OPTICS", group = "fixed" },
]
ops = [
    { op = "reveal", frame = 24, duration = 24, select = ["group:DRIVE_COMMON_PLASMA", "group:DRIVE_CONVERGENCE_THROAT"] },
    { op = "reveal", frame = 48, duration = 24, select = ["group:DRIVE_MANIFOLD"] },
    { op = "reveal", frame = 72, duration = 24, select = ["group:DRIVE_FLUX_CHANNEL_*", "group:DRIVE_NOZZLE_*"] },
    { op = "reveal", frame = 96, duration = 18, select = ["source:WF_DEBUG_MAGNETICS"] },
    { op = "highlight", frame = 96, duration = 12, select = ["kind:magnetic_field"] },
    { op = "conceal", frame = 132, duration = 18, select = ["source:WF_DEBUG_MAGNETICS"] },
    { op = "highlight", frame = 132, duration = 12, value = 0.0, select = ["kind:magnetic_field"] },
    { op = "reveal", frame = 132, duration = 24, select = ["group:DRIVE_OPTICAL_CONTROL", "group:DRIVE_GATE_L*", "source:WF_DEBUG_OPTICS"] },
    { op = "highlight", frame = 156, duration = 12, select = ["kind:optical_source", "kind:optical_gate"] },
    { op = "conceal", frame = 180, duration = 12, select = ["source:WF_DEBUG_OPTICS"] },
    { op = "highlight", frame = 180, duration = 12, value = 0.0, select = ["kind:optical_source", "kind:optical_gate"] },
    { op = "explode", frame = 192, duration = 36 },
    { op = "recombine", frame = 252, duration = 36 },
]
labels = [
    { text = "FUSION CORE", select = ["group:DRIVE_FUSION_CORE"], show = [1, 300], offset = [0.0, 0.0, 10.6], size = 0.9 },
    { text = "COMMON PLASMA + THROAT", select = ["group:DRIVE_COMMON_PLASMA"], show = [24, 300], offset = [0.0, 0.0, 7.8], size = 0.9 },
    { text = "MAGNETIC MANIFOLD / FIJI LATTICE", select = ["group:DRIVE_MANIFOLD"], show = [48, 300], offset = [0.0, 0.0, -5.2], size = 0.9 },
    { text = "4 FLUX CHANNELS -> 4 NOZZLES", select = ["group:DRIVE_NOZZLE_*"], show = [72, 300], offset = [-3.0, 0.0, -8.8], size = 0.9 },
    { text = "A/B LASERS -> GATES L1-L4", select = ["group:DRIVE_OPTICAL_CONTROL"], show = [132, 300], offset = [0.0, 0.0, 4.5], size = 0.9 },
]
[shot.SH_ENGINE_HOLOGRAM.colors]
default = [0.30, 0.78, 1.0]
"kind:plasma" = [0.85, 0.55, 1.0]
"kind:magnetic_field" = [0.25, 0.95, 1.0]
"source:WF_DEBUG_MAGNETICS" = [0.25, 0.95, 1.0]
"kind:lattice_*" = [1.0, 0.62, 0.25]
"kind:seed_coil" = [1.0, 0.62, 0.25]
"kind:optical_*" = [0.35, 1.0, 0.55]
"kind:shield_plug" = [0.35, 1.0, 0.55]
"source:WF_DEBUG_OPTICS" = [0.35, 1.0, 0.55]

[shot.SH_SHIP_CUTAWAY]
description = "Internal engineering view of the coast ship: the radiators set aside; skins, ring frames, sectors and drive envelopes cut by a section plane on the camera side; the sector interiors highlighted; the subassemblies (each sector, the EYE, the drive) exploded apart and recombined."
representation = "REP_CUTAWAY"
frame_end = 216
review_frames = [1, 60, 132, 216]
camera = { direction = [0.3, -1.0, 0.3], fov_deg = 30.0, margin = 1.0 }
explode = { axial = 0.3, radial = 0.12 }
# The section plane: a point and the normal of the removed half-space (the camera side, -Y). "cut" objects lose that
# half; "cap" (solid volumes among them) show flat caps where cut, thin shells keep their shaded inner surface.
section = { point = [0.0, 0.0, 0.0], normal = [0.0, -1.0, 0.0] }
cut = ["kind:hull_shell", "kind:sector_pressure", "kind:ring_frame", "kind:ring_fill", "kind:sector_interior_overhead", "name:Fusion_Core", "name:Common_Plasma_Region", "name:Magnetic_Manifold", "name:Engineering*", "name:Crew_Refuge*"]
cap = ["name:Fusion_Core", "name:Common_Plasma_Region", "name:Magnetic_Manifold", "name:Crew_Refuge*"]
sources = [
    { asset = "WF_WAYFARER_001.blend", collection = "WF_WAYFARER_001", group = "subassembly" },
]
ops = [
    { op = "conceal", frame = 1, select = ["group:Assembly_THERMAL*"] },
    { op = "highlight", frame = 30, duration = 18, select = ["kind:sector_interior_*"] },
    { op = "highlight", frame = 78, duration = 18, value = 0.0, select = ["kind:sector_interior_*"] },
    { op = "explode", frame = 96, duration = 36 },
    { op = "recombine", frame = 168, duration = 36 },
]
labels = []

[shot.SH_SHIP_STANDARD]
description = "Exterior of the ship in HIGH_POWER, rings stopped and locked at full diameter, in the standard look; the hull fades away to reveal the structure and the rings, the habitat is highlighted, the hull returns, and finally the propulsion assembly is isolated."
representation = "REP_STANDARD"
# Shot-local preset: the shot poses the linked rotor controls of this buildable configuration before it gathers the source. The drive
# plasma is not posed in shots (a static representation of the saved data); only the ring state follows the preset.
preset = "HIGH_POWER"
frame_end = 168
review_frames = [1, 60, 120, 168]
camera = { direction = [0.9, -1.1, 0.55], fov_deg = 34.0, margin = 1.02 }
explode = { axial = 0.0, radial = 0.0 }
sources = [
    { asset = "WF_WAYFARER_001.blend", collection = "WF_WAYFARER_001", group = "assembly" },
]
ops = [
    { op = "conceal", frame = 24, duration = 24, select = ["kind:hull_shell"] },
    { op = "highlight", frame = 48, duration = 12, select = ["group:Assembly_HABITAT"] },
    { op = "highlight", frame = 84, duration = 12, value = 0.0, select = ["group:Assembly_HABITAT"] },
    { op = "reveal", frame = 96, duration = 24, select = ["kind:hull_shell"] },
    { op = "isolate", frame = 132, duration = 24, select = ["group:Assembly_PROPULSION"] },
]
labels = []

[shot.SH_INDUCTION]
description = "IND-001 induction (S004A-C): the eight stops in order, each held on its eye-level view, with the crew staged for its scenes. Captions give the stop, its scenes and its operating state ([induction].sequence, Q48: board docked, spin up, a COAST tour through the despun transfer drum). The ring stops are drawn at the index angle; the departure is Tale-owned."
representation = "REP_STANDARD"
preset = "DOCKED"
materials = "source"
# Shot-local display controls, posed in memory: the entry hatches and ring A's transfer closures (Q46: spine-port gate, drum doors, tube hatches)
# open, as in the eye-level previews.
controls = { DOCK_ENTRY_CTRL = { Dock_Primary_outer_open = 1.0, Dock_Primary_inner_open = 1.0 }, CREW_PORT_GATE_CTRL = { Crew_Port_1_1_Gate_open = 1.0 }, TRANSFER_1_CTRL = { door_open_1 = 1.0, door_open_2 = 1.0, door_open_3 = 1.0, hatch_open_1 = 1.0, hatch_open_2 = 1.0, hatch_open_3 = 1.0 } }
frame_end = 384
review_frames = [24, 72, 120, 168, 216, 264, 312, 360]
# Each stop's view ([induction].stops `view`), as in entry_preview's ind_<stop> stills.
cuts = [
    { frame = 1, stop = "arrival", camera = "stop" },
    { frame = 49, stop = "spine", camera = "stop" },
    { frame = 97, stop = "transfer", camera = "stop" },
    { frame = 145, stop = "habitat", camera = "stop" },
    { frame = 193, stop = "garden", camera = "stop" },
    { frame = 241, stop = "burn_readiness", camera = "stop" },
    { frame = 289, stop = "specialists", camera = "stop" },
    { frame = 337, stop = "burn_station", camera = "stop" },
]
sources = [
    { asset = "WF_WAYFARER_001.blend", collection = "WF_WAYFARER_001", group = "fixed" },
    { asset = "WF_CHAR_INDUCTION.blend", library = "characters", collection = "WF_CHAR_INDUCTION", group = "fixed" },
]
# The review figures and mannequins are scale guides, not crew; each cut shows only the characters of its scenes (S004B on the couch, S004C
# at the stations and the workbench, both at the burn station).
ops = [
    { op = "conceal", frame = 1, select = ["name:Human_*"] },
    { op = "conceal", frame = 241, select = ["name:S004C_*"] },
    { op = "reveal", frame = 289, select = ["name:S004C_*"] },
    { op = "conceal", frame = 289, select = ["name:S004B_*"] },
    { op = "reveal", frame = 337, select = ["name:S004B_*"] },
]
labels = []
