[roadmap]
rows = [
  ["III.1", "Stability closure", "Nonlinear time-domain thrust model with slosh, damping and a GNC loop; G and other mass placements with ISSA; decide whether the ship closes at 1.87 or needs a lower ultimate target with active control."],
  ["III.2", "Fail-safe joints", "Twin-lug fittings and X-braced bays in the critical districts; re-run the damage set at emergency and nominal thrust."],
  ["III.3", "Deck and tankage", "Deck depth and skirt ownership with tankage; rotor sweep and farm layout from ISSA."],
  ["III.4", "Interfaces", "Rebase on SSI-1.0; resolve the MRU lane; per-frame reactions and stiffness to ISSA."],
  ["III.5", "Detail", "Local shell and joint FE for the C4 fittings and the hub cones; thermal transient for the hot sector."],
]

[decisions]
intro = "Phase II closes the questions the owner can answer now. None of these changes canon by itself."
rows = [
  ["P2-D1", "Accept H on the hub path, six paired rails, F1, with HC as the carbon hybrid, as the Phase III baseline."],
  ["P2-D2", "Accept that the realistic primary structure is about 1.1 to 1.2 kt and decide whether the 150 t line is retired or kept as a stretch target."],
  ["P2-D3", "Authorise a joint study with ISSA of G (partial aft H2 reaction mass) for stability and mass."],
  ["P2-D4", "Set the stability target for Phase III: passive 1.87, or a lower passive margin with certified active control."],
  ["P2-D5", "Accept fail-safe joints as a design requirement (+134 t class penalty for six rails)."],
]
