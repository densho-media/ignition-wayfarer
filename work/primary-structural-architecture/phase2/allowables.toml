[[material]]
id = "ALAL2O3F"
name = "Alumina-fibre / Al MMC tube (Nextel 610-class, Vf 0.55-0.60, ~80 % axial plies + hoop/±45 wraps)"
track = "R"
E = [170, 190, 210]
G = 45.0
rho = 3350
alpha = 6.8
Fty = [700, 900, 1100]
Ftu = [700, 900, 1100]
Fcy = [300, 450, 700]
T_max_K = 520
k_T_350K = 0.97
min_gauge_mm = 2.5
class = "PATENT + PHYS"
source = "Tension: 60 vol% Nextel 610/Al coupons 1,380-1,400 MPa longitudinal, 140 MPa transverse (3M patents EP0833952B1, US 6,447,927); fibre 3.1-3.3 GPa (Deve and McCullough, Compos. A 2000). Member design = 0.8 lay-up x 0.8 basis x coupon. Compression: no published longitudinal compression data found (search 2026-11-28); estimate from kink-band (Budiansky-Fleck) sigma_c ~ tau_y/(phi + gamma_y) with matrix shear yield 20-50 MPa and fibre misalignment 2-3 deg: 0.5-1.2 GPa unidirectional; design 450 [300, 700] for the tube."
uncertainty = "HIGH: compression, microbuckling and fibre-matrix interface at 300-500 K unmeasured; conductor-core wire data (ACCR) are tension-only and do not qualify compression tubes. Joining (end fittings by diffusion bonding or bonded Ti sleeves) unproven at scale. Bridging advance: lunar alumina fibre drawing + pressure infiltration of metre-scale tubes, with compression qualification."

