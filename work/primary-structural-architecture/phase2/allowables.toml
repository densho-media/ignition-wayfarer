# PSA Phase II material allowables and uncertainty register (STUDY / NONCANON). Finished-member DESIGN values, not coupon values.
#
# Rule (owner D01): one safety factor, applied once. Loads are ultimate = 1.4 x limit (yield check 1.25 x limit). Allowables below are
# design values for the finished member (statistical basis, process, environment); they carry NO further load factor. Buckling uses
# a knockdown on the theoretical critical load (imperfection), not a factor on the load.
#
# Values: [low, nominal, high]; sizing uses nominal and the report shows the effect of low. Units: GPa (E, G), kg/m3, ppm/K, MPa.
# class: LIT (handbook/literature, order of magnitude known), PATENT (coupon data from a patent), PHYS (physics-based estimate),
#        PROTO (judgement). source: where the number comes from. Nothing here is PMDS-verified; PMDS (data/materials) is unchanged.

[meta]
load_factor_ultimate = 1.4
load_factor_yield = 1.25
column_knockdown = 0.75        # imperfect column vs Euler (initial bow L/500 + joint eccentricity), PROTO
shell_knockdown = 0.33          # unstiffened thin cylinder, NASA SP-8007 lower bound order, LIT
classic_shell_coeff = 0.605     # sigma_cr = 0.605 E t / r (isotropic)
coupon_to_member_note = "Member design value = coupon basis value x process factor x environment factor. Joints are designed separately (fittings, splices) and are not knocked down into the member body."

