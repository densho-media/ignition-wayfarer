# PSA Phase I: structural load-case register (STUDY / NONCANON).
# magnitude: Phase I screening values from psa_study.py (results/psa_phase1.json) or OPEN. evidence: CANON (Drive row), CALCULATED
# (first-order, this study), ESTIMATE, OPEN. Loads are distributed inertial loads (mass x local acceleration), never the total thrust
# applied to every section. Configurations: P production, F1 ISSA Track F reference, R ISSA Track R (never mixed).

[meta]
status = "STUDY / NONCANON"
sizing_rule = "Phase I sizing: N_design = max over flight states of T x m_ahead / M, x DLF 1.3; ultimate factor 1.4, yield 1.25 (materials.toml). The canon 1.5 g at 2,000 t envelope (07!A2) is carried as a comparison case LC-02b."

[[case]]
id = "LC-01"
name = "Nominal propulsion (power-limited burn)"
configs = ["P", "F1", "R"]
magnitude = "Thrust 21.77 MN in all three (power-limited drive); compression ~21 MN at the transition, ~16 MN at the tank farm aft face, ~0.3-1.6 MN at the shield root (stations in psa_phase1.json)"
path = "thrust frame -> ring -> sectors/spine -> frames -> tank deck and collar -> Brow"
evidence = "CALCULATED (mass_model placement for P; ISSA Phase VI masses placed by district for F1/R)"
note = "Because thrust is fixed by drive power, a heavier ship (F1 8.2 kt, R 12.9 kt) sees LOWER acceleration and nearly the SAME section loads; growth moves load forward (propellant) not up."

[[case]]
id = "LC-02"
name = "Maximum structural design load (thrust-bounded envelope)"
configs = ["P", "F1", "R"]
magnitude = "N_design ~27.8 MN at the transition (21.4 MN x DLF 1.3)"
path = "as LC-01"
evidence = "CALCULATED; DLF 1.3 PROTOTYPE pending LC-03"
note = "Governs every longitudinal member."

[[case]]
id = "LC-02b"
name = "Canon structural envelope: 1.5 g on the fully loaded ship"
configs = ["P"]
magnitude = "63.5 MN at the transition (1.5 g x 4,466 t) - 3x what the drive can produce"
path = "as LC-01"
evidence = "CANON rule 07!A2 (29.42 MN = 1.5 g x 2,000 t, DERIVED) as applied by the tank-deck study (DOP-03: every vessel full at 1.5 g)"
note = "Owner decision PSA-D01: keep as a proof envelope (x2.4-2.7 structure mass) or replace by a thrust-bounded design load with explicit factors."

[[case]]
id = "LC-03"
name = "Propulsion startup and shutdown transients"
configs = ["P", "F1", "R"]
magnitude = "DLF 1.0 (slow ramp, > 10 x first-mode period ~10 s) to 2.0 (step); ramp rate OPEN"
path = "all longitudinal members; tank slosh and ring latches"
evidence = "OPEN (drive thrust ramp not in canon; first_ignition ramp exists for the burn but not the structural transient)"
note = "A thrust ramp slower than ~50 s keeps DLF ~1.0 for f1 ~0.1 Hz: an operating rule that saves structure."

[[case]]
id = "LC-04"
name = "Global bending and torsion (steering, RCS, CMG, docking)"
configs = ["P", "F1", "R"]
magnitude = "steer torque 0.16-0.21 MN m trimmed, 0.83 MN m untrimmed (mass_model); RCS couples kN m class"
path = "sector longerons as bending chords; frames and diagonals for torsion"
evidence = "CALCULATED (mass_model)"
note = "Small against axial compression; stiffness (modes) not strength governs."

[[case]]
id = "LC-05"
name = "Engine or nozzle failure (asymmetric thrust)"
configs = ["P", "F1", "R"]
magnitude = "one of four out at the design share 7.35 MN: 19 MN m (canon nozzles at 2.6 m) / 88 MN m (Vertex cluster r 12 m) / 221 MN m (r 30 m) before trim"
path = "thrust frame and ring in bending; whole ship as a beam until the opposite engine is throttled"
evidence = "CALCULATED (psa_phase1 outriggers)"
note = "Trim law (shut the opposite engine within one control cycle) bounds the structure; reaction time and transient OPEN (GNC-04)."

[[case]]
id = "LC-06"
name = "Differential thrust and thrust vectoring"
configs = ["P"]
magnitude = "trim 0.29-0.37 % differential (mass_model); vector range OPEN (06!E52)"
path = "nozzle pickups, ring"
evidence = "CALCULATED / OPEN"

