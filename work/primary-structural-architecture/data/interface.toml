# PSA <-> ISSA shared engineering interface (PROPOSAL, STUDY / NONCANON). Version PSA-IF 0.1, 2026-11-28.
#
# Convention (proposed, not yet adopted by ISSA; no shared production file is changed):
#  - Equipment ids are ISSA's (`systems.toml` ids EPS-xx, TMS-xx, ...; `data/systems.toml` on the ISSA branch) or, for systems ISSA does
#    not own, the production budget id (physics.mass_budget) prefixed `MB.`. PSA never renames an ISSA id.
#  - Structure-side ids are PSA's: MZ-nn mounting zones, KO-nn keep-outs, SC-nn service corridors, HP-<class> hard-point classes.
#  - Every quantity is a value, a [low, nominal, high] band, or the string "OPEN <reason>". Zero is never a placeholder.
#  - Positions are ship coordinates (metres, +X bow, +Z dorsal; layout datums AFT -144.75, RING_A 97.30, FWD 144.75 at main 11f1e94).
#  - `source_rev` pins the commit the value was read from; a refresh at each PSA phase updates it and logs the change in the handoff.
#  - Ownership: ISSA owns equipment requirements (mass, envelope, thermal, utilities, maintenance); PSA owns zones, capacities,
#    stiffness, keep-outs and corridors. A value one side needs from the other and does not have is OPEN with `needed_by`.

[meta]
version = "PSA-IF 0.1"
status = "PROPOSAL / STUDY / NONCANON"
issa_source = "claude/cloud/ship-systems-architecture @ 5eae7016c1c31631c9437b2d7d06aa30b740a374 (Phase VI, F1 = Track F reference)"
main_source = "main @ 11f1e94f1c36a6e53835343c3ad645ff7da8f2d5"
equipment_fields = ["id", "owner", "source_rev", "track", "envelope", "position", "mass_t", "cg_m", "inertia", "T_operating_K", "T_survival_K", "loads", "attachment", "attachment_stiffness", "allowed_displacement", "thermal_expansion", "vibration", "radiation_em", "maintenance_envelope", "utilities", "redundancy", "evidence", "approval"]
zone_fields = ["id", "x_m", "r_m", "azimuth_deg", "function", "hardpoints", "capacity", "stiffness", "keep_outs", "corridors", "temperature_K", "notes"]

[hardpoint_class]
HP-S = { capacity_kN = 10, stiffness_N_m = 1e7, pattern = "4 x M12 on a 200 mm square, frame-mounted", use = "racks, sensors, avionics boxes" }
HP-M = { capacity_kN = 50, stiffness_N_m = 5e7, pattern = "6 x M20 or pinned clevis on a frame node", use = "ECLSS units, battery strings, pumps" }
HP-L = { capacity_kN = 250, stiffness_N_m = 2e8, pattern = "pinned clevis pair on a longeron node", use = "L2 units, drive services, tank skirts" }
HP-X = { capacity_kN = "OPEN (designed per item)", stiffness_N_m = "OPEN", pattern = "dedicated structure", use = "drive, Brow, rings, blades, tank farm" }
capacity_basis = "design acceleration 1.5 g (canon) x mass x 1.4 ultimate; at the thrust-bounded flight peak (1.33 g on the dry P ship) the same hard-point carries ~13 % more mass"
mount_rule = "Equipment on mounts: first mode >= 5 Hz (50x the global ~0.1 Hz mode, below pulse harmonics) or isolated below 1 Hz; never between."

