# PSA Phase I: parametric structural material library (STUDY / NONCANON).
#
# Two tracks never mix: R = known materials, handbook-typical properties and evidence-supported extrapolation; F = explicit IGNITION
# assumptions (each with parent, mechanism, improvement, bridging advance and the register/canon row it relies on). A calculation selects
# its track; F values never enter an R result.
#
# Laboratory/handbook properties are NOT design allowables. The study (psa_study.py) derives an allowable as
#   F_allow = min(Fty/FS_y, Ftu/FS_u) * k_T(T) * k_joint * k_process * k_env
# with the factors below; buckling uses E * k_T and a knockdown. Units: rho kg/m3, E/G GPa, strengths MPa, alpha 1e-6/K, k W/m/K,
# cp J/kg/K, K_IC MPa m^0.5, T in K, energy kWh/kg. Properties are room-temperature typical values (basis TYPICAL) unless stated;
# verification UNVERIFIED (Claude handbook recall: MMPDS, ASM Handbooks, MIL-HDBK-17, producer datasheets) until checked. Where PMDS
# (data/materials/catalogue.toml) already holds a material, `pmds` names it and PMDS stays the property authority for production use.
# k_T tables give the fraction of room-temperature strength retained at T (long exposure); `T_max` is a screening limit, not a rating.
# `lunar` = LOCAL (all major constituents from the lunar network), PARTIAL (some alloying/precursor imports), IMPORT.
# `magnetic`: FERRO (ferromagnetic, forces in drive fields), PARA/NON. `conductive`: YES/LOW/NO (eddy currents in pulsed fields).

[meta]
status = "STUDY / NONCANON"
verification = "UNVERIFIED (handbook recall); primary check pending (MMPDS-17, ASM Vol. 2/1, CMH-17, producer data)"
factors = { FS_y = 1.25, FS_u = 1.4, buckling_knockdown_tube = 0.65, note = "NASA-STD-5001-style factors for a crewed structure verified by analysis and test; the project tank studies used 1.4 ultimate. Raise to FS_u 1.5/2.0 where verification is by analysis only (Phase II decision)." }
joint_factors = { parent = 1.0, fsw = 0.75, fusion_weld_heat_treatable_al = 0.55, fusion_weld_5xxx = 0.9, fusion_weld_ti = 0.9, bolted_net_section = 0.85, bonded_composite = 0.7, diffusion_bond = 0.95 }
process_factors = { wrought = 1.0, cast = 0.8, dED_as_deposited = 0.85, dED_hip_machined = 0.95, afp_thermoset_autoclave = 1.0, afp_thermoplastic_in_situ = 0.85, note = "Technology 43 ISM-33: printed primary load paths need process qualification and full inspection; DED values assume that qualification." }
env_factors = { vacuum = 1.0, humid_pressurised = 0.95, neutron_hot_zone = "OPEN (fluence-dependent; see radiation note per material)" }

