<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 230" role="img" aria-label="Manufacturing flow from Luna to the Yard"><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs><rect x="40" y="40" width="185" height="110" rx="6" fill="var(--surf2)" stroke="var(--line)"/><text x="50" y="62" class="t12 ink b">Luna surface</text><text x="50" y="82" class="t10">regolith → electrolysis → Al, </text><text x="50" y="96" class="t10">Ti, Si, Fe, O₂; rolling, </text><text x="50" y="110" class="t10">extrusion, Al₂O₃ fibre, Ti </text><text x="50" y="124" class="t10">wire </text><line x1="227" y1="95" x2="247" y2="95" stroke="var(--muted)" stroke-width="2" marker-end="url(#af)"/><rect x="250" y="40" width="185" height="110" rx="6" fill="var(--surf2)" stroke="var(--line)"/><text x="260" y="62" class="t12 ink b">Luna Lift</text><text x="260" y="82" class="t10">bulk plate, profiles, wire, </text><text x="260" y="96" class="t10">fibre to orbit (ISM-29) </text><line x1="437" y1="95" x2="437" y2="95" stroke="var(--muted)" stroke-width="2" marker-end="url(#af)"/><rect x="440" y="40" width="185" height="110" rx="6" fill="var(--surf2)" stroke="var(--line)"/><text x="450" y="62" class="t12 ink b">Harbor</text><text x="450" y="82" class="t10">receiving, imports (carbon </text><text x="450" y="96" class="t10">fibre, V, resin), QA (ISM-30) </text><line x1="627" y1="95" x2="637" y2="95" stroke="var(--muted)" stroke-width="2" marker-end="url(#af)"/><rect x="640" y="40" width="185" height="110" rx="6" fill="var(--surf2)" stroke="var(--line)"/><text x="650" y="62" class="t12 ink b">Yard</text><text x="650" y="82" class="t10">vertebra jig: FSW frames, DED </text><text x="650" y="96" class="t10">nodes, NDT, proof load as </text><text x="650" y="110" class="t10">class C modules </text><line x1="827" y1="95" x2="857" y2="95" stroke="var(--muted)" stroke-width="2" marker-end="url(#af)"/><rect x="860" y="40" width="185" height="110" rx="6" fill="var(--surf2)" stroke="var(--line)"/><text x="870" y="62" class="t12 ink b">Stack + fit</text><text x="870" y="82" class="t10">cassettes join vertebrae; </text><text x="870" y="96" class="t10">ring, collar, Brow; kinematic </text><text x="870" y="110" class="t10">mounts </text><text x="440" y="185" class="t10">Earth / asteroid imports: carbon fibre, V, resins (MX-H 11 %, MX-C 54 % of mass)</text><line x1="530" y1="172" x2="530" y2="153" stroke="var(--warn)" stroke-width="2" marker-end="url(#af)"/><text x="860" y="185" class="t10">→ ISM-31 proving ground thrust test</text></svg>