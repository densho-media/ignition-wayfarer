# Track F1 3D systems integration (owner brief 2026-11-28 07:03Z). Working config for work/ship-systems-architecture/integration3d/.
# NONCANON, PROTOTYPE. Nothing in src/, tests/, tools/, godot/, web/ or CI reads this file. The production ship (data/wayfarer_3d.toml) is unchanged.
# Reference configuration: WF-F1-P6.0 (results/phase6_config_F.json). Comparisons: WF-F0-P6.0 and WF-R-P6.0.

[config]
reference = "WF-F1-P6.0"
comparisons = ["WF-F0-P6.0", "WF-R-P6.0"]
mass_note = "8,190 t nominal departure is a working estimate (owner 2026-11-28), recomputed by each checkpoint's ledger"
hsfp = "research -> physics -> constraint -> engineering -> adaptation -> culture -> identity -> style"

# Maturity scale (owner brief): what a level promises.
[maturity]
M0 = "reservation: a volume held for a function; no internal arrangement"
M1 = "functional envelope: outer envelope, mass, interfaces and keep-outs named"
M2 = "arrangement: major components placed, routes, access and failure domains; clearances screened"
M3 = "engineering assembly: parts, supports, maintenance clearances and replacement paths; regenerable from parameters"
M4 = "production detail: not in scope of this brief"

