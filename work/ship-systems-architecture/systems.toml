# ISSA systems inventory and gap matrix (NONCANON study registry, work/ship-systems-architecture).
# One row per physical assembly group with ONE owner (owner = the family that owns the hardware; `serves` lists the others).
# Maturity M0..M7: 0 not contemplated, 1 conceptually defined, 2 requirements identified, 3 space allocated, 4 geometry proxy,
# 5 functional architecture, 6 engineering sizing, 7 integrated and validated. Visible in Blender (M4) is not functional (M5) or sized (M6).
# budget = the physics.mass_budget item that pays for it (B02). evidence = the repository artefact behind `current`.
# space_need = PROTOTYPE installed-envelope band in m3 (equipment + maintenance + removal), ISSA judgment from the cited analogue.
# impact: ARCH-H can change the ship's architecture (districts, budgets, interfaces); ARCH-M local packaging; ARCH-L fit-out.
# priority: P1 next phase, P2 needed before WF-R1 integration, P3 later, P4 optional. Status words keep their canon meaning.

