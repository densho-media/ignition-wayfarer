<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter,system-ui,sans-serif" font-size="12" role="img" aria-label="Blade cross-sections">
<style>.t{fill:var(--fg,#223)} .m{fill:var(--muted,#667)}</style>
<text x="20" y="24" class="t" font-weight="600">HOT (M2): chordwise, 1800 K</text>
<rect x="20" y="60" width="290" height="36" fill="#e14b2a" fill-opacity="0.22" stroke="#e14b2a"/>
<text x="20" y="130" class="m">radial Li manifolds every 2.94 m, fins +-1.47 m</text>
<text x="20" y="148" class="m">aft-pointing fins at 0.74 g: 1.30 m effective</text>
<text x="20" y="166" class="m">capacity factor 0.944 (0.77 GW)</text>
<text x="20" y="184" class="m">fix: forward fins only, 106 manifolds/blade</text>
<text x="20" y="202" class="m">trunk shading bound 3.4 % (0.47 GW)</text>
<rect x="30" y="56" width="6" height="44" fill="#8a2a1a"/><line x1="13" y1="62" x2="53" y2="62" stroke="#c0502a" stroke-width="2"/>
