<text x="350" y="24" class="t" font-weight="600">WARM (M2): 440 K pumped panels</text>
<rect x="350" y="60" width="290" height="36" fill="#f0b03a" fill-opacity="0.22" stroke="#f0b03a"/>
<text x="350" y="130" class="m">pressurised water 1.1 MPa</text>
<text x="350" y="148" class="m">A/B tubes interleaved, pitch 100 mm</text>
<text x="350" y="166" class="m">eta both loops 0.925, one loop 0.732</text>
<text x="350" y="184" class="m">after a loop loss 79 % capacity</text>
<text x="350" y="202" class="m">225 tubes per face, x 50.4-72.9</text>
