<text x="100" y="550" class="m">K heat pipe OD 25 mm, wall 0.8 mm, screen wick + 2 arteries 2 mm; C-C face 1.2 mm, fin efficiency 0.985-0.990</text>
<text x="100" y="570" class="m">2192 pipes per blade (4 rows x 548), 4.54 m long; worst limit margin 1.59; NaK headers D 182 mm, serpentine out along bay 1, back along bay 2</text>
