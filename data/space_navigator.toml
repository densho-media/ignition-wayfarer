# WAYFARER Space Navigator, Stage 2 (S&E 55 SPACE-015/017/019/030, 47 SIM-039, Tale 26 NAV-TOUR-11, Art Style Objects & Tech row 19):
# the Solar System chart's reference bodies. These are educational astronomy from published references, not IGNITION canon and not
# Wayfarer data. The registry holds sizes and orbit shapes only: no epoch, longitude, anomaly or any other value that would place a body at a
# date. The chart's arrangement is SCHEMATIC until the owner releases an epoch and ephemerides (SPACE-010/016, 25!F14:F15).
# Values are copied as the references print them; src/wayfarer/space_navigator.py derives AU with the IAU 2012 exact astronomical unit.

[space]
id = "WF.SPACENAV"
version = 1
status = "PROTOTYPE"
schematic_notice = "SCHEMATIC — EPOCH / SHIP POSITION UNRESOLVED"
au_km = 149597870.7                   # IAU 2012 Resolution B2 (exact)
au_ref = "IAU_2012_B2"

[reference.NASA_PLANETARY_FACT_SHEET]
title = "NASA GSFC Planetary Fact Sheet - Metric"
url = "https://nssdc.gsfc.nasa.gov/planetary/factsheet/"
updated = "2025-03-18"
retrieved = "2026-10-13"
status = "REFERENCE"

[reference.NASA_SUN_FACT_SHEET]
title = "NASA GSFC Sun Fact Sheet"
url = "https://nssdc.gsfc.nasa.gov/planetary/factsheet/sunfact.html"
updated = "2024-05-09"
retrieved = "2026-10-13"
status = "REFERENCE"

[reference.NASA_KUIPER_BELT_FACTS]
title = "NASA Science, Kuiper Belt: Facts"
url = "https://science.nasa.gov/solar-system/kuiper-belt/facts/"
updated = "2025-03-13"
retrieved = "2026-10-13"
status = "REFERENCE"

[reference.IAU_2012_B2]
title = "IAU 2012 Resolution B2: the astronomical unit is 149,597,870,700 m exactly"
url = "https://www.iau.org/static/resolutions/IAU2012_English.pdf"
updated = "2012-08-31"
retrieved = "2026-10-13"
status = "REFERENCE"

# The Sun: radius only (it is the chart's origin, a schematic choice, not a released frame).
[[body]]
id = "SUN"
name = "Sun"
kind = "star"
ref = "NASA_SUN_FACT_SHEET"
radius_km = 695700.0
why = "Every orbit on this chart is drawn around it. Wayfarer's distance from it at any moment is not released, so the chart cannot say how far away the ship is."

# Planets: diameter, mean distance, perihelion and aphelion (10^6 km), period (days), eccentricity and inclination as the fact sheet lists them.
[[body]]
id = "MERCURY"
name = "Mercury"
kind = "planet"
ref = "NASA_PLANETARY_FACT_SHEET"
diameter_km = 4879.0
distance_1e6km = 57.9
perihelion_1e6km = 46.0
aphelion_1e6km = 69.8
period_days = 88.0
eccentricity = 0.206
inclination_deg = 7.0
why = "The most eccentric planetary orbit: its distance from the Sun changes by about half between perihelion and aphelion, so one orbit guide circle hides a wide band."

