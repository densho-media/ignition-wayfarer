# Regional guides: drawn as bands, selectable for a card, never an event position (SPACE-017; 24_ROUTE_EVENTS KUIPER_BRAKE_DEADLINE is OPEN).
[[region]]
id = "KUIPER_BELT_MAIN"
name = "Kuiper Belt (main region)"
ref = "NASA_KUIPER_BELT_FACTS"
inner_au = 30.0
outer_au = 50.0
note = "Inner edge at about Neptune's orbit, about 30 AU; the main region ends around 50 AU. The scattered disk continues outward to nearly 1,000 AU and is not drawn."
why = "A doughnut-shaped region of icy bodies, not a wall. The Tale's Kuiper events (brake deadline, anchorage) have no released time or position (24_ROUTE_EVENTS, 25!F17, F19), so the chart marks the region only."

# Display transforms (C-004, C-012, SPACE-007): named, reversible, applied only to the drawing, never to a source value.
[transform.ANALYTICAL]
distance = "LINEAR"                   # r_px = scale * a_AU
size = "TRUE"                         # radius at the same scale; a body under 1.5 px is drawn as a fixed glyph, labelled so
disclosure = "ANALYTICAL · distances to scale · bodies far smaller than their glyphs"

[transform.PRESENTATION]
distance = "SQRT"                     # r_px = R * sqrt(a_AU / a_ref); inverse a_AU = a_ref * (r_px / R)^2
size = "LOG"                          # glyph px = 3 + 2.4 * log10(radius_km / 1000)
disclosure = "PRESENTATION · distances compressed (square root) · planets enlarged · not to scale"

