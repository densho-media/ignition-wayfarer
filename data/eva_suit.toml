# SP-11 1.20 m sliding plug (owner direction 2026-10-11: S&E 15!A134 AIRLOCK-004 STUDY DIRECTION ACCEPTED / STRUCTURAL FLIGHT RELEASE HOLD,
# 43 EVA-062 PREFERRED PROTOTYPE / PRESSURE FLIGHT HOLD, 45 I-01..I-04). Every geometry value is a PROTOTYPE choice of the study, not a rating.
[sp11_plug]
aperture_m = 1.20
dog_count = 12                     # radial dogs on the leaf rim, engaging keeper lugs on the SP-12 side of the frame (reverse retention)
dog_h_m = 0.02                     # dog axial thickness
ledge_h_m = 0.02                   # keeper ledge under a dog (the bearing face for chamber-high pressure)
dog_w_m = 0.08                     # dog tangential width
dog_stroke_m = 0.03                # radial travel; inside the 0.05 m seat band
seal_band_frac = 0.5               # the face seal sits this fraction across the 0.05 m seat band from the bore (PROTOTYPE)
friction = 0.15                    # dog / ledge friction, a diagnostic assumption for the self-locking check
face_draft_deg = 2.0               # tolerance draft of the bearing faces (nominal 0)
toggle_throw_m = 0.05              # crank radius of the dog-cam toggle; it locks over centre by this angle against a fixed stop
toggle_overcentre_deg = 8.0
block_pin_d_m = 0.012              # Δp-interlock blocking pins on the dog cam ring (two, opposite)
step_lateral = 8                   # samples of the lateral park
strap_tail_stowed_m = 0.05         # litter strap tail beyond the rail with the buckle tucked
strap_tail_loose_m = 0.25          # litter strap tail left hanging (sensitivity)
strap_band_m = 0.05
strap_stand_off_m = 0.04           # strap over the suit front
strap_fracs = [0.85, 0.55, 0.30, 0.08]    # chest, hips, knees, ankles, as fractions of the body span on the frame
panel_prot_m = 0.06                # control panel stand-off from the wall (handwheel plane)
panel_len_m = 0.60                 # panel length along the axis: release ring, valve, gauge at -0.20 / 0 / +0.20
panel_half_w_m = 0.08
panel_pitch_m = 0.20
lever_arc_min_m = 0.30             # panel to the wall lever stations
gauge_view_max_m = 1.0             # head to the gauge, PROTOTYPE
standoff_sp12_m = 0.10             # SP-12 side: front of the body to the chamber's outer wall at the station
# Interlock test point and force targets (45 I-01..I-04). Thresholds are inputs: the study threshold stays OPEN.
dp_test_point_kpa = 0.05           # I-01 STUDY ONLY
lever_force_target_n = 50.0        # I-03 HUMAN FACTORS STUDY
reverse_load_readback_n = 106185.8317 # 45 I-08 owner bounding diagnostic (Ø1.30 m outer leaf x 80 kPa; I-04 106 kN superseded)
