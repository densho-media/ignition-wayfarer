# Ship systems registry (DR-13, ISSA Phase II, owner brief 2026-11-27). PROTOTYPE, read by src/wayfarer/systems.py.
# One row per physical assembly with ONE physical owner (family) and ONE mass-budget owner (budget_item, a physics.mass_budget id or a
# PROPOSED line below). Functional relations (serves, interfaces) are separate from ownership. Values owned elsewhere are referenced:
# loads are power.loads ids, mass_ref / spec paths point at their owner; a mass band here is a PROTOTYPE estimate only where no other
# owner exists. mass_kg = [low, nominal, high]; mass_open = true keeps an unsized assembly OPEN (planning_kg reported apart, never in a sum).
# Started with EPS and TMS; the full 56-assembly ISSA study inventory (work/ship-systems-architecture/systems.toml on the ISSA branch)
# is the broader reference and is not read by code.
# maturity: 0 not contemplated, 1 conceptually defined, 2 requirements identified, 3 space allocated, 4 geometry proxy, 5 functional
# architecture, 6 engineering sizing, 7 integrated and validated.

[registry]
status = "PROTOTYPE"
families = ["EPS", "TMS"]
failure_domains = ["DRIVE_AFT", "POWER_DISTRICT_A", "POWER_DISTRICT_B", "MIDBODY_STORES", "RAD_ZONE", "ROTOR_RINGS", "FORWARD_SERVICE", "BLADES"]
proposed_budget_items = [
  { id = "PROPOSED.burn_generation", note = "Drive-derived electrical generation (L1); proposed under drive_package, owner decision DR-04" },
  { id = "PROPOSED.ship_service_generation", note = "Continuous ship-service generation (L2) and its shielding; no line exists (DR-04)" },
  { id = "PROPOSED.power_thermal_machinery", note = "Burn heat pumps, L1 conversion reject panels, engagement thermal buffer, warm-loop pumps; no line exists (DR-04)" },
  { id = "PROPOSED.survival_generation", note = "L3 30-day survival source when it no longer fits power_computers_steering_comms (DR-04, ISSA Phase III ledger)" },
  { id = "PROPOSED.mission_provisioning", note = "Departure loading per mission beyond the 10 t food_consumables line: consumables, spares, medical (DR-04, DR-07/14; mission cargo, not dry mass)" },
  { id = "PROPOSED.rcs_propellant_tankage", note = "RCS propellant and its tankage; selection OPEN (DR-04, DR-09)" },
]

[[system]]
id = "EPS-01"
family = "EPS"
name = "Drive-derived generation (L1 burn bus)"
serves = ["TMS-04", "PROP", "PROT"]
budget_item = "PROPOSED.burn_generation"
mass_open = true
planning_kg = [150000.0, 400000.0, 900000.0]   # 210-260 MWe at 0.7-3.5 kg/kWe (INL multi-MWe Brayton 3.5 kg/kWe conversion incl. PMAD)
loads = []
heat = "HOT"
interfaces = [{ kind = "HEAT", with = "TMS-01", via = "drive hot loop tap" }, { kind = "ELECTRIC", with = "EPS-06", via = "L1 burn bus" }]
failure_domain = "DRIVE_AFT"
district = ["D2_AFT_ENGINEERING", "M1", "M2"]
sources = ["spec:power.generator_count", "spec:power.rating"]
maturity = 4
open = ["conversion type and rating", "where the 210 MW tap is taken", "budget line"]

[[system]]
id = "EPS-02"
family = "EPS"
name = "Ship-service generation (L2, independent of propulsion)"
serves = ["ECLSS", "CDH", "GNC", "COMMS", "PROT", "TMS-07"]
budget_item = "PROPOSED.ship_service_generation"
mass_open = true
planning_kg = [12000.0, 60000.0, 200000.0]    # EPS-B trade result range for the proactive working case (work/ship-systems-architecture)
loads = []
heat = "WARM"
interfaces = [{ kind = "HEAT", with = "TMS-02", via = "coast rejection (DR-03 OPEN)" }, { kind = "ELECTRIC", with = "EPS-06", via = "buses A and B" }]
failure_domain = "POWER_DISTRICT_A"
district = ["M1", "M2", "M3", "M4"]   # ISSA Phase II layouts L-A (M3/M4) and L-E (M1-M2, working candidate); candidates only (DR-12)
sources = ["spec:power.hotel_source"]
maturity = 1
open = ["technology (fission-Brayton reference, auxiliary fusion alternative)", "modularity: 3+1 x ~1.75 MWe working case (ISSA Phase II)", "shielding: shadow cone plus a blade-facing scatter band (transport calculation needed)", "heat path in burns (warm channels drained: hot standby)", "crew exclusion in line of sight of running units (DR-15)"]

