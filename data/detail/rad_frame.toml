# Detail pack rad_frame (docs/MODULES.md): production fittings on the radiator blade's truss frames and aft edge, module WF-THERMAL.
# Revised in Phase 4 S5 (owner S1 art gate 2026-10-24: REVISE): the ship-scale frame rhythm is carried by value (the blade frames, edge
# chords and joint beads take the light xf_frame family over the dark thermal sheet, [production.exterior]); the fittings stay the
# close-up tier in the shared families. Still L4_VISUAL_CANDIDATE until the owner reviews it.
# Owned by a WF-THERMAL detail session: this manifest, src/wayfarer/detail/pack_rad_frame.py and the generated
# assets/wayfarer/detail/WF_DETAIL_RAD_FRAME.blend, linked once into WF_RADIATOR (the blade component) and so carried by all three blades.
# Modular pilot 2a (2026-10-22). Every value is a PROTOTYPE depiction choice: band clamps on the transverse frames, gusset plates at the
# truss nodes and an aft edge guard. Nothing lies over an emitting cell (each footprint stays inside a 0.125 m non-emitting bay joint or
# beyond the blade's ends), so the physical radiator area, the cells and the health overlays are unchanged; no load, mass or thermal claim.
[pack]
module = "WF-THERMAL"
version = 1
scope = "pack"
enabled = true
maturity = "L4_VISUAL_CANDIDATE"
status = "PROTOTYPE"
evidence_ref = "l4_production_gate"
detail_class = "PRODUCTION"
inspect = ["thermal"]
views = ["root_detail", "joint_detail"]
summary = "Band clamps on the blade's transverse frames, gusset plates at the truss nodes and an aft edge guard, on all three blades."

[assembly."RAD.FRAME"]
anchor = "WF-THERMAL.RADIATOR.ORIGIN"
zone = "radiator blade truss frames and aft edge (blade-local: u along the blade, v from the root edge, z normal to the sheet)"
classes = ["ENGINEERING_FLEXIBLE"]
# Claimed space in the blade frame (m): the blade's length plus 0.2 m at each end, its width from the root edge, the truss depth plus 0.2 m.
envelope_min = [-91.3, 0.0, -1.7]
envelope_max = [91.3, 30.5, 1.7]

[params]
# Band clamps round each transverse frame tube (r 0.10 m at z = +-truss_depth/2), clamps_per_frame evenly across the width.
clamp_u_m = 0.09          # along the blade: inside the 0.125 m bay joint at every interior station
clamp_v_m = 0.30
clamp_z_m = 0.30
clamps_per_frame = 5
# Gusset plates where the frame, the edge chords and the depth posts meet (both blade edges, both truss faces).
gusset_u_m = 0.10
gusset_v_m = 0.60
gusset_z_m = 0.50
# Aft edge guard: a strip just aft of the first cell column, off the root and outer edges by edge_inset_m.
edge_u_m = 0.08
edge_gap_m = 0.02
edge_z_m = 0.10
edge_inset_m = 0.30
bevel_m = 0.008
# Materials: the shared exterior families [production.exterior.families] (Phase 4 S5): clamps graphite machinery, gussets and edge
# guard mid-value structure.
