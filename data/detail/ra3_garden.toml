# Detail pack ra3_garden (docs/MODULES.md): the first cultural pass (S8b Z1) of ring A sector 3 (LIFE_SUPPORT_GARDEN_COMMON), module
# WF-RING-A. Owned by a WF-RING-A detail session: this manifest, src/wayfarer/detail/pack_ra3_garden.py and the generated
# assets/wayfarer/detail/WF_DETAIL_RA3_GDN.blend, linked by WF_HABITAT at the sector instance (1, 3). Garden/mess K2 reading (S8b):
# Spacer Contain (cushioned benches and a fiddle-railed table for a spinning, burning ship), GU Order (standard service panels and a
# labelled resource board on the ECLSS bay), restrained Bolt-Sworn / Robocrat Humanize (a mug rail with one colour per booth place, a
# personal cubby shelf, a maintenance tag). Grow-light bars hang under the Garden rack's lid and trays, daylight panels light the table.
# Every value is a PROTOTYPE depiction choice: everything stays inside its whitebox block, on the outer wall above the booth back, in
# the ECLSS bay's service recess or in the overhead band, clear of the aisle, the access strips, the through-passage and the landing
# well; no pressure boundary, interface, route clearance, load, power, light level or growing area is claimed.
[pack]
module = "WF-RING-A"
version = 1
scope = "pack"
enabled = true
maturity = "L4_VISUAL_CANDIDATE"
status = "PROTOTYPE"
evidence_ref = "l4_production_gate"
detail_class = "PRODUCTION"
inspect = ["rotation", "route"]
views = ["overhead", "cutaway"]
summary = "Garden/mess cultural pass: bench cushions, fiddle-railed table, mug rail and cubbies, daylight and grow lights, the ECLSS string (CO2, O2, water, Sabatier, trace units) and resource board."

[assembly."RA3.GDN"]
anchor = "WF-RING-A.SECTOR.1.3"
function = "LIFE_SUPPORT_GARDEN_COMMON"
zone = "ring-A sector 3 LIFE_SUPPORT_GARDEN_COMMON (sector frame: +X axial, +Y down in spin, +Z tangential; deck at y 0)"
classes = ["ENGINEERING_FLEXIBLE", "ARTISTIC"]
# Claimed space in the sector frame (m): the Garden rack, the mess booth and the outer wall above it, the ECLSS bay's recess and the
# overhead band above the table.
envelope_min = [-0.40, -2.90, -2.56]
envelope_max = [1.60, 0.00, 2.80]

[params]
overhead_y_m = -2.90
band_y_m = -2.85          # the overhead band's lower edge
wall_gap_m = 0.006        # wall-mounted parts stand this far off the sloping outer wall
cushion_m = 0.05          # seat cushion thickness
back_cushion_m = 0.04
back_cushion_y_m = [-1.00, -0.52]
cushion_inset_m = 0.03
rail_r_m = 0.008          # table fiddle rail: spill lip for Coriolis and burn transients
rail_h_m = 0.025
rail_inset_m = 0.02
mug_rail_y_m = -1.55
mug_rail_r_m = 0.010
mug_r_m = 0.038
mug_h_m = 0.095
crew = 6                  # one mug and one cubby per booth place (the booth seats six)
shelf_y_m = -1.98         # cubby shelf floor
shelf_h_m = 0.22
shelf_depth_m = 0.16
shelf_x_m = [-0.35, 0.70]
light_bar_m = [0.04, 0.012]   # grow-light bar: width (z), depth (y)
light_bars = 2                # per tier, across the rack depth
daylight_z_m = [1.45, 2.15]
daylight_m = 0.018
eclss_face_x_m = 1.10     # the bay's open face; the drawn block stops SERVICE_RECESS_M behind it
panel_t_m = 0.010
board_z_m = [-2.46, -1.92]
board_y_m = [-1.95, -1.15]
access_z_m = [-0.92, -0.52]
access_y_m = [-1.90, -0.25]
# ECLSS string (2026-10-31, Claude under the owner's delegation, PROTOTYPE): the bay holds one complete regenerative life-support string,
# and the ring-B Garden sector the second (rb_fitout), so either ring carries the crew if the other string or ring is lost. Rates are the
# owner's 41_SURVIVAL_RESOURCES study rates (data/life_support.toml: O2 0.84, CO2 1.0, water turnover 4.16 kg per person-day; NASA BVAD
# NASA/TP-2015-218570 gives 0.82 / 1.04 / 2.5 potable). Each string is sized for string_crew at nominal and string_peak x nominal at its
# maximum (the ISS OGA runs 5.4 kg/day nominal, 9.25 kg/day maximum: 1.7x), so one string alone carries 10 people and the two the 41 stress
# case of 12. Electrolysis stack + supply efficiency against water's higher heating value; CO2 is reduced by Sabatier with the electrolysis
# hydrogen (H2-limited), the rest goes to the Garden or overboard (OPEN, 41 o2_recovery = 0). Module envelopes are packaging allocations
# behind the service face (depth along +X from the drawn block face), not sourced hardware volumes.
string_crew = 6
string_peak = 1.7
electrolysis_efficiency = 0.60
eclss_plate_x_m = [1.152, 1.160]   # unit front plates in the service recess, against the drawn block face
eclss_units = [
  { id = "CO2", label = "CO2 SCRUB", material = "ra3_co2", z = [-2.50, -1.97], y = [-1.05, -0.05], depth_m = 0.40, function = "amine swing-bed CO2 removal, two beds (one adsorbing, one desorbing to vacuum)" },
  { id = "O2", label = "O2 GEN", material = "ra3_oxygen", z = [-1.93, -1.06], y = [-1.05, -0.05], depth_m = 0.42, function = "water electrolysis oxygen generator, cell stack, water feed and H2 line to the reactor" },
  { id = "H2O", label = "WATER", material = "ra3_water", z = [-0.94, -0.52], y = [-1.92, -0.05], depth_m = 0.42, function = "water processor: urine distillation, multifiltration beds, catalytic oxidizer, potable tank feed" },
  { id = "SAB", label = "CO2 REDUCE", material = "ra3_co2", z = [-1.87, -1.40], y = [-1.85, -1.12], depth_m = 0.30, function = "Sabatier reactor: CO2 + 4 H2 to CH4 + 2 H2O, the water back to the processor, methane overboard" },
  { id = "TCC", label = "TRACE", material = "ra3_oxygen", z = [-1.36, -1.06], y = [-1.85, -1.12], depth_m = 0.30, function = "trace contaminant control: charcoal bed and catalytic oxidizer" },
]
bevel_m = 0.003

