# Detail pack ring_b_exterior (docs/MODULES.md): ring B's exterior in the selected Phase 4 grammar (VC+ moderated, owner S1 art gate
# 2026-10-24; Art Style Bible Spacecraft row 19), module WF-RING-B, slice S4. The 15 deg segment module of src/wayfarer/ring_exterior.py
# (shared with ring_b_exterior) on all 24 segments of ring B, in the rotor frame (anchor WF-RING-B.ROTOR.2: Rotor_2, turns with the ring).
# Owned by a WF-RING-B detail session: this manifest, src/wayfarer/detail/pack_ring_b_exterior.py and the generated
# assets/wayfarer/detail/WF_DETAIL_RB_EXT.blend. Every value is a PROTOTYPE depiction choice: no load, shielding, mass, balance,
# pressure boundary, interface or mechanism; the frame, sweep, sectors, spokes and crew route are unchanged (screen: ring_exterior.check).
[pack]
module = "WF-RING-B"
version = 1
scope = "pack"
enabled = true
maturity = "L4_VISUAL_CANDIDATE"
status = "PROTOTYPE"
evidence_ref = "p4_exterior_grammar"
detail_class = "PRODUCTION"
inspect = ["rotation"]
views = ["ring_detail", "habitat_detail"]
summary = "Shell cassettes, joint caps, spoke node housings, occupancy bands, sector IDs, blue identifier bars, spin-index marks and lit shuttered viewports on ring B's 24 segments; service trays on its structural spokes and thermal blankets on its inner face."
# Godot draw range per family by scale tier ([production.exterior] tier_range_m): the segment rhythm (cassettes, joints, bands, IDs)
# reads at whole-ship distance; node housings and identifier bars at subsystem distance.
detail_tiers = { default = "meso", cassettes = "macro", joints = "macro", occupancy = "macro", markings = "macro", spin_index = "macro", viewports = "meso", trays = "meso", blankets = "macro" }

[assembly."RB.EXT.FWD"]
anchor = "WF-RING-B.ROTOR.2"
zone = "ring B +u (forward) flank, outside the frame body and the sector envelopes (rotor frame: u along the ship axis)"
classes = ["ENGINEERING_FLEXIBLE", "ARTISTIC"]
# Claimed space in the rotor frame (m): from the sector face (1.75) to the sweep half-depth (2.15) axially, the frame outer radius.
envelope_min = [1.74, -30.01, -30.01]
envelope_max = [2.15, 30.01, 30.01]

