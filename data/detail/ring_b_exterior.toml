# The segment module (ring_exterior.elements). Offsets in m outward from the frame flank (|u| = 2.0 m), radii from the frame's.
[params]
cassette_u_m = [0.02, 0.06]
cassette_joint_gap_m = 0.36
pressure_panel_gap_m = 0.01
pressure_panel_m = 0.025
band_r_m = [0.45, 1.05]
film_m = 0.003
joint_cap_u_m = 0.11
joint_gap_m = 0.08
joint_cap_m = 0.22
node_half_deg = 2.5
node_u_m = 0.12
node_height_m = 1.4
node_cover_half_deg = 1.6
id_bar_width_m = 1.4
id_bar_m = 0.14
id_bar_gap_m = 0.08
# Habitat ring refinement (2026-11-02, PROTOTYPE depiction): what makes the ring read as an inhabited, turning wheel.
# Spin index: a charcoal block on the first half of every 15 deg segment outside the pressure segments, on the flank's outer edge
# (radii inward from the rim; it shares the band's radii, which only the pressure segments carry).
index_r_m = [0.08, 1.02]
# Viewports: count per sector flank, tangential pitch, clear pane, frame ring width, eye height above the deck (centre radius = floor - eye),
# frame/pane proud of the pressure-face panel, shutter plate (half size, thickness) and its travel toward the hub when open; shutter pattern
# (1 closed, 0 open) cycled by segment and viewport index.
viewport_count = 4
viewport_pitch_m = 1.15
viewport_clear_m = 0.40
viewport_frame_m = 0.11
viewport_eye_m = 1.55
viewport_frame_proud_m = 0.06
viewport_pane_proud_m = 0.02
viewport_shutter_half_m = 0.32
viewport_shutter_m = 0.04
viewport_shutter_travel_m = 0.72
viewport_closed = [0, 0, 1, 0, 0, 0, 1]
# Spoke service tray (between the twin rails) and inner-face blankets.
tray = { root_gap_m = 0.25, end_gap_m = 0.15, width_m = 0.36, depth_m = 0.14, wall_m = 0.03, line_m = 0.08, clamp_pitch_m = 2.4, split_r_m = 9.0 }
blanket = { u_m = [0.95, 1.90], thickness_m = 0.04, gap_m = 0.10, spoke_clear_m = 1.6 }
