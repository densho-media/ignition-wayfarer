# Detail pack rb_fitout (docs/MODULES.md): ring B's cultural pass (S5 / P4 S8b, owner go 2026-10-30), module WF-RING-B. Ring B repeats
# ring A's sector functions (ring_functions MIRRORED), so its three sectors take ring A's accepted cultural passes by one definition:
# RB1.BRT the berths (ra1_berths), RB2.WRK the work/medical/ops room (ra2_work, below ring B's own RB.SEC overhead layer) and RB3.GDN
# the Garden and mess (ra3_garden), with ring A's values (read from those manifests) and ring A's checks. Cultural reading: every crew
# member keeps a berth, a mug and a cubby in each ring in the same colour, so a lost ring (D01) costs no one their place. Owned by a
# WF-RING-B detail session: this manifest, src/wayfarer/detail/pack_rb_fitout.py and the generated WF_DETAIL_RB1_BRT.blend,
# WF_DETAIL_RB2_WRK.blend and WF_DETAIL_RB3_GDN.blend. Every value is a PROTOTYPE depiction choice; nothing claims a pressure
# boundary, interface, route clearance, load, power, light level or growing area.
[pack]
module = "WF-RING-B"
version = 1
scope = "pack"
enabled = true
maturity = "L4_VISUAL_CANDIDATE"
status = "PROTOTYPE"
evidence_ref = "l4_production_gate"
detail_class = "PRODUCTION"
inspect = ["rotation", "route"]
views = ["overhead", "cutaway"]
summary = "Ring B cultural pass: ring A's berth, work/medical/ops and Garden/mess passes repeated in ring B's three sectors."

[assembly."RB1.BRT"]
anchor = "WF-RING-B.SECTOR.2.1"
