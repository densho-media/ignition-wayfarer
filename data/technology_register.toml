[[technology]]
id = "FT-09"
name = "High-temperature power electronics and machinery for the 451 K WARM loop"
status = "APPROVED"
level = "B"
decision = "DR-C-01 (owner 2026-11-28 10:51Z): WARM operates at 451 K on its existing radiator area; advanced high-temperature components where appropriate; separate thermal interfaces for temperature-sensitive machinery"
principle = "Wide-bandgap semiconductors keep their junctions working at high temperature; ceramic-insulated windings and magnetic or gas bearings run without organic insulation or lubricants."
precedent = "SiC MOSFETs rated to 448-473 K junction today, SiC devices demonstrated near 773 K in research; ceramic- and mica-insulated motor windings (class C, > 493 K); magnetic bearings in turbomachinery."
limitation = "Commercial SiC power modules are packaged for <= 448-473 K junction; packaging, gate drivers and capacitors limit continuous high-temperature life."
advance = "SiC/GaN-HT power stages and their packaging, gate drives and capacitors run continuously at <= 523 K junction on 440-451 K coolant; WARM-loop pump and fan motors use ceramic-insulated windings (>= 523 K) and magnetic or gas bearings."
adopted = { warm_T_K = 451.0, coolant_supply_return_K = [440.0, 451.0], junction_max_K = 523.0, winding_class_K = 523.0, sensitive_items = "control electronics, sensors, lubricated mechanisms, batteries and capacitors on the LOW loop (316-320 K) through cold plates" }
dependents = ["WARM radiator sections", "HVDC converters on the WARM loop", "WARM pumps", "ride-through stores (on LOW)"]
consequence = "WARM must reject at <= 440 K: the 496 kW shortfall needs new WARM area that the envelope does not have, or HOT heat-pump duty returns (0.39 GW HOT reserve shrinks)."
source = "work/ship-systems-architecture/integration3d/consolidate.py warm_machinery()"
