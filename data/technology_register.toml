# Wayfarer fictional technology register (Track F). NONCANON working register, not a parameter source.
#
# Wayfarer has two tracks (AGENTS.md "Dual development"): Track R (research) computes what today's physics and engineering support and
# publishes the result, including architectures that do not close. Track F (fiction) is the idealized hard-SF ship of IGNITION's
# civilization: it may adopt an advance beyond today's engineering, never beyond established physics, and only when that advance is
# written here first. Each entry records the physical principle, the existing precedent, today's limit, the advance needed, the adopted
# fictional properties, the systems that depend on it, and the consequence if the assumption were not met. Research values stay in the
# Track R results; an entry never replaces them.
#
# status: CANON (owner workbooks), APPROVED (owner direction, working fictional assumption), CONDITIONAL (approved as a direction,
# acceptance waits for a stated ledger), PROPOSED (Claude candidate awaiting the owner), CONTEMPORARY (no fictional advance needed).
# level: the PMDS material levels (docs/MATERIALS.md) applied to technology: A existing, B plausible development, C speculative.
# Nothing in src/, tests/, tools/, godot/ or CI reads this file; the ISSA study (work/ship-systems-architecture/phase6) labels its Track F
# values with these ids. Physical conservation holds in every entry.

[register]
version = "1.2"
created = "2026-11-28"
basis = "owner ISSA Phase VI brief 2026-11-28 (DR5-01..08); ISSA closeout 2026-11-28 10:51Z (DR-C-01..05); PMDS levels; existing canon fictional technologies (Fiji/Lattice drive)"
civilization = """IGNITION's spacefaring civilization is a mature high-temperature and plasma civilization: it builds hermetic ceramic-matrix and \
carbon-composite pressure systems that run near 2000 K for years, handles liquid alkali metals routinely, converts directly between plasma \
motion and electricity, and maintains large ships with autonomous robots. It has NOT repealed any physical law: radiators still reject \
heat as sigma T^4, energy and momentum are conserved, neutrons still need mass to stop, and cryogenic stages still pay Carnot. The register \
keeps its advances to this one family (high-temperature materials, plasma electromagnetics, autonomy) so that they support each other \
instead of being unrelated conveniences."""

[[technology]]
id = "FT-00"
name = "Fiji/Lattice D-He3 fusion drive"
status = "CANON"
level = "C"
principle = "D-3He fusion; magnetic nozzle directs charged products (exhaust velocity 19,201 km/s, directed efficiency 0.8)."
precedent = "D-3He burn physics; magnetic-nozzle plasma experiments (VASIMR, MN-1); ICF/MIF ignition physics."
limitation = "No D-3He ignition with gain; absorbed fraction 4e-5 of fusion power is a requirement, not a demonstrated property (data: physics.operating_point)."
advance = "Canon Fiji lattice / optically gated manifold (owner workbooks)."
adopted = { absorbed_fraction = 4.0e-5, exhaust_velocity_m_s = 19201172.08, thrust_cap_N = 21770763.0 }
dependents = ["FT-04", "hot loop (H6a)", "HOT radiators"]
consequence = "Outside the scope of ISSA: the drive is canon and its parked Vertex research stays parked (owner)."
source = "data/wayfarer_3d.toml physics.operating_point; lab/studies/vertex-closure"

[[technology]]
id = "FT-01"
name = "Refractory-composite pressure boundary"
status = "APPROVED"
level = "C"
decision = "DR5-03 (owner 2026-11-28)"
principle = "Hoop stress sigma = p D / 2 t; creep-limited allowable at temperature sets the wall."
precedent = "C/C and C/SiC composites (re-entry thermal protection, rocket nozzle extensions, ~2000 K short duration); SiC/SiC CMC turbine parts (~1600 K, commercial engines); refractory-lined Li loops (SP-100, ~1350 K)."
limitation = "No composite is hermetic to liquid Li at ~2000 K for years: Li attacks SiC and carbon, composites are porous and creep data near 2000 K for 1e4-1e5 h do not exist. Research walls use Mo-Re / W-Re at 8-30 MPa allowable and 10.2 t/m3 (Track R)."
advance = "A hermetic, Li-compatible fibre-reinforced refractory composite tube with an integral liner, qualified for long-duration creep near 2000 K."
adopted = { allowable_stress_Pa = 1.0e8, density_kg_m3 = 3000.0, max_temperature_K = 2000.0, coolant = "liquid lithium", hermetic = true }
dependents = ["FT-02", "FT-03", "FT-06", "H6a hot network (Track F)", "L1 direct-conversion pickup cooling"]
consequence = "Track F hot-network hardware rises from ~0.55 kt to ~2.3 kt (Track R H6a, 15 MPa Mo-Re), and the coupled departure mass with it (phase6.json mass)."
apply_rule = "Use only for pressure boundaries above ~1300 K that carry Li or hot gas (hot loop, L2 hot side, DC pickup cooling). Not for cryogenic tanks, habitat pressure hulls, radiation shields or structure, where it brings no physical advantage."
source = "work/ship-systems-architecture/phase5 (material sensitivity, C/C-SiC row)"

[[technology]]
id = "FT-02"
name = "High-temperature lithium transport"
status = "APPROVED"
level = "B"
decision = "DR5-02, DR5-04 (owner 2026-11-28)"
principle = "Sensible heat transport m cp dT; EM pumping of a conducting liquid; vapour pressure and hydrostatic head set the pressure."
precedent = "SP-100 and SNAP Li/NaK loops; annular linear induction pumps; Li-cooled reactor test loops at 1350-1500 K."
limitation = "Li at ~1990 K inlet is beyond demonstrated loop temperatures; EM pump efficiency at high temperature is 0.25-0.45; frozen start needs ~140 GJ of thaw and preheat."
advance = "Li loops and EM pumps run reliably near 2000 K inside FT-01 boundaries for the service life; trace heating and drain/recovery systems routine."
adopted = { coolant = "Li", inlet_K = 1990.0, dT_K = 300.0, topology = "H6a: two redundant trunk paths, isolatable sections, heat-pipe fins, cross-feed", em_pump_efficiency = 0.35 }
dependents = ["hot loop H6a", "HOT radiators", "FT-04 sink"]
consequence = "Without it the HOT radiators cannot be fed at 1800 K mean surface; the drive's absorbed heat has no sink."
source = "work/ship-systems-architecture/phase5/hot.py; integration3d/radiators3d.py hot_fins; integration3d/consolidate.py"

[[technology]]
id = "FT-03"
name = "High-temperature closed-Brayton turbomachinery (1500 K turbine inlet)"
status = "APPROVED"
level = "B"
decision = "owner DR5-01 asked for the investigation (2026-11-28 06:33Z); approved as an explicit fictional development assumption in the 3D integration brief (2026-11-28 07:03Z), F1 = Track F reference; component set approved as DR-3D-02 (owner 2026-11-28 09:15Z): the Carnot-fraction 0.154 is reached by a recuperated He-Xe cycle only with advanced components and a 872 K compressor inlet"
principle = "Brayton efficiency = Carnot fraction x (1 - T_reject / T_inlet)."
precedent = "SiC/SiC CMC turbine shrouds and vanes near 1600 K in service; JIMO/Prometheus closed Brayton design at ~1150 K inlet; ceramic gas turbines (1990s demonstrators)."
limitation = "Space closed-Brayton work is at ~1150 K turbine inlet (Track R, eta 0.146 at 750 K rejection); a reactor and recuperator at 1500 K for years are not demonstrated."
advance = "Reactor outlet, IHX and turbine at 1500 K for the service life, using the FT-01 material family for the hot-gas boundary and CMC rotors."
adopted = { turbine_inlet_K = 1500.0, turbine_efficiency = 0.94, compressor_efficiency = 0.90, recuperator_effectiveness = 0.97, pressure_loss = 0.02, compressor_inlet_K = 872.0, efficiency = 0.154, l2_radiator_emission_K = 896.0, l2_section_m = 9.38 }
cycle = "recuperated closed Brayton, He-Xe; pressure-loss parameter = total fractional pressure loss around the loop (documented in work/ship-systems-architecture/integration3d/radiators3d.py cycle())"
dependents = ["L2 power district (Track F variant F1)", "L2 radiator section 9.38 m at 896 K (x 41.02-50.4)", "HOT headroom for L1 and the burn heat pumps", "config WF-F1-C1.0"]
consequence = "Track F returns to F0 (1150 K inlet, 750 K rejection): the L2 section stays 20.5 m and the HOT headroom under the 20 % rule is ~0.05 GW, too small for a reactive defense in a burn."
source = "work/ship-systems-architecture/phase6/study6.py radiators_f; integration3d/radiators3d.py cycle (DR-3D-02)"

[[technology]]
id = "FT-04"
name = "Direct conversion of charged fusion products (L1)"
status = "CONDITIONAL"
level = "C"
decision = "DR5-05 (owner 2026-11-28): conditional fictional L1 direction; thermal conversion stays the research reference"
principle = "Faraday induction: expanding plasma doing work against a magnetic field changes the flux through a pickup winding (inductive conversion); decelerating charged particles in an electrostatic or travelling-wave field (Venetian blind, TWDEC)."
precedent = "Daedalus (BIS 1978) induction-loop power from the exhaust; Venetian-blind and TWDEC designs for mirror and D-3He reactors (50-70 % calculated); pulsed inductive energy recovery in magneto-inertial fusion experiments; resonant pulsed-power recovery (Vertex C2 literature 0.8-0.95 per exchange)."
limitation = "Never demonstrated at power on a fusion exhaust; refractory pickup conductors at ~1900 K are resistive (W ~6e-7 ohm m); the pickup sees the drive's radiation; steady flow induces no EMF without modulation."
advance = "A refractory pickup winding cooled by the FT-02 loop inside the existing nozzle structure (no new intercept area), with plasma-to-bus efficiency 0.5-0.8 at 10-100 MWe."
adopted = { efficiency = [0.8, 0.65, 0.5], rating_W = 1.0e8, loss_sink = "hot loop (HOT radiators, 1800 K)", requires = "pulsed or modulated exhaust; buffer store per pulse" }
dependents = ["L1 bus", "burn heat pumps", "EYE Burn Watch", "hot-loop pumps in a burn"]
consequence = "Track R L1: thermal conversion at ~0.27 with a ~900 K reject that has no radiator (OPEN). The 900 K problem is changed by FT-04, not removed by fiat: its losses go to the HOT loop and must fit the HOT headroom."
source = "work/ship-systems-architecture/phase6/study6.py direct_conversion"

