# P1-007 electrical storage and black start (drive_capture_2026-09-29; S&E 17_POWER_STORAGE, 98_DECISION_LOG row 45).
# Four layers with distinct roles. Survival power and restart capability are different things (rules below).
# Storage mass stays inside the existing power/computers/steering/comms allowance; no new mass line.
[power.storage]
architecture = "LAYERED"
layers = ["MAIN_BATTERY", "PULSE_BANK", "SURVIVAL_RESERVE", "RIDE_THROUGH"]
mass_budget_item = "power_computers_steering_comms"
canon_status = "BASELINE"
source_ref = "power_storage_architecture"
note = "Main battery stores energy, the supercapacitor bank supplies ignition power, and the survival reserve is deliberately independent. Technology 40_ENERGY_PROPULSION!A11 owns generic chemistry only."

[power.storage.main_battery]
technology = "SABERS-descended solid-state Li-metal / sulfur-family battery"
role = "Fusion-off endurance; black-start energy; recharge buffer"
usable_energy_Wh = 2.0e6
specific_energy_Wh_kg = 800.0
specific_energy_basis = "pack-level extrapolation"
normal_source = "FUSION_BUS"
independence = "Independent of active fusion once charged"
canon_status = "WORKING"
source_ref = "power_storage_main"

[power.storage.main_battery.installed_mass]
known = false
canon_status = "OPEN"
evidence_ref = "power_storage_mass"
reason = "Detailed pack, containment, thermal and switching masses are unsolved (17_POWER_STORAGE A23). The energy/specific-energy quotient is only a DIAGNOSTIC cell-to-pack extrapolation."

[power.storage.main_battery.fusion_off_endurance]
