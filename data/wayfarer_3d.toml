# Fractal shielding (user brief 2026-10-27): the selected ram-face pattern is a hexagonal facing-plate tiling with Sierpinski-subdivided
# triangles inside each plate, on the same ram faces as above (the Brow skin and the disruptor layer ahead of it); pattern =
# "running_bond" restores the S9 tiles. The plates are the replaceable facing of the WORKING segmented Brow laminate
# (forward_defense.regenerative: panel replacement for major loss), laid over the structural panels whose joints show on the aft face.
# Shading and procedural normals only (fractal_shield.py is the reference, godot/shaders/fractal_shield.gdshaderinc the runtime and web
# copy): no geometry, thickness, mass, opening or shielding claim; the stack stays OPEN (forward_shield.stack). PROTOTYPE depiction choices:
#   plate_side_m      hex side (= circumradius), a shell module edge inside shell_panel_m; flat-top plates, one centred on the axis
#                     2.6 m (user 2026-10-29, was 2.4): each EYE shell is one plate, and a 2.6 m hex has the 2.25 m outer-port apothem
#   plate_gap_m       dark gap between plates (the grammar's joint gap): room for thermal growth and plate replacement
#   fractal_depth     Sierpinski levels inside each of a plate's six triangles; level k's triangles have side plate_side_m / 2^k
#   density           chance (0-1) that a triangle subdivides further, drawn per triangle from a stable hash; 1 is the full gasket
#   groove_m          width of the level-0 grooves (the six spokes); level k is groove_m * groove_ratio^k wide
#   relief_m          depth of the grooves, a surface relief; inset_m the recess of each Sierpinski centre triangle (never a perforation)
#   fastener_radius_m one tri-clamp at every other plate corner: each clamp holds three plates, each plate hangs on three clamps
#   closeout_m        plain collar between the pattern and every opening (EYE wells and ports, Lance root, Crown windows and ports, rim)
#   lod_px            a level draws once its triangles span at least this many pixels and fades in over twice that (distance LOD)
#   *_value           value multipliers of the shell colour (gap, groove, inset face); jitter and repairs come from ram_face
#   max_relief_fraction  the relief and inset together stay within this share of the display skin (forward_shield.prototype)
[production.exterior.fractal_shield]
