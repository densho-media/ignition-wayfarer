source_ref = "black_start_sequence"
steps = [
  { step = 1, path = "Survival/main storage wakes ship services", state = "Main reactor OFF; lattice cold", reactor = "OFF", supplied_by = ["SURVIVAL_RESERVE", "MAIN_BATTERY"], charges = [] },
  { step = 2, path = "Main battery charges pulse bank", state = "Pulse bank armed", reactor = "OFF", supplied_by = ["MAIN_BATTERY"], charges = ["PULSE_BANK"] },
  { step = 3, path = "Conventional seed coils energize", state = "Initial magnetic field established", reactor = "OFF", supplied_by = [], charges = [] },
  { step = 4, path = "Fusion fuel admitted; plasma breakdown initiated", state = "Ionized plasma established", reactor = "STARTING", supplied_by = [], charges = [] },
  { step = 5, path = "Pulse bank drives startup heating / magnetic transient", state = "Fusion conditions approached", reactor = "STARTING", supplied_by = ["PULSE_BANK"], charges = [] },
  { step = 6, path = "First fusion reactions begin", state = "Fusion heat and alpha heating rise", reactor = "FUSION", supplied_by = [], charges = [] },
  { step = 7, path = "Fiji lattice enters activation range", state = "Magnetic response increases", reactor = "FUSION", supplied_by = [], charges = [] },
  { step = 8, path = "Field lock develops", state = "Drive efficiency / confinement rises", reactor = "FUSION", supplied_by = [], charges = [] },
  { step = 9, path = "Fusion electrical generation takes ship load", state = "Battery and pulse bank recharge", reactor = "SUSTAINED", supplied_by = ["FUSION_BUS"], charges = ["MAIN_BATTERY", "PULSE_BANK"] },
]

