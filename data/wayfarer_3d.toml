[induction]
# IND-001 induction route (human_entry.induction, step 2.1): the stops in order. `at` places a stop on the route: entry (the entry
# chamber), refuge_port (the trunk axis under the refuge port), vestibule (the annulus at the spine port) or sector (that sector's aisle).
# The sectors are visited in the order of their first stop; the route ends at the last stop (the newcomer's departure is Tale-owned, Q48). A sector stop's
# `pose` names the sector_whitebox figure it is about (2.5 eye review); the stop stands on the aisle centreline where the newcomer leaves the
# aisle for that station (human_entry.induction_stations), and the route sweep walks the aisle from the landing to each stop in turn.
# Display: each sector stop's review camera stands in the aisle at eye height, stop_camera_z_m across the centreline from the figure's block,
# and looks at the figure's eye: at the stop, or stop_camera_back_m along the aisle toward the landing when the figure stands in the aisle.
# `view` names each stop's eye-level view (characters.stop_views; display only): a guide camera (human_entry.cameras, characters.cameras), or
# "stage", a wider view of the station (characters.STAGE_VIEWS) where the aisle camera stands too close to show it.
status = "PROTOTYPE"
evidence_ref = "induction_route"
ring = 1
stop_camera_back_m = 1.20
stop_camera_z_m = 0.30
rationale = "S&E 98!A36 (WORKING) orders the induction airlock -> stationary spine -> rotary transfer -> habitat ring -> life support/Garden -> burn station; Tale S004A-D names the scenes. Ring A carries it (IND-001 plan decision D4). On ring A sector 1 (the spine port's, HABITATION) is the landing sector, sector 3 is LIFE_SUPPORT_GARDEN_COMMON and sector 2 WORK_MEDICAL_OPS, so the order is 1, 3, 2: each move between sectors climbs one crew tube, crosses the transfer drum's annulus and descends the next. Q48 (15!A89, 98!A66, BASELINE): the specialist stops are pressurized internal stations in WORK_MEDICAL_OPS (12A SP-33, SP-39/40 PROPOSED, so their furnishing stays PROTOTYPE, 15!G89) and the distributed aft-facing sector couches are the burn station (08!A55, 15!I1); the newcomer's departure is Tale-owned, so the route ends at the burn station. No geometry changes for the tutorial (98!G36, 15!H89)."
stops = [
  { key = "arrival", at = "entry", scenes = ["S004A"], view = "CAM_IND_GREETING", title = "Arrival: the instructor's greeting in the entry chamber" },
  { key = "spine", at = "refuge_port", scenes = ["S004A"], view = "CAM_HUM_REFUGE_PORT", title = "Stationary spine: the trunk and the storm refuge" },
  { key = "transfer", at = "vestibule", scenes = ["S004A"], view = "CAM_HUM_VESTIBULE_EYE", title = "Rotary transfer: ring A's despun transfer drum" },
  { key = "habitat", at = "sector", sector = 1, pose = "aisle", scenes = ["S004A"], view = "CAM_IND_HABITAT", title = "Habitat ring: quarters, hygiene and couches" },
  { key = "garden", at = "sector", sector = 3, pose = "garden", scenes = ["S004A", "S004C"], view = "stage", title = "Life support and the Garden" },
  { key = "burn_readiness", at = "sector", sector = 2, pose = "patient", scenes = ["S004B"], view = "stage", title = "Burn readiness at the medical station" },
  { key = "specialists", at = "sector", sector = 2, pose = "operator", scenes = ["S004C"], view = "stage", title = "Specialist stops at the operations stations" },
  { key = "burn_station", at = "sector", sector = 2, pose = "couch", scenes = ["S004B", "S004C"], view = "CAM_IND_BURN_STATION", title = "Burn station: aft couches and burn-go consoles" },
]
# 4.1 the induction as operating states (human_entry.induction_sequence): steps in order, each a configuration `state` holding stops (every stop
# once, in the order above) or a transition `from` -> `to` between its neighbours' states, with no duration (not to scale). Q48 (15!A89, 98!A66,
# BASELINE physical sequence): arrival DOCKED with both rings stopped and locked (14!A8, 11!A6) -> internal boarding to the stationary spine -> the
# visiting craft may undock -> spin-up -> a COAST tour through the normal transfer architecture: the despun transfer drum (Q46, MEC-019) takes
# the newcomer from the stationary spine port, synchronizes with ring A and opens onto the crew tubes, and every move between sectors stays in
# COAST, never a ring stop per sector change (15!H89). The newcomer's departure is Tale-owned (15!I89), so the sequence ends at the burn station.
# FUT-004's First Ignition timeline plays these steps as its pre-ignition segment.
sequence = [
  { key = "board", state = "DOCKED", stops = ["arrival", "spine"], title = "Board docked: both rings stopped and locked; through the primary airlock into the stationary spine" },
  { key = "spin_up", from = "DOCKED", to = "COAST", title = "The visiting craft may undock; the rings unlock and spin up to 4 rpm" },
  { key = "tour", state = "COAST", stops = ["transfer", "habitat", "garden", "burn_readiness", "specialists", "burn_station"], title = "COAST tour under spin gravity: through ring A's despun transfer drum into the sectors, and between them, with no ring stop" },
]
sequence_sources = "S&E 15!A89, 98!A66, 98!A36, 11_OPERATING_CONFIGS, 14!A8, Tale S004A-C"

# Q48 answer (15!A89, 98!A66; 2026-10-07b): the sequence above is built on it.
[induction.doctrine]
rule = "Arrival DOCKED with both rings stopped and locked -> internal boarding -> the visiting craft may undock -> spin-up -> a COAST tour through the normal despun transfer vestibule, never a ring stop per sector change. EYE, thermal and drive teaching stops are pressurized internal stations; the burn station is the distributed aft-facing sector couches. No geometry changes for tutorial convenience."
newcomer_departure = "TALE_OWNED"
canon_status = "BASELINE"
source_ref = "induction_operating_states"

