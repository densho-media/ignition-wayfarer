  { induction = "board", frames = 72 },
  { induction = "spin_up", frames = 72, duration = "OPEN", evidence_ref = "ring_stop_lock", rotor = "unlock_spin_up", display = "COAST", thermal = "COOLANT_FLOW" },
  { induction = "tour", frames = 144 },
  { id = "COAST_START", configuration = "COAST", frames = 48, title = "Conditioned coast under spin gravity, coolant loop online, before First Ignition" },
  { id = "SPIN_DOWN", from = "COAST", to = "FIRST_IGNITION", frames = 96, duration = "OPEN", evidence_ref = "rotor_bearing_losses", rotor = "brake", display = "COAST", title = "Regenerative spin-down to rest at the index angle" },
  { id = "STOP_LOCK", from = "COAST", to = "FIRST_IGNITION", frames = 48, duration = "OPEN", evidence_ref = "ring_stop_lock", rotor = "lock", display = "COAST", title = "Index lock, set down on the touchdown cartridges, ring-stop locks" },
  { id = "DRIVE_START", from = "COAST", to = "FIRST_IGNITION", frames = 96, duration = "OPEN", evidence_ref = "power_hotel_interfaces", drive = "startup", display = "FIRST_IGNITION", title = "Drive start; EYE to Burn Watch, radiators to high-power rejection" },
  { id = "BURN", configuration = "FIRST_IGNITION", frames = 899, duration = "IMPORTED", drive = "burn", title = "First Ignition: linear 0 to 1.5 g to 0.016 c (sheet-computed route, DIAGNOSTIC 1D)" },
  { id = "DRIVE_OFF", from = "FIRST_IGNITION", to = "COAST", frames = 72, duration = "OPEN", evidence_ref = "power_hotel_interfaces", drive = "shutdown", display = "FIRST_IGNITION", title = "Stepped drive shutdown" },
