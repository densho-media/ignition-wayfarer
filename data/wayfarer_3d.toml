evidence_ref = "p4_exterior_grammar"
pattern = "fractal_hex"
plate_side_m = 2.6
plate_gap_m = 0.08
fractal_depth = 4
density = 0.85
groove_m = 0.03
groove_ratio = 0.75
relief_m = 0.003
inset_m = 0.0015
fastener_radius_m = 0.11
closeout_m = 0.35
rim_closeout_m = 0.5
lod_px = 4.0
gap_value = 0.55
groove_value = 0.80
inset_value = 0.93
max_relief_fraction = 0.10

