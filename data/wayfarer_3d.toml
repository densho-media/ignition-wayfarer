# Scale tiers by reading distance (metres from the camera): MACRO assembly rhythm (bays, 15 deg ring segments, blade frames, casing modules)
# reads at whole-ship distance and is always drawn; MESO panels, joint caps, trays and covers read at subsystem distance; MICRO fasteners,
# small stencils and placards only near a person. Godot draws each tier to its range (the M8 detail/fine ranges are the meso/micro ones).
tier_range_m = { macro = 6000.0, meso = 1500.0, micro = 160.0 }
# Smallest feature (m) worth modelling per tier: below it the part is a value change, a seam line or nothing.
tier_min_feature_m = { macro = 1.5, meso = 0.25, micro = 0.03 }
# Bevels per tier so edges catch the sun at their reading distance without rounding the module away.
tier_bevel_m = { macro = 0.02, meso = 0.008, micro = 0.003 }
# Shell panel construction: replaceable modules between joints, edge lengths in this range; seams are dark gaps, joints are exposed
# mid-value caps over a dark gap. Calm fields: a shell zone keeps at least calm_field_min of its area free of meso and micro detail.
