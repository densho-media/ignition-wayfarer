status = "PROTOTYPE"
unit = "m"
rationale = "Shield and rim stay inside r 45 (07!A48:A49, 14!A12 ~90 m); rings (30 m) and radiators (37 m) lie inside it. FWD-001 (F2) builds the owner's 2026-10-03b answers; every selection below is a PROTOTYPE inside a sourced limit and carries its HSFP design class (98!A58): L = physics-locked, F = engineering-flexible, A = artistic. Conical Brow (Q3): the face is flat at the FWD datum out to the hub-ring outer radius (7.4 m = hub opening plus ring width: Lance root, four wells, hub ring) and then a linear cone sweeping aft by the sourced ~3 m crown depth (forward_defense.shield_profile, merged by forward_shield.prototype) to r 45, so the Lance, wells and overall length do not move; the truss is a 3.5 m two-chord truss (inside the owner's 3-4 m) of constant axial depth behind the skin. Crown depth and diameter are L; flat-hub radius, skin and truss depth are F. Wells and Lance: the wells are protected recesses (Eye 40!A20, OD-020): the well diameter exceeds the 2.5 m facet aperture, adjacent wells and the Dust Lance keep the shared mechanical clearance, and the well depth (prototype.eye_front_inset_m) is less than skin plus truss so the facets stay recessed (15_MODEL_INTERFACES H2); they are L. The Dust Lance (12 m, r 1.0 to 0.25 m, 1.5 m tip: WORKING, forward_defense.dust_lance) and the 3.5 m wells (WORKING, forward_defense.eye_wells) are sourced and merged into this table by forward_shield.prototype; the overall length including the Lance stays inside the 240 m envelope (Q2). Crown (Q5/Q6, OD-021): 12 bays at 30 degrees in a housing r 41.0-44.5 (the rim girder r 44.5-45 is its outer wall), engaged hardware translates forward (3.0 m housing depth, carriage stowed at r 42.75, no radial travel) through 12 skin windows under armoured shutters and through small disruptor ports behind normally closed covers (Q44), so the maximum Crown radius stays about 43.35 m inside r 45; bays, housing band, the r 45 limit, forward motion and four sectors are L; carriage, stroke and shutter placement are F. Disruptor (FWD1): one full-diameter conical layer 2.0 m ahead of the Brow (count, thickness and spacing OPEN, 15!G45 allows PROTOTYPE) on 60 posts at truss nodes; existence, full diameter and 'ahead of the Brow' are L; standoff, posts and ports are F (Q43 keeps the open EYE ports, Q44 shrinks and covers the Crown ports); its translucency is A. The four EYE ports are the smallest that add no vignetting inside each well's own unvignetted field (derived from the WORKING aperture and well, not an EYE field of view). Field zone: a translucent elongated zone around and behind the Lance, no bubble (Q4); profile and alpha are A and a display only. Load path (14!H15 'continuation of the central Momentum Spine / shield hub', 15_MODEL_INTERFACES H1 'primary load paths stay legible'; Q1 'do not hang the 90 m Brow from one central column'): the Dust Lance root is a spine-continuation column that starts on the forward end of the Momentum Spine, passes through a bore in the EYE shared mount without touching it, and bears on the hub; four radial shield-mount struts tie the column to the truss hub ring through derived hull openings (hub path). Three forward sector keels at the sourced sector radius and azimuths (07!A10, A13) and nine ties form a Brow sector frame; the Q45 bypass collar (forward_defense.bypass_collar) ties the keel aft ends and the outer truss ring round the rotor bay into the sector rails. The hub path and the sourced sector radius and azimuth are L; keels, ties, positions and sizes are F (the keels' existence ahead of ring B and their length are F2 selections; the collar geometry is F). The shield never bears on the EYE mount or on the 0.10 m skin alone. Joint and member sizing and the attachment to the primary structure are OPEN (14!H15, 15!I30; 15_MODEL_INTERFACES); the shield stack, materials and mass are OPEN (OD-014); the 4 struts at 111.0 m X are a PROTOTYPE selection."
