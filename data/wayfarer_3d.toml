# P1-004 rough sector interiors: one component per owner function (habitat.layout, WORKING), linked into every ring sector of that
# function (one sector of each function per ring, mirrored). Room-by-room geometry stays OPEN (habitat.layout.rooms); every number
# here is PROTOTYPE blocking: furniture is OPEN (12!G10, 15!I1).
# Sector frame: origin on the sector centreline at the deck (ring radius habitat.floor_radius), +X along the ring axis (the aft bulkhead
# is at -X), +Y radially outward (the floor in coast), +Z tangential. No room turns; with the rings stopped and locked the burn acts
# along -X, so aft-facing couches stand against the aft bulkhead. The sector arc is solved from the gross-volume target (habitat_ring);
# deck-to-overhead must hold the usable allocation; zones line both sides of a clear centre aisle, reach to the radial side walls minus
# the wall allowance, and are placed by x range, lift above the deck and height.
[interior]
status = "PROTOTYPE"
min_headroom_m = 2.1
aisle_m = 0.9
wall_allowance_m = 0.15
end_allowance_m = 0.15
min_zone_depth_m = 0.5
deck_thickness_m = 0.05
rationale = "Rough blocking for shots and fit checks, not a room design. The space between the deck (r 28 m) and the shell (r 28.7 m) holds water, stores and utilities; the owner's 40 m3 usable per sector (120 m3 per ring) is read as the crew-accessible volume between deck and overhead, including outfitting. Rated occupancy is 12 (12!A14) against a story manifest of 6, so the blocking carries 12 bunks and 12 aft-facing couches: the spare capacity G3 allows. Garden racks stand only in the two life-support/Garden/common sectors, whose usable volume is read as the 80 m3 Garden / life-support volume (12!A7) until draft owner question Q50."
