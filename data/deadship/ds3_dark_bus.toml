# DS-3 "Dark Bus": the Phase 3 Deadship challenge (owner brief 2026-11-15: power generation and distribution, buses A/B, the main battery,
# the survival reserve, load shedding, cold-loop operations, power-thermal-atmosphere coupling, multi-system diagnostics). A station-run
# training simulation aboard Wayfarer in simulated COAST.
#
# Scenario-owned values only. Every engineering value (the buses, generators, converters, battery, survival packs, pulse bank, loads, the
# cooling chain and the cabin) comes from the ring services model, src/wayfarer/ring_services.py (SYS-003), and its package;
# src/wayfarer/ship_ops.py refuses a scenario that sets one. Every value below is PROTOTYPE: a training choice, not canon.

[scenario]
id = "DS-3"
name = "Dark Bus"
kind = "CHALLENGE"
scored = false
status = "PROTOTYPE"
system = "RING_SERVICES"
note = "The fusion plant is down for a planned service and the ship runs on its battery. Then a battery converter fails and half the ship's distribution goes dark. Every way through spends something: the Garden's light, ring B's readiness, the cabin's dryness, or the restart reserve. The metrics are shown, not weighted: no points, no ranking."

[premise]
faults = [["BC-B", 0.0]]
fusion = false
occupants = { A = 6, B = 0 }
spares = []
setback = { ring = "B", T_K = 285.45, rh = 0.60, off = ["CO2", "LIGHT", "LAB", "GALLEY", "GARDEN"] }
restart_h = 48.0
basis = "A planned 48-hour coast segment with the fusion plant shut down for service: both buses run from the main battery through their converters, BC-A for bus A and BC-B for bus B. The plant's restart at 48 h fires from the drive's pulse bank, which the main battery must charge first (power.storage.pulse_bank.energy_Wh): if the battery holds less than that when the restart window opens, the plant cannot restart. At the start converter BC-B fails: bus B loses its supply and its survival loads (the cabin heat exchanger fans, the second coolant pumps, trace-contaminant control, avionics) fall to each ring's survival packs. There is no spare converter in the rings (converters are kept in the service module, out of reach while the rings turn). Ring B is unoccupied in coast setback, as in DS-2C."

[crew]
pairs = [["A", "A1"], ["B", "A2"], ["C", "A3"]]
transfer_s = 900.0
transfer_note = "As DS-2C."
fetch_work_s = 600.0
fetch_note = "As DS-2C."
deliver_to = "A.SHELF"

[work]
remove_s = 300.0
install_s = 300.0
rule = "As DS-2C."

[places]
bay = { node = "Prod_RA3_GDN_ECLSS", compartment = "A3", reach_m = 2.6, holds = ["CO2", "CHX", "P1", "P2", "HP"], note = "Ring A's ECLSS bay." }
console = { node = "Prod_RA2_WRK_Ops_1", compartment = "A2", reach_m = 2.2, note = "An ops console: the electrical overview (buses, breakers, converters, the battery and the packs), the bus tie and breaker resets, both rings' load switching (remote power controllers) and the heat pumps' supply setpoints. All of these are remote by design; the converters themselves are in the service module." }

[time]
scale = 60.0
watch_scale = 3600.0
dt_s = 10.0
watch_dt_s = 60.0
projection_dt_s = 300.0
alert_s = 60.0
pause = "As DS-2C."

[watch]
ship_h = 60.0
min_h = 1.0
projection_h = 168.0

[alert]
text = "WARNING · ELECTRICAL: converter BC-B FAULT, bus B NO SUPPLY. Bus B survival loads on SURVIVAL PACKS in both rings. Fusion plant: planned shutdown, restart window at 48 h."

[[stages]]
id = "recognize"
title = "Recognize"
objective = "Bus B has lost its supply. Go to the ops console in sector 2 and read the electrical overview ({use})."
hint = "Which loads are on bus B, and what carries them now? How long do the packs last?"

[[stages]]
id = "diagnose"
title = "Diagnose"
objective = "Find the cause and what follows from it: what stops when the packs are empty?"
hint = "The cabin heat exchanger fans are on bus B. Without them no heat and no water leave the cabin air."

[[stages]]
id = "assess"
title = "Assess"
objective = "Work out what bus A's converter can carry, and what the battery must still hold at the restart window."
hint = "The bus tie lets BC-A feed both buses, but only up to its rating: asked for more, the breakers trip. Energy is power times hours."

[[stages]]
id = "act"
title = "Decide and act"
objective = "Shed what you can spare, set the heat pumps, close the tie, reset the breakers."
hint = "The Garden lights are the largest load. A dark ring needs nothing. The economy setpoint saves heat-pump power but condenses less water."

[[stages]]
id = "stabilize"
title = "Stabilize"
objective = "When both buses are live within BC-A's rating and the cabin holds, declare the watch ({ops} at the intercom)."
hint = "A load that grows with the cabin's temperature can trip the tie later."

[[stages]]
id = "verify"
title = "Verify"
objective = "The watch runs the model through the restart window (60 hours), then the 7-day projection."
hint = "Nothing changes during the watch."

[[stages]]
id = "debrief"
title = "Debrief"
objective = "Read what held, what it cost and what was left at the restart window."
hint = "Replay ({ops}) to try another way."

[debrief]
families = [
  "Shed the Garden and the discretionary loads in ring A: the battery keeps its restart reserve; the Garden stays dark for two days.",
  "Darken ring B as well: more reserve, but the spare ring is cold and dark.",
  "Run the heat pumps at economy: less power, but the cabin dries less and humidity climbs.",
  "Too little shed: the tie trips, or the battery is short at the restart window.",
  "Leave bus B on its packs: when they are empty the heat exchangers stop.",
]
notes = "Metrics are shown side by side and never weighted (no official weights exist; PROTOTYPE evaluation only)."
