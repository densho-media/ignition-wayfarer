# EVA Operations (EVA-OPS-001): the runtime-only parameters of the interactive EVA experience in Godot (docs/EVA_OPERATIONS.md).
# The suit, the drone, their nozzles, gas physics, masses and tanks are NOT here: they come from the canonical EVA system
# (data/eva_suit.toml, data/eva_drone.toml, src/wayfarer/eva_system.py and the built layout in references/p1_eva_system.json).
# What is here is what only the interactive runtime needs: the resupply accessory, the service station, the control-assist
# gains, the operating presets and the training rules. Every value is PROTOTYPE (no IGNITION owner row defines it) unless a
# source_ref says otherwise. src/wayfarer/eva_ops.py combines this file with the canonical sources into data/simulations/wf_eva_ops.json.

status = "PROTOTYPE"

# RC-1 dock-channel resupply cartridge: the smallest accessory that delivers N2 through interfaces the suit already has.
# It is one drone-class COPV (data/eva_drone.toml body.vessels: same outer diameter and wall) shortened, on a keel adapter that copies
# the drone's keel (width, depth, latch bolt line and N2 probe position from eva_system.dock_layout()). Seated in the suit's empty dock
# channel, the suit's own latch bolts hold it and its probe opens the suit's dock poppet: gas reaches the suit thruster manifold through
# the same check valves as drone gas (1.4 MPa cartridge regulator over the 1.2 MPa reserve regulator), so the cartridge feeds the
# suit's 16 thrusters with passive priority and the reserve is held. It never refills the reserve bottle (no such line exists).
# The drone carries it by its GU-SIF-S grip lug in arm B (the utility arm, 60 N tip force). Nothing in the canonical suit changes.
[cartridge]
id = "RC-1"
title = "Dock-channel N2 resupply cartridge (PROTOTYPE accessory)"
vessel_length_m = 0.300            # one drone COPV shortened from 0.400 m; outer diameter, wall, pressure, Z, usable fraction from eva_drone.toml
hardware_kg = 1.6                  # COPV 1.1 + keel adapter, probe, regulator and grip lug 0.5 (estimate)
regulator_pa = 1.4e6               # same set point as the drone feed: priority over the 1.2 MPa reserve regulator
grip = "GU-SIF-S grip lug on the cartridge's outer face (arm B jaw)"
size_m = [0.12, 0.34, 0.10]        # envelope (x, length along the keel, depth) for the runtime body and collisions
seat_tolerance_m = 0.02            # the channel's draft guides it in from this offset (data/eva_drone.toml near_suit capture_m)
seat_speed_max_m_s = 0.03          # same closing-speed limit as a drone capture (eva_drone.toml propulsion.approach_speed_max_m_s)

# EVA equipment station at the outer hatch of the EVA airlock (eva_route.py route hatch): a rack of cartridges on the hull and a
# drone service socket that copies the suit channel (data/eva_drone.toml anchor: same bolts and probe). The rack is finite.
[station]
cartridges = 4
drone_refill_kg = 0.0              # the station socket charges the drone only in training reset (no ship N2 supply line is released)
offset_from_hatch_m = [0.0, 1.2, 0.35]   # (along +X, around the hull, outward) from the outer hatch centre; PROTOTYPE placement

# Operating presets. DRIFT is the rig's DOCKED / EVA configuration (drive off). BURN presets are training simulations.
[modes.DRIFT]
label = "Drift (drive off, ship coasting)"
rig_mode = "EVA"                   # data/simulations/wf_sim_rig.json dynamics.modes: demo_ship_accel_g 0
kind = "OPERATIONAL_FRAME"
[modes.BURN_HP]
label = "Burn, high power (1.5 g envelope bound)"
rig_mode = "HIGH_POWER"            # dynamics.modes.HIGH_POWER demo_ship_accel_g 1.5: a demonstration bound, not a flight value
kind = "TRAINING_SIMULATION"
[modes.BURNBROW_11]
label = "Burnbrow training (1.1 g)"
accel_g = 1.1                      # data/eva_drone.toml gas.burn_g (owner brief); training preset
kind = "TRAINING_SIMULATION"

# Training rules.
[rules]
emergency_floor_fraction = 0.30    # of the suit reserve's usable gas: below it the HUD says EMERGENCY ONLY (thrusters stay live)
low_fraction = 0.50                # LOW warning on any inventory below this fraction of its usable gas
rescue_margin = 1.5                # the drone accepts a rescue only with this multiple of its estimated delta-v need left
rescue_max_target_speed_m_s = 0.8  # above this astronaut speed (ship frame) the drone refuses an approach: brake or tether first
grab_speed_max_m_s = 0.5          # a hand can hold a hold up to this relative speed (training value; the suit glove load is OPEN)
reach_m = 0.9                      # hand reach from the suit's mass centre to a hold (posed arm, eva_system.json hand controller ~0.4 m + shoulder offset)
push_dv_m_s = 0.30                 # a hand push-off from a hold: the impulse the arm gives (training value; eva_suit.toml mobility is OPEN)
tether_length_m = 15.0             # PROTOTYPE tether (eva_route.py tether_reach_m is gameplay; tether_length_m OPEN, SIM-03)
walk_speed_m_s = 0.6               # foot-restraint-free walking on the Brow under thrust (training)
walk_friction = 0.6                # boot sole on the Brow skin (estimate)
surface_normal_min = 0.5           # a surface supports standing when the apparent gravity presses into it at least this cosine
hazard_margin_m = 2.0              # warning distance outside a keep-out volume

# Control assist (flight software, PROTOTYPE gains). Every correction goes through the thruster allocation and uses gas.
[assist]
rate_damp_s = 0.8                  # angular-rate damping time constant
attitude_hold_s = 1.5
brake_s = 2.0                      # velocity braking time constant
hold_position_s = 4.0              # station keeping (position) time constant
deadband_m_s = 0.003               # braking stops firing below this relative speed
deadband_rad_s = 0.002
autopilot_speed_m_s = 1.0          # drone cruise speed limit (autonomous)
transit_speed_m_s = 0.30         # follow, return and docking transits (economy); the rescue may fly at autopilot_speed_m_s
autopilot_brake_fraction = 0.5     # plan braking at this fraction of the axis authority
follow_offset_m = [1.5, 0.6, 1.5]  # drone follow station behind, above and to the side of the astronaut (suit frame)
approach_gate_m = 0.50             # final docking approach starts here (eva_drone.toml near_suit approach_m[0])
