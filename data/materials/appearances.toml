# Purpose–Material Design System (PMDS): physical appearance records (docs/MATERIALS.md).
# How a material looks in the Blender physical appearance view: a glTF-safe Principled finish (linear base colour, roughness, metallic)
# plus an optional surface treatment. An appearance either names an existing exterior family (`family`, data/wayfarer_3d.toml
# [production.exterior.families], so the exterior grammar and the appearance view share one finish) or gives its own values.
# basis: PBR_REFERENCE (from published measured reflectance charts), FAMILY (the existing exterior family) or ARTISTIC (a judged
# depiction). Appearances are presentation: none of these numbers is a physical property, and none feeds a calculation.
# emission is allowed only with a physical reason (a hot surface's thermal glow); solid materials here have none.
schema_version = 1

[appearance.APP-W-MACHINED]
material = "MAT-W"
name = "Tungsten, ground or machined"
base_color = [0.50, 0.50, 0.49]
roughness = 0.35
metallic = 1.0
surface = "brushed"
basis = "ARTISTIC"
note = "neutral grey metal, darker than steel; no measured tungsten F0 recorded here"

[appearance.APP-W-PLASMA-EXPOSED]
material = "MAT-W"
name = "Tungsten after helium plasma exposure"
base_color = [0.05, 0.05, 0.055]
roughness = 0.90
metallic = 0.3
surface = "fuzz"
wear = "in-service darkening; nanostructured 'fuzz' surfaces are nearly black (Baldwin 2008)"
basis = "ARTISTIC"
note = "the depicted in-service state of a D-3He hot face whose helium ash reaches the wall; extent and temperature window OPEN (OD-025)"

