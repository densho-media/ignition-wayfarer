# Purpose–Material Design System (PMDS): the material master catalogue (docs/MATERIALS.md).
#
# An engineering reference and candidate-selection table, never canon. The Drive workbooks stay the authority for the spacecraft; a value
# here reaches a Wayfarer calculation only through material_physics.get_property, which carries its unit, basis, confidence, source,
# verification and validity range, and refuses to extrapolate.
#
# Rules (materials.validate enforces them):
# - Every material states every CORE property (materials.CORE) either as a property or in its `open` list: missing data stays explicitly
#   unresolved, never zero or a convenient constant.
# - A property is a point (`value`, `at_K`, optional `valid_K`), a range across grades or sources (`min`, `max`), or a temperature table
#   (`table_K`, `values`), always with `unit`, `basis`, `confidence` and `source`. A point without `valid_K` holds only at `at_K`.
# - basis: MEASURED, HANDBOOK, TYPICAL (a typical product value), SPECIFICATION_MINIMUM (an acceptance minimum, not a typical value),
#   ESTIMATE, THEORETICAL (from composition or first principles), FICTIONAL (Level C only).
# - confidence: HIGH, MEDIUM, LOW, the scientific certainty of the value. Verification is the evidence for the number (materials.VERIFICATION):
#   a reference gives the default for the numbers citing it (TRANSCRIBED, or UNVERIFIED for a source without a named table); a property may
#   be PRIMARY_VERIFIED or SECONDARY_VERIFIED only with `verified` (what, against what, when), `verified_against` and `condition` (grade,
#   form, temper, irradiation, test condition). Nothing below SECONDARY_VERIFIED is fit for canon.
# - Service limits state `rating` (SCREENING_ESTIMATE or LIFETIME_RATED); `irradiation` (default UNIRRADIATED) and, for anisotropic
#   materials, `direction` say which state of the material a number belongs to.
# - melting_point carries `phase_change`: melting, decomposition or sublimation. It is never an operating rating: max_service_temperature
#   is a separate, usually much lower, long-life limit, and it is OPEN where no credible long-life limit exists.
# - Emissivity here is the physical infrared emissivity. The Blender emission shader is a display setting (appearances.toml) and never reads it.
# - level: A existing technology, B plausible development (a variant with a parent), C speculative (fictional, a variant with a parent).
#   A variant inherits no number from its parent except the keys it lists in `inherits`.
schema_version = 1

