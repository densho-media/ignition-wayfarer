# Purpose–Material Design System (PMDS): applications (docs/MATERIALS.md).
# An application ties purposes and candidate materials to an existing Wayfarer component. Its ID is stable: a material change edits the
# layer, never the application or the component. Layers run from the outer (visible or plasma/space-facing) face inward.
#
# selection: CANDIDATE (one of several under evaluation), PREFERRED (the current working pick, still not canon), REJECTED. No application
# is SELECTED: a selection becomes canon only in the Drive workbooks (e.g. OD-024, OD-025, OD-026), never here.
# geometry: DRAWN (an existing generated mesh represents this layer), NOT_DRAWN (the layer exists in the stack only; no dimensions are
# approved, so none is invented), PROTOTYPE_STUDY (drawn only in a work/ study, outside the generators).
# bindings: which generated display material (WF_MAT_<material>, in <asset>) carries which layer. A binding names a material that the
# generator already makes; the build refuses a binding it cannot find. One display material carries one layer of one application per asset.
# requirements: the operating conditions a candidate must be evaluated against; an unknown one stays OPEN with its source ref.
schema_version = 1

# --- 1. Plasma armor: the first complete integration (proof of concept) -------------------------------------------------------------------
[application.APP-DRV-PFC]
title = "Fusion-core and throat plasma-facing armor"
component_ids = ["WF.DRIVE.PFC.CORE", "WF.DRIVE.PFC.THROAT"]
chain = "fuel: plasma confinement"
purposes = ["P07", "P08", "P02", "P12", "P14"]
canon_ref = "plasma_facing_material"
open_refs = ["od_025"]
engineering_status = "PROTOTYPE"
note = "ITER-inspired reference stack (W monoblock on a Cu interlayer and a CuCrZr cooling tube on a steel support), consistent with the WORKING architecture 'graded tungsten/UHTC hot face, high-conductivity spreader, actively cooled backing' (05!A39). Exact material, heat flux, erosion, module size and interval stay OPEN (OD-025). Not a Wayfarer material selection."
requirements = { heat_flux = "OPEN od_025", erosion_rate = "OPEN od_025", replacement_interval = "OPEN od_025", coolant = "OPEN od_025", neutron_fluence = "OPEN od_025" }

[[application.APP-DRV-PFC.layers]]
