<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="590" viewBox="0 0 1110 590" font-family="DejaVu Sans, Arial"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto"><path d="M0,0 L13,5 L0,10 z" fill="#333"/></marker></defs><rect width="1110" height="590" fill="#FAFAF7"/><text x="20" y="34" font-size="22" font-weight="700">IFD-1 interfaces, plumbing, startup and fault isolation</text><rect x="40" y="90" width="200" height="70" rx="8" fill="#fff" stroke="#8F8F94" stroke-width="3"/><text x="140.0" y="114" text-anchor="middle" font-weight="700" font-size="16">Forward ship</text><text x="140.0" y="136" text-anchor="middle" font-size="13">tank farm, rings, EYE</text><rect x="250" y="90" width="200" height="70" rx="8" fill="#fff" stroke="#8F8F94" stroke-width="3"/><text x="350.0" y="114" text-anchor="middle" font-weight="700" font-size="16">Hull aft body</text><text x="350.0" y="136" text-anchor="middle" font-size="13">primary frames, rails</text><rect x="460" y="90" width="200" height="70" rx="8" fill="#fff" stroke="#DB29C2" stroke-width="3"/><text x="560.0" y="114" text-anchor="middle" font-weight="700" font-size="16">Shadow shield</text><text x="560.0" y="136" text-anchor="middle" font-size="13">W|B4C|LiH|steel, r 7.2 m</text><rect x="670" y="90" width="200" height="70" rx="8" fill="#fff" stroke="#DB29C2" stroke-width="3"/><text x="770.0" y="114" text-anchor="middle" font-weight="700" font-size="16">Open-cage core</text><text x="770.0" y="136" text-anchor="middle" font-size="13">16 coils, 1.4 m shield</text><rect x="880" y="90" width="200" height="70" rx="8" fill="#fff" stroke="#DB29C2" stroke-width="3"/><text x="980.0" y="114" text-anchor="middle" font-weight="700" font-size="16">Axial nozzle</text><text x="980.0" y="136" text-anchor="middle" font-size="13">6 coils, 4 trim sectors</text><line x1="248" y1="125" x2="242" y2="125" stroke="#8F8F94" stroke-width="3" marker-end="url(#a)"/><line x1="458" y1="125" x2="452" y2="125" stroke="#8F8F94" stroke-width="3" marker-end="url(#a)"/><line x1="668" y1="125" x2="662" y2="125" stroke="#8F8F94" stroke-width="3" marker-end="url(#a)"/><line x1="878" y1="125" x2="872" y2="125" stroke="#8F8F94" stroke-width="3" marker-end="url(#a)"/><text x="40" y="190" font-size="13" fill="#555">thrust path: nozzle coils -> strongback -> shield ring frame -> hull primary frames (arrows point forward, toward +X)</text><rect x="40" y="204" width="22" height="22" fill="#2452EB"/><text x="72" y="220" font-size="15" font-weight="700">H2 (HYDROGEN)</text><text x="300" y="220" font-size="14">tank farm -> axial feed -> forward gas box (edge mass loading) + nozzle mass-loading ring</text><rect x="40" y="239" width="22" height="22" fill="#058F85"/><text x="72" y="255" font-size="15" font-weight="700">D (DEUTERIUM)</text><text x="300" y="255" font-size="14">tank farm -> shield sleeve -> axial fueller (pellet/gas), metered separately</text><rect x="40" y="274" width="22" height="22" fill="#8F4DE0"/><text x="72" y="290" font-size="15" font-weight="700">He-3 (HELIUM3)</text><text x="300" y="290" font-size="14">tank farm -> shield sleeve -> axial fueller; unburned He-3 leaves in the exhaust</text><rect x="40" y="309" width="22" height="22" fill="#DB1F1A"/><text x="72" y="325" font-size="15" font-weight="700">Hot loop (HOT_RADIATOR)</text><text x="300" y="325" font-size="14">coil armour (Li heat pipes, ~1850 K) + shield W face -> 3 trunks in the blade planes -> blade roots, 1800 K</text><rect x="40" y="344" width="22" height="22" fill="#45389E"/><text x="72" y="360" font-size="15" font-weight="700">Power (POWER)</text><text x="300" y="360" font-size="14">Brayton A/B + pulse bank -> coil power bus -> 4 coil power units; seed field before lattice activation</text><rect x="40" y="379" width="22" height="22" fill="#777"/><text x="72" y="395" font-size="15" font-weight="700">Diagnostics / control</text><text x="300" y="395" font-size="14">field probes per coil, bolometers, neutron spectrometer behind the shield, nozzle trim feedback</text><text x="40" y="450" font-size="13">STARTUP: seed field 5 T on (power bus) -> lattice heated through 650 K activation to ~700 K -> Li heat pipes primed, W armour at temperature</text><text x="40" y="474" font-size="13">-> H2 gas box and NBI/ICRF heating -> D/He-3 fuelling -> burn; nozzle trim closes the loop on thrust axis</text><text x="40" y="498" font-size="13">SHUTDOWN: fuel off -> plasma decays (s) -> field stepped down through the dump resistors (canon shutdown law) -> lattice cooled below 550 K release</text><text x="40" y="522" font-size="13">FAULTS: armour over-temperature or heat-pipe loss -> fuel cut within the plasma energy time; coil quench -> sector isolation, field dump;</text><text x="40" y="546" font-size="13">shield loop loss -> burn stop (shield holds ~minutes of heat capacity); H2 loss -> gas box off, burn stop; one nozzle sector out -> trim 1-2 deg</text></svg>