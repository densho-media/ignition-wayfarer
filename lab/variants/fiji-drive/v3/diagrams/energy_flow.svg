le" font-size="13">through the 75 % coil gaps and aft</text><text x="510.0" y="512" text-anchor="middle" font-size="13">synchrotron 15 GW (net of 0.98 reflection)</text><text x="510.0" y="530" text-anchor="middle" font-size="13">72 % of neutral radiation</text><rect x="700" y="430" width="280" height="110" rx="8" fill="#fff" stroke="#DB1F1A" stroke-width="3"/><text x="840.0" y="454" text-anchor="middle" font-weight="700" font-size="16">Permanent hardware</text><text x="840.0" y="476" text-anchor="middle" font-size="13">coil armour 7.6 GW (W on Li heat pipes)</text><text x="840.0" y="494" text-anchor="middle" font-size="13">shadow shield 0.88 GW</text><text x="840.0" y="512" text-anchor="middle" font-size="13">= 8.5 GW into the hot loop</text><text x="840.0" y="530" text-anchor="middle" font-size="13">peak wall 10 MW/m2 (limit)</text><line x1="170" y1="340" x2="170" y2="428" stroke="#DB29C2" stroke-width="6" marker-end="url(#a)"/><line x1="490" y1="340" x2="510" y2="428" stroke="#777" stroke-width="3" marker-end="url(#a)"/><line x1="810" y1="340" x2="560" y2="428" stroke="#777" stroke-width="2" marker-end="url(#a)"/><text x="400" y="395" font-size="13" fill="#777" font-weight="600">72 % escapes</text><line x1="520" y1="340" x2="760" y2="428" stroke="#DB1F1A" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6,4"/><text x="700" y="372" font-size="13" fill="#DB1F1A" font-weight="600">28 % intercepted</text><line x1="830" y1="340" x2="840" y2="428" stroke="#DB1F1A" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="6,4"/><rect x="700" y="610" width="280" height="100" rx="8" fill="#fff" stroke="#DB1F1A" stroke-width="3"/><text x="840.0" y="634" text-anchor="middle" font-weight="700" font-size="16">Hot loop -> radiator blades</text><text x="840.0" y="656" text-anchor="middle" font-size="13">8.5 GW of 10.8 GW drive budget</text><text x="840.0" y="674" text-anchor="middle" font-size="13">1800 K, 26,882 m2 effective</text><text x="840.0" y="692" text-anchor="middle" font-size="13">Li heat-pipe trunks to blade roots</text><line x1="840" y1="540" x2="840" y2="608" stroke="#DB1F1A" stroke-width="4" marker-end="url(#a)"/><rect x="40" y="610" width="600" height="100" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="3"/><text x="340.0" y="634" text-anchor="middle" font-weight="700" font-size="16">Not available as an energy path (rejected in the register)</text><text x="340.0" y="656" text-anchor="middle" font-size="13">X-ray mirrors (2 theta_c < 1 deg), absorber-to-exhaust routing (pressure 10^5x the 150 T field),</text><text x="340.0" y="674" text-anchor="middle" font-size="13">propellant regenerative cooling (0.05 GW for the whole 261 TW-class H2 flow),</text><text x="340.0" y="692" text-anchor="middle" font-size="13">expendable ablation (10^4-10^6 kg/s per TW)</text><text x="20" y="745" font-size="13">Ledger sums to 1.000 of gross fusion power; every joule counted once (results/integrated.json design_point.central).</text></svg>