# T06 proposal: candidate Vertex generations beyond V2, in the registry/generations.toml schema. Research records, not canon.
#
# Proposal only: T00 decides what enters registry/generations.toml. futures.py solves every generation here through convergence.py
# (read-only) and reports it in results/CHAINS.md, so each one is checked before T00 sees it.
# Each change names its technology (existing VTX ID or T06-NEW-n from registry_proposal.toml), its basis (TARGET = a requirement the
# technology must meet; MODEL = a geometric consequence the calculator computes) and any owner decision. Paths are dotted keys into the
# FDP-1 override tree, applied on top of V0 exactly as convergence.py applies registry/generations.toml.
#
# Gain-compression consistency (T04 EARLY 1b85941): compressing fuel to rho costs at least its Fermi-degenerate energy, so target gain
# G <= 1,787 x (eta_c / alpha) x (rho / 3,000 g/cm3)^(-2/3), where eta_c/alpha (driver-to-fuel compression coupling over adiabat) is at
# most 1. The Atlas V0-V2 pair (3,000 g/cm3, gain 3,000) needs eta_c/alpha = 1.68 and is therefore not energy-consistent. Both
# generations below set gain AT the bound for a stated coupling, so the coupling, not the gain, is the target the technology must meet.
#
# Ladder logic: V3 adds only Level B engineering targets and a consistent target at coupling 0.3 (itself far beyond present implosions);
# no nozzle-efficiency or Fiji change. V4 raises the coupling to 0.5 and adds a pulsed nozzle at the top of its theoretical range: the two
# levers IGNITION would have to declare (D-T06-1, D-T06-2). Fiji keeps exactly its canon card throughout. futures.py also solves each at
# the published driver efficiency 0.30 (V3c, V4c).

