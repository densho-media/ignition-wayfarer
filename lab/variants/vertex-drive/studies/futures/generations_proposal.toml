#   V4: eta_c/alpha 1.0 at 3,000 g/cm3, gain 1,787 -- the ideal-compression LIMIT, not a target: no real implosion reaches it.
# Driver efficiency is the published 0.30 (T01 planning value); futures.py also solves the 0.45 twins (V3o, V4o).
# Not booked (no calculator path): T01 launcher (+6-18 %), T03 closure-coil solid angle, T02 shoe solid angle, T03 eddy screens.

