[[technology]]
id = "T06-NEW-1"
name = "Thin-wall refractory heat-pipe radiators for the 1,800 K band"
kind = "technology"
workstream = "VTX-07"
purpose = "Halve the areal mass of the hot loop's heat-pipe panels (3.0 to 1.5 kg/m2 optimistic)."
principle = "Lithium heat pipes in Mo-Re or carbon-carbon shells; mass is wall and fin thickness, set by creep and meteoroid allowance, not by heat flux."
ancestry = ["S-T06-SP100", "S-T06-RADMASS"]
limitations = "Published space radiators sit at about 5-8 kg/m2; 1.5 kg/m2 flat plates are low-temperature. Creep at 1,800 K and dust puncture set the wall."
breakthrough = "None beyond advanced engineering; a requirement two to five times beyond published refractory practice."
depends_on = []
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "PLAUSIBLE_FUTURE"
research_status = "PROPOSED"
canon_status = "NON_CANON"
[technology.stages]
present = "SP-100 Mo-13Re/Li heat pipes; waste-heat radiators 6.8-8.2 kg/m2 in studies."
advanced = "Carbon-carbon armoured heat pipes at 3 kg/m2 (the FDP-1 optimistic tier)."
wayfarer_era = "1.5 kg/m2 hot panels, robotically replaced after dust damage."
[technology.geometry]
components = ["hot root bands (thinner panels, same area)"]
status = "PARAMETRIC_PLACEHOLDER"
representation = "HARDWARE"
colour = "THERMAL"
[[technology.claims]]
quantity = "elasticity_departure_vs_hot_areal_V1c"
value = 0.08
unit = "1"
basis = "MODEL"
source = "case:elasticities"

[[technology]]
id = "T06-NEW-2"
name = "High-specific-strength hoop and truss structure"
kind = "technology"
workstream = "VTX-02"
purpose = "Lower the virial-bound nozzle structure (M >= rho W / sigma) and the light trusses by doubling strength per mass."
principle = "Virial theorem: magnet structure mass per joule stored is rho / sigma; only the material's specific strength moves it."
ancestry = ["S-T06-CNTF-2024", "S-FOURBURN"]
limitations = "CNT fibres reach about 8 GPa in fibre form, not in a structural laminate; composite translation efficiency, creep under cryogenic and radiation load, joints."
breakthrough = "None beyond advanced engineering: a 3 GPa laminate at 1.6 t/m3."
depends_on = []
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "PLAUSIBLE_FUTURE"
research_status = "PROPOSED"
canon_status = "NON_CANON"
[technology.stages]
present = "CFRP at about 1.5 GPa allowable; CNT fibres 4-8 GPa quasi-static in the laboratory."
advanced = "CNT-reinforced laminates at 2-3 GPa."
wayfarer_era = "Nozzle hoops, wing spars and gallery trusses in a CNT-class laminate."
[technology.geometry]
components = ["thinner loop hoops", "lighter wing spars", "lighter gallery trusses"]
status = "PARAMETRIC_PLACEHOLDER"
representation = "HARDWARE"
colour = "STRUCTURE"
