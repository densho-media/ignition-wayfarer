[[decision]]
id = "D-T06-1"
kind = "canon"
question = "Does IGNITION declare, as part of its history, that D-3He targets were ignited with a driver-to-fuel compression coupling eta_c/alpha of about 0.3-0.5 (gain about 700-900 at 2,000-3,000 g/cm3)?"
options = ["Yes, as a named historical breakthrough (a fictional-history premise, not a Fiji property)", "No: keep the coupling an open research question and every Vertex generation provisional", "Defer until T04 reports"]
recommendation = "Defer until T04's handoff, then decide. The declared quantity should be the coupling, not the gain: the gain follows from it and the density, and the Atlas gain 3,000 at 3,000 g/cm3 is not energy-consistent at any coupling."
decider = "ApeDevil"

[[decision]]
id = "D-T06-2"
kind = "canon"
question = "Does IGNITION declare a validated pulsed magnetic nozzle at efficiency 0.79-0.86 (the top of the theoretical range)?"
options = ["Yes, as an engineering milestone of the history", "No: carry 0.65-0.72 as the planning band", "Defer until T03 and a D-09 study"]
recommendation = "Defer to T03. It is the steepest lever (elasticity -2.9 at V1c) and every generation's fate depends on it."
decider = "ApeDevil"

[[decision]]
id = "D-T06-3"
kind = "canon"
question = "May T06's non-canon technology-history scaffold (eras E0-E5 in HISTORY_PROPOSALS.md) be aligned with the IGNITION timeline workbook?"
options = ["Yes, read-only alignment through the drive reader when it is available", "No, keep it a free-standing proposal"]
recommendation = "Yes, read-only; no Drive write (D-11 stands)."
decider = "ApeDevil"

# ------------------------------------------------------------------------------------------------------------------------------------
# findings for the Atlas text
# ------------------------------------------------------------------------------------------------------------------------------------

[[finding]]
id = "F-T06-1"
text = "The nozzle-efficiency cliff of about 0.53 that V1 and V2 share is the exhaust-velocity gate eta_jet x b >= ve^2/(2 eps) = 0.524 (S-FIJI-V4), not the mass feedback. REPORT.md says the cause 'was not separated'; it can now say so."
source = "case:ve_gate"

[[finding]]
id = "F-T06-2"
text = "Convergence is sub-multiplicative in mass: combined chains save less than the product of their single savings, because payload, propellant and tanks form a floor (4,228 t at ve 19,201 km/s with every specific mass x1e-4). Its real effect is on closure: under the gain-compression bound the combined engineering package turns non-closing or 161 kt ships into 10-13 kt ones at eta_c/alpha 0.2-0.3."
source = "case:consistency"

[[finding]]
id = "F-T06-4"
text = "The Atlas generations V0-V2 (3,000 g/cm3, gain 3,000) need a compression coupling eta_c/alpha of 1.68 under T04's bound and are not energy-consistent; their masses are conditional (as T04 EARLY states)."
source = "case:consistency"

[[finding]]
id = "F-T06-3"
text = "The LOCKED 6.0 y round trip is a kinematic question, not a mass one: the minimum round trip is 6.35 y at 0.0069 g in every generation and every chain; any generation whose ceiling exceeds 0.0073 g meets 6.0 y at a few per cent more mass."
source = "case:chains"
