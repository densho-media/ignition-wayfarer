[[link]]
from = "VTX-01A"
to = "VTX-01"
kind = "conflicts"
effect = "Compression and gain are one lever (T04 EARLY bound G <= 1,787 x eta_c/alpha x (rho/3,000)^(-2/3)): denser fuel lowers the gain a driver can reach. The Atlas pair (3,000 g/cm3, gain 3,000) needs eta_c/alpha 1.68 and is not energy-consistent; 6,000 g/cm3 at gain 3,000 needs 2.66."
quantified = "consistency"

[[link]]
from = "VTX-07A"
to = "VTX-01"
kind = "enables"
effect = "Under the gain-compression bound the engineering package decides whether a ship exists: at eta_c/alpha 0.3, V1c (Atlas engineering) closes only at 161 kt, the full T06 package at 10.3 kt; at 0.2 V1c does not close and the package closes at 13.3 kt. Shared with VTX-01B, VTX-07B, VTX-07C, T06-NEW-1, T06-NEW-2."
quantified = "consistency.frontier"

[[link]]
from = "VTX-01A"
to = "VTX-01C"
kind = "worsens"
effect = "Where density is raised at fixed gain the pulse rate rises (133 to 449 Hz in K4); under the bound the consistent optimum is the opposite, lower density and larger, slower pulses (44 t TNT at 57-94 Hz in V3), which loosens the factory and the launcher but enlarges the nozzle (outer loop r 169 m)."
quantified = "proposals.V3"

[[link]]
from = "T06-NEW-2"
to = "VTX-02"
kind = "improves"
effect = "Doubling specific strength halves the virial nozzle structure; small for the whole ship (K5 -9 %)."
quantified = "chains.K5"

[[link]]
from = "T06-NEW-1"
to = "VTX-07"
kind = "improves"
effect = "Halving hot-panel areal mass saves about 4 % on V1c."
quantified = "chains.K2"

[[link]]
from = "VTX-02C"
to = "VTX-07"
kind = "improves"
effect = "Revision: at gain 3,000 the recirculating power is about 0.1 % of fusion, so recovery efficiency barely matters (0.90 to 0.98 moves V1c by 0.4 %). Its value is in pulse storage sizing, not mass."
quantified = "elasticities"

