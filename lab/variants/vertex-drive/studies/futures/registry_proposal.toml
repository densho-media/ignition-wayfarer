#
# Sections: [[technology]] (new records, core attributes; T00 completes the remaining brief attributes), [[link]] (new or revised
# interactions in links.toml schema), [[source]] (new evidence, S-T06-*), [[decision]] (D-T06-n), [[finding]] (corrections to the Atlas
# text that T00 may fold in). Numbers cite case:<name> in studies/futures/results/futures.json.

