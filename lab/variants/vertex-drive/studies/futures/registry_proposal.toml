physics_verdict = "PLAUSIBLE_FUTURE"
research_status = "PROPOSED"
canon_status = "NON_CANON"
[technology.stages]
present = "CFRP at about 1.5 GPa allowable; CNT fibres 4-8 GPa quasi-static in the laboratory."
advanced = "CNT-reinforced laminates at 2-3 GPa."
wayfarer_era = "Nozzle hoops, wing spars and gallery trusses in a CNT-class laminate."
[technology.geometry]
components = ["thinner loop hoops", "lighter wing spars", "lighter gallery trusses"]
