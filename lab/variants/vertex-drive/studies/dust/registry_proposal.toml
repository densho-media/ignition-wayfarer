# Decisions (proposed; none made)
# =====================================================================================================================================

[[decision]]
id = "D-T02-1"
type = "OWNER_APPROVAL_CANON"
state = "OPEN"
technologies = ["VTX-08D"]
question = "FDP-1/Vertex needs 1,717 AU to stop (beyond the heliopause); canon names a Kuiper anchorage. Which destination does the FDP-1/Vertex line assume?"
conclusion = "T02 used FDP-1's own burn distances; no mission parameter was changed."

[[decision]]
id = "D-T02-2"
type = "OWNER_APPROVAL_CANON"
state = "OPEN"
technologies = ["VTX-08D", "T02-NEW-1", "T02-NEW-2", "T02-NEW-3"]
question = "Which D-06 option should Wayfarer develop?"
conclusion = "Options (NOMINAL residual events beyond the protection, Vertex V1 / canon): (a) skirt or aft annulus + local bumpers + replaceable loop sectors, 22-90 t / 6-31 t, ~540 / ~67; (b) as (a) with an out-of-ecliptic heading, ~89 / ~12; (c) braking orientation or speed change (owner only, not studied); (d) accept and study, ~2,290 / ~730. Recommendation: (a), and (b) once the heading is chosen."

[[decision]]
id = "D-T02-3"
type = "OWNER_APPROVAL_CANON"
state = "OPEN"
technologies = ["VTX-08D"]
question = "Is the departure heading free to leave the ecliptic? A high-latitude path cuts Kuiper-belt exposure ~10x (ASSUMPTION)."
conclusion = "Open in canon."

[[decision]]
id = "D-T02-4"
type = "OWNER_APPROVAL_CANON"
state = "OPEN"
technologies = ["T02-NEW-3", "T02-NEW-4"]
question = "Accept periodic nozzle-loop sector replacement, or require a conductor tolerating ~1e20 n/cm2 (a proposed Level C breakthrough)?"
conclusion = "Recommendation: replacement (T02-NEW-3); T02-NEW-4 stays a labelled Level C need."
