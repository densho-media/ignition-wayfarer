[[revision]]
id = "VTX-08B"
fields.physics_verdict = "IMPOSSIBLE"
fields.prior_finding = "T02 2026-11-09: detection gives 0.2-21 ms warning for 0.1-10 mm grains; vaporising or deflecting a 1 mm grain in that time needs ~0.13 MJ on a 1 mm target or ~58 km/s lateral velocity. No active clearing."

[[revision]]
id = "VTX-08C"
fields.prior_finding = "T02 2026-11-09: D-12 confirmed (grain Larmor radius ~8e9 m at 1 mT). Ions deflect at no cost in the nozzle field, but ~75 % of LIC gas is neutral; gas power flux 0.03 W/m2, H fluence ~1e15/cm2 per leg, sputtering < 1 nm: no dedicated field needed."

[[revision]]
id = "VTX-08A"
fields.prior_finding = "T02 2026-11-09: defeated energy grows with stand-off squared (21 kJ at 1 m, 2.1 MJ at 10 m, 210 MJ at 100 m; band x0.1-x10); mass is small (tonnes), stand-off and burn's sky limit."

