# T02 registry proposal (dust, radiation and braking protection). Research, not canon; T00 decides what enters registry/*.toml.
# Provisional IDs: T02-NEW-n (technologies), S-T02-<NAME> (sources), D-T02-n (decisions). Fields follow registry/technologies.toml.
# Every number cites a T02 script result (case:<file>:<key>) or a source. Nothing here is an owner decision.

# =====================================================================================================================================
# New technologies
# =====================================================================================================================================

[[technology]]
id = "T02-NEW-1"
name = "Shadow-cone skirt (engine-first braking screen)"
kind = "technology"
workstream = "VTX-08"
purpose = "Screen the tanks, habitat rings and the back of the forward shield during engine-first braking without entering the burn's sky."
principle = "A thin conical sheet whose apex is the burn point and whose half-angle is the hardware cone: it contains the burn's rays (edge-on), lies in the shadow shield's umbra, and meets every grain moving forward along the ship at a grazing angle equal to the half-angle, 100-300 m ahead of what it protects, so each grain becomes a spreading plasma before it arrives."
ancestry = ["S-CANON", "S-FDP1", "S-HOANG-2017"]
ancestry_note = "Canon shadow-cone rule (crew and hardware cones) and the FDP-1 shadow shield; Whipple-bumper principle without the BLEs."
limitations = "Only works with the stream within ~1 deg of the axis (exposure 2,281 m2 at 0.4 deg, 4,060 at 2.29 deg, 9,194 at 5 deg); finite-source and rim-scatter terms unknown; structure and deployment not designed; cannot cover the bore-visible engine hardware."
breakthrough = "None needed; engineering only."
depends_on = ["VTX-08A"]
materials = ["MAT-CC"]
purposes = ["P14"]
inputs = "Sheet mass 22-90 t (V1, 0.5-2 kg/m2 over 44,900 m2); attitude hold within ~1 deg during braking."
outputs = "V1 engine-first exposure 12,282 -> 2,281 m2 at 0.4 deg; NOMINAL events beyond 2 m bumpers 2,290 -> 540 per mission."
penalties = "Mass; maintenance of holed area (< 1 % per mission NOMINAL); an attitude requirement."
criteria = "Exposed critical area engine-first; zero added burn solid angle; holed fraction per leg."
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "PLAUSIBLE_FUTURE"
research_status = "PROPOSED"
canon_status = "NON_CANON"
prior_finding = "T02 2026-11-09: exposure.py and impacts.py."
evidence = ["S-T02-STUDY"]
uncertainties = "Debris-cloud spread at 1e10 J/kg; large-grain environment (x5,000 LOW-HIGH)."
next = ["Rim-scatter and finite-source bound with T04 hot-spot size", "Structural concept and deployment (T05 illustration only, D-10)"]

[technology.stages]
present = "Thin multi-layer Whipple bumpers flown at 7-10 km/s; conical deployable sheets (solar sails, sunshields) flown."
advanced = "Large conical sheets on a tensioned frame, replaceable panels by drone."
wayfarer_era = "Skirt on the hardware cone, panels changed between burns."

[technology.questions]
a = "No: the impact regime is untested, but every element (thin sheets, deployable cones) exists."
b = "Yes: the bottleneck is the attitude hold and the unknown large-grain environment, not materials."
c = "Yes: it removes 80 % of the braking exposure for 0.2-0.9 % of departure mass (V1); canon form 6-31 t."

[technology.claims]
skirt_surface_m2 = { value = 44878, basis = "MODEL", source = "case:impacts.json:skirt.V1" }
skirt_mass_t = { value = "22-90", basis = "MODEL", source = "case:impacts.json:skirt.V1" }
exposure_with_skirt_m2_0p4deg = { value = 2281, basis = "MODEL", source = "case:exposure.json:cases.V1.ENGINE_FIRST.with_skirt" }

[technology.geometry]
status = "CONCEPTUAL_ILLUSTRATION"
representation = "HARDWARE"
envelope = "apex (-227.54, 0, 0); half-angle 7.94 deg (V1/V2), 9.60 deg (V0); r 7.2-45 m, x -175.8 to +95.1 m (V1). Canon form: flat annulus x -98 m, r 5.7-45 m, 6,260 m2, 6-31 t."

[[technology]]
id = "T02-NEW-2"
name = "Nozzle-loop guard rings and local bumpers"
kind = "technology"
workstream = "VTX-08"
purpose = "Give the bore-visible and silhouette-outside engine hardware a stand-off bumper where no external shield fits."
principle = "Bumper sheets on the stream-facing faces of loops, struts and feeds: up to ~2 m stand-off engine-first (burn's sky limits it), 20-25 m forward guard rings for loops 2 and 3 bow-first."
ancestry = ["S-WHIPPLE-BLE", "S-T02-STUDY"]
ancestry_note = "Whipple principle; BLEs not extrapolated."
limitations = "Burn-facing bumpers add burn solid angle (+0.001-0.004 hardware share, EXTRAPOLATION); 2 m stand-off defeats only ~84 kJ (7 ug): ~540 residual events per mission NOMINAL (V1 with skirt)."
breakthrough = "None."
depends_on = ["VTX-08A"]
materials = ["MAT-CC"]
purposes = ["P14"]
inputs = "~5-10 t of local bumpers; ~2 t per guard-ring layer."
outputs = "Loop-face events beyond the bumper: 49,200 (bare 5 mm wall) -> 540 per mission, V1 NOMINAL with the skirt."
penalties = "Solid angle, plume strike area."
criteria = "Residual events per sector per leg; added solid-angle share."
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "POSSIBLE_NOT_PRACTICAL"
research_status = "PROPOSED"
canon_status = "NON_CANON"
prior_finding = "T02 2026-11-09: impacts.py hits table."
evidence = ["S-T02-STUDY"]
uncertainties = "Solid-angle and plume-strike cost needs T03's field map."
next = ["T03: plasma fraction reaching 40-60 deg from the axis forward of the burn (guard-ring zone)"]

[technology.questions]
a = "Bumpers yes; at this speed and stand-off untested."
b = "Partly: limited by the burn's sky."
c = "Necessary but not sufficient: pairs with T02-NEW-3."

[technology.geometry]
status = "PARAMETRIC_PLACEHOLDER"
representation = "HARDWARE"
envelope = "Guard rings ~0.8 m wide, 20-25 m forward of loops 2 and 3 at r 64.7 / 112.0 m; local bumpers <= 2 m on every loop, strut and feed outside r 45 m."

[[technology]]
id = "T02-NEW-3"
name = "Segmented, replaceable nozzle-loop sectors"
kind = "technology"
workstream = "VTX-03"
purpose = "Make the nozzle loops survive both grain hits and neutron fluence by replacement rather than shielding."
principle = "Each loop built from independent sectors (six in the FDP-1 geometry) that can lose one sector without losing the nozzle and be swapped between burns."
ancestry = ["S-T02-REBCO-N", "S-T02-STUDY"]
ancestry_note = "REBCO fluence tolerance; the FDP-1 loop already has sector arcs (ship_geometry.json Loop_*_Sector_*)."
limitations = "Field ripple and nozzle efficiency with a missing sector (T03); spare mass; EVA/drone handling of 37-112 m loop sectors."
breakthrough = "None, unless a conductor tolerating ~1e20 n/cm2 is required (T02-NEW-4)."
depends_on = ["VTX-03"]
materials = ["MAT-REBCO"]
purposes = ["P03"]
inputs = "Spares for 3-31 loop-1 replacements per mission (V1, neutron fluence) plus grain-hit spares."
outputs = "Nozzle survival over 5.69 burn-years."
penalties = "Spare mass (UNKNOWN until T03 gives sector mass); maintenance time between burns."
criteria = "Nozzle efficiency with n sectors lost; sector mass; replacement time."
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "UNRESOLVED"
research_status = "PROPOSED"
canon_status = "NON_CANON"
prior_finding = "T02 2026-11-09: radiation.py (loops 3-62x REBCO tolerance); impacts.py (~540 residual hits)."
evidence = ["S-T02-REBCO-N", "S-T02-STUDY"]
uncertainties = "Quench/cut threshold of a REBCO sector under a ug-class hit; in-situ irradiation tolerance."
next = ["T03: nozzle efficiency with one of six sectors lost per loop", "T05: separable sectors and a replacement path (illustration)"]

[technology.questions]
a = "No: no superconducting magnet of this size is serviced in space."
b = "Yes, plausibly: the bottleneck is sector mass and replacement logistics."
c = "Yes: it is the only option found that answers both the grain and the neutron problem."

[technology.geometry]
status = "PARAMETRIC_PLACEHOLDER"
representation = "HARDWARE"
envelope = "Six separable sectors per loop at the FDP-1 arcs; replacement path to the hull."

