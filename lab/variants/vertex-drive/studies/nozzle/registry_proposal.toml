# ---------------------------------------------------------------- technologies
[[technology]]
id = "T03-NEW-1"
parent = "VTX-03"
title = "Forward closure coils on the X-ray stand-off sphere"
summary = "Two coaxial coils at polar 20 deg and 40 deg on d = R_s close the axial leak of the three-loop cup; with optimised currents the thin-shell model gives eta_mom 0.86-0.89 (eta_T 0.74-0.79) at 10-15 E_p of stored field, forward leak 0.15-0.3 %."
basis = "MODEL (upper bound, no instabilities)"
geometry = "C1 r 14.74 m z +40.51 m, C2 r 27.71 m z +33.03 m (nozzle frame, x = x_burn + z); C1 envelope radius 2-3.2 m; PARAMETRIC_PLACEHOLDER"
cost = "C1 80-132 MA, hoop tension 3-7 GN; envelope solid angle 0.040-0.051 vs 0.017 V1 (2.4-3.0x radiation_on_hardware)"
evidence = "results/nozzle_results.json designs C_W10, C_W15; results/calculator_reruns.json t03 cases"
status = "UNDER_INVESTIGATION"

[[revise_technology]]
id = "VTX-03A"
change = "Clocked sectors give 0.25-1.1 deg of field rotation at the stopping surface (3-3.7 deg at 20 % trim), no efficiency change (<0.5 pt). Re-scope from 'helical capture' to vectoring, fault tolerance and replacement. Correct 'm = 4 helical harmonic': with four sectors the gap ripple is m = 4 and carries no handedness under a 45 deg clock; the differential trim pattern is m = 2."
evidence = "results/nozzle_results.json perturbations (C_W10, Astar_W10)"

[[revise_technology]]
id = "VTX-03B"
change = "The useful shaping is axisymmetric (current distribution plus forward closure, T03-NEW-1). Non-planar (helical) shaping costs about 10 pt of eta_mom per 18 deg of shear: 0.86 -> 0.83 / 0.76 / 0.63 at 2 / 5 / 20 MA."
evidence = "results/nozzle_results.json perturbations"

[[revise_technology]]
id = "VTX-03C"
change = "Twist-reversal 'balanced' helices cancel roll torque only at one current (2.7e4 N m at 5 MA; 0.24 and 0.57 MN m at 2 and 20 MA). Balance is required but not sufficient; needs measured trim."
evidence = "results/nozzle_results.json perturbations"

