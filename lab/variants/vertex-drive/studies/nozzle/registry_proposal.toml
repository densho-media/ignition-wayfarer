# ---------------------------------------------------------------- decisions
[[decision]]
id = "D-T03-1"
type = "TECHNICAL_CONCLUSION"
state = "PROPOSED"
question = "Which efficiency does the calculator's nozzle_efficiency book?"
options = ["keep 0.79 as energy (current)", "book eta_T = eta_mom^2 x velocity-spread factor; 0.79 momentum -> 0.624"]
recommendation = "Book eta_T. The calculator uses it as jet = eta x stream; every published value is momentum. Show 0.79 as an unsupported optimistic bound."
who = "T00 (calculator owner); ApeDevil if a generation is re-based"

[[decision]]
id = "D-T03-2"
type = "TECHNICAL_CONCLUSION"
state = "PROPOSED"
question = "What stored field energy per pulse does the nozzle need?"
options = ["1 x E_p (FDP-1)", "10-15 x E_p (T03 model)"]
recommendation = "10-15 x E_p; 1 x cannot stop the pulse in any coil set modelled."
who = "T00"

[[decision]]
id = "D-T03-3"
type = "EXPERIMENT_APPROVAL"
state = "OPEN"
question = "Approve the D-09 pulsed-nozzle simulation in the scope of REPORT.md section 8?"
options = ["approve 2D Hall MHD + 2D hybrid PIC campaign (A, C, C+helix)", "approve 2D only", "keep D-09 closed"]
recommendation = "Approve 2D first (1e4-1e5 core-hours per case); 3D only if C passes eta_T >= 0.70."
who = "ApeDevil"

[[decision_evidence]]
id = "D-01"
stance = "SUPPORT, REFINE"
evidence = "Balanced helicity confirmed necessary (one-handed helix 0.27-0.7 MN m roll). Refine: sector clocking gives under about 1 deg of shear, so its stability value is nil; the harmonic is m = 2 (trim) / m = 4 (gaps, no handedness), not an 'm = 4 helical harmonic'."

[[decision_evidence]]
id = "D-03"
stance = "SUPPORT, STRENGTHEN"
evidence = "At 10-15 E_p of stored field (W 0.8-1.2e12 J) a 1 % trim in 5 ms is about 3-5 TW, 10-14x the 340 GW quoted."
