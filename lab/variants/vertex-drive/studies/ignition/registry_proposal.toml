[revise.VTX-01D]
prior_finding_append = "T04: as a core of rhoR 2-3 g/cm2 the spark costs almost no energy or escaping neutrons (escaping 14.1 MeV below 2e-7 of fusion); the cost is 43-144 kg of tritium per mission and pre-ignition risk (Nakashima 1993: gain 3). The Atlas statement that a spark raises shield mass is not borne out at fuel rhoR 90; it holds only for an outside primary (T04-NEW-5)."
questions_c_replace = "Yes, as the most credible ignition route, if the mission can carry about 0.1 t of tritium; no tamper needed for its neutrons."

[revise.VTX-04A]
prior_finding_append = "T04 tamper-inertia case (k = share of thin-shell inertia that confines): k = 1 gives +1.2 % ve at rhoR 90 (mu 0.03), +10.7 % at rhoR 1 (mu 0.18); k = 0.5: +0.3 % / +3.0 %. The k = 0 liner table is reproduced exactly. The burnup effect is real but small at the mission rhoR."

[revise.VTX-04B]
prior_finding_append = "T04 (D-04): no mission phase needs it. Escape spirals at 0.0069 g take 0.4-2.1 days; the low gear at mu 3 halves that. The idle vessels cost 667 t at V1 departure."

