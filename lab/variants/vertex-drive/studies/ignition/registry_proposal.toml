[[technology]]
id = "T04-NEW-1"
name = "Compression-consistent D-3He target (lower density, larger pulse)"
kind = "technology"
workstream = "VTX-01"
purpose = "A fuel-only target whose gain does not exceed what its own compression energy allows."
principle = "Compressing fuel to rho costs at least the Fermi-degenerate energy alpha eps_F(rho) (D-3He 132 MJ/g at 3,000 g/cm3, 64 at 1,000). With coupling eta_c, gain G <= eta_c b eps / (alpha eps_F + ignitor). The ceiling rises as rho^-2/3 while the pulse yield at fixed rhoR grows as rho^-2."
ancestry = ["S-T04-ATZENI-2004", "S-FDP1"]
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "PLAUSIBLE_FUTURE"
research_status = "PROPOSED"
canon_status = "NON_CANON"
prior_finding = "T04 2026-11-09: FDP-1's optimistic tier (3,000 g/cm3, gain 3,000, 27 MJ driver) needs eta_c / alpha = 1.68, i.e. more energy in the cold fuel than the driver delivers. The V1 cliff of 705 needs eta_c/alpha 0.39 at 3,000 g/cm3, 0.19 at 1,000, 0.12 at 500 g/cm3."
claims = [
  { quantity = "fermi_energy_DHe3_3000", value = 132.0, unit = "MJ/g", basis = "MODEL", source = "case:compression" },
  { quantity = "gain_ceiling_per_eta_3000", value = 1787.0, unit = "1", basis = "MODEL", source = "case:compression" },
  { quantity = "eta_over_alpha_for_FDP1_gain", value = 1.68, unit = "1", basis = "MODEL", source = "case:compression" },
  { quantity = "eta_over_alpha_for_V1_cliff_1000", value = 0.19, unit = "1", basis = "MODEL", source = "case:compression" },
]

