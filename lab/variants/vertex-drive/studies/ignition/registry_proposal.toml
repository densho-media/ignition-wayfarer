breakthrough_replace = "D-3He ignition (hot spot about 50 keV, about 7 g/cm2) at target gain about 600-700 with driver-to-fuel coupling eta_c/alpha of 0.12-0.4 (density 500-3,000 g/cm3) at 3-100 Hz for years; or a labelled Level C compression aid (D-T04-1)."

