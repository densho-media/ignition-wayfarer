[challenge.D-02]
proposal = "Amend, do not reverse: 'No tamper raises ve by more than about 1 % at the mission rhoR, even with tamper inertia (T04 case k <= 1); tampers help by up to 10 % only at rhoR below 10 g/cm2, far below the mission ve.'"
evidence = "results/ignition.json liner.tables (k = 0, 0.5, 1)"

[[decision]]
id = "D-T04-1"
type = "OWNER_APPROVAL_CANON"
state = "OPEN"
technologies = ["VTX-01", "T04-NEW-1"]
question = "Keep FDP-1's dense 19 t pulses at gain above about 900, which needs an explicit Level C compression aid, or accept a compression-consistent target (lower density, larger, slower pulses, or a lower gain)?"
options = "A: accept physics-consistent targets: gain capped by eta_c b eps / (alpha eps_F); T00 re-runs V1 on the frontier (results/IGNITION.md section 4). B: declare a Level C 'compression aid' (for example Fiji flux compression doing the work) with the property it must have: deliver about 0.4-1.7 x the driver energy as fuel internal energy each pulse; this is a new Fiji property and falls under D-07."
recommendation = "A."
who = "ApeDevil"

