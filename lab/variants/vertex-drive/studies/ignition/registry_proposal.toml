# T04 registry proposal (for T00 at Phase 4). Nothing here is in the registry; provisional IDs only (T04-NEW-n, S-T04-<NAME>, D-T04-n).
# Every number cites studies/ignition/results/ignition.json (case:<key>) or a source below. A recommendation is not an owner approval.

# ===================================================================================================================================
# New sources
# ===================================================================================================================================

[source.S-T04-ATZENI-2004]
title = "The Physics of Inertial Fusion (burn parameter H_B, ignition conditions, burn fraction), as tabulated in an arXiv lecture"
authors = "S. Atzeni, J. Meyer-ter-Vehn (Oxford, 2004); table reproduced in arXiv:2410.18054"
date = "2004"
locator = "ISBN 9780198562641; arXiv:2410.18054"
kind = "book"
finding = "Burn fraction b = rhoR / (rhoR + H_B), H_B = 8 m_i c_s / <sv>; minimum H_B 7.3 (D-T), 52 (D-D), 51 (D-3He), 73 (p-11B) g/cm2; isochoric D-T ignition needs T > 8 keV and rhoR > 0.25 g/cm2."
limits = "Fit valid for modest burn fractions; the table is a secondary reproduction; arxiv.org could not be opened from the session."
relation = "Check of the calculator's H_B (44.2 g/cm2 at 100 keV, 13 % below the published D-3He minimum) and validation of the T04 hot-spot model."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-09 web search: H_B table values and formula quoted from arXiv:2410.18054 search extract; D-T isochoric condition from a fast-ignition paper citing Atzeni."

[source.S-T04-ATZENI-1999]
title = "Inertial fusion fast ignitor: igniting pulse parameter window vs the penetration depth of the heating particles and the density of the precompressed fuel"
authors = "S. Atzeni"
date = "1999"
locator = "Physics of Plasmas 6, 3316-3326 (1999)"
kind = "journal"
finding = "Optimal igniting-beam energy scales as rho^-1.85; optimum hot-spot areal density about 0.6 g/cm2 at about 6.5e19 W/cm2 (D-T)."
limits = "D-T only; the absolute energy at a reference density was not confirmed in the search extract."
relation = "Calibration of the T04 0-D hot-spot model (factor 3.5 in rhoR for burn dynamics) and the fast-ignition energy scale."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-09 web search: abstract (iris.uniroma1.it 11573/104598) gives the exponent and the 0.6 g/cm2 optimum."

[source.S-T04-ATZENI-CIAMPI-1997]
title = "Burn performance of fast ignited, tritium-poor ICF fuels"
authors = "S. Atzeni, M. L. Ciampi"
date = "1997"
locator = "Nuclear Fusion 37 (1997) 1665-1677, doi:10.1088/0029-5515/37/12/I01"
kind = "journal"
finding = "2-D simulations of compressed nearly pure deuterium with an off-centre D-T seed, fast ignited by an external beam; compared with equimolar D-T."
limits = "Deuterium main fuel, not D-3He; numerical results not seen."
relation = "Ancestry of the fast-ignited D-T booster core (T04-NEW-3)."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-09 web search: bibliographic record and abstract; numbers not seen."

[source.S-T04-NAKAO-1992]
title = "Burn characteristics of compressed fuel pellets for D-3He inertial fusion; follow-up: Numerical simulation of implosion and burn of DT-ignitor/D3He fuel pellet"
authors = "Y. Nakao et al. (Kyushu University); H. Nakashima et al. (1993); T. Honda et al. (1991)"
date = "1992"
locator = "Fusion Technology 22 (1992) 66-72 (OSTI 7107437); Laser and Particle Beams (1993); Fusion Technology 20 (1991) 819-823"
kind = "journal"
finding = "D-3He pellets need a small D-T ignitor; fuel gain about 500 at D-T rhoR 3 and total rhoR 14 g/cm2, 5 keV spark, compressed to 5,000x liquid density; driver about 30 MJ at 10 % coupling. Follow-up implosion simulation: the D-T ignitor pre-ignites before the D-3He is compressed, pellet gain only about 3. Later fast-ignition work: gains about 100 below 10 MJ."
limits = "Abstract-level; spin polarisation is invoked to relax requirements; the pre-ignition result undercuts the 500."
relation = "The only published D-3He ICF gain numbers found; anchor for the D-T core size (rhoR about 3 g/cm2) and for the pre-ignition risk."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-09 web search: OSTI and ANS abstract records and a citing 2007 Kyushu paper; full texts not opened."

[source.S-T04-MAGLIF-BR]
title = "Magnetised fuel ignition threshold B R (Basko, Kemp, Meyer-ter-Vehn 2000) and MagLIF B R measurements"
authors = "M. M. Basko et al. (2000); Sandia MagLIF team; AMPS paper arXiv:2504.10680"
date = "2000-2025"
locator = "Nuclear Fusion 40 (2000) 59; arXiv:2504.10680; Sandia publication 'Data-driven assessment of magnetic charged particle confinement parameter' (2023)"
kind = "journal"
finding = "Magnetisation lowers the needed fuel rhoR only above B R about 0.6 MG cm (D-T alphas); benefit saturates above about 1.0 MG cm; MagLIF on Z has reached about 0.4-0.5 MG cm."
limits = "D-T alphas; the D-3He proton values in T04 are scaled by Larmor radius (EXTRAPOLATION)."
relation = "Sets the magnetisation requirement of VTX-01A for 14.7 MeV protons: about 1.2 MG cm threshold, 2.0 saturation."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-09 web search: consistent across a Sandia slide set, an APS abstract and arXiv:2504.10680 (extracts)."

[source.S-T04-POLARISED]
title = "Fusion reactor plasmas with polarised nuclei"
authors = "R. M. Kulsrud, H. P. Furth, E. J. Valeo, M. Goldhaber"
date = "1982"
locator = "Physical Review Letters 49, 1248 (1982)"
kind = "journal"
finding = "Spin-polarised D-T and D-3He raise the fusion cross-section by up to 1.5x; polarisation may survive in a burning plasma."
limits = "Survival of polarisation through compression to thousands of g/cm3 is undemonstrated; polarised He-3 at target scale not shown."
relation = "Basis of T04-NEW-2 (H_B / 1.5)."
verification = "UNVERIFIED"
checked = "2026-11-09 not searched; carried from the author's knowledge; the Honda/Nakao abstracts mention spin polarisation as a relief."

