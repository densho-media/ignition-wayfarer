[revise.VTX-07C]
physics_verdict = "PLAUSIBLE_FUTURE"
prior_finding = "T01: bottom-up house load 0.012-0.014 % of fusion (conservative, about 10 MJ per pellet, of which 8 MJ factory process) and 0.003-0.005 % (advanced; the factory itself about 0.6 MJ per pellet, the rest is the Carnot surcharge of cryoplants rejecting at 700 K) for fuel-only targets near 81 GJ yield. The 0.05 % TARGET is met with margin; the 0.1 % baseline was about 8x high. Valid only while the yield per target stays near 1e11 J."
claims = [
  { quantity = "house_fraction_bottom_up_conservative", value = 1.23e-4, unit = "1", basis = "MODEL", source = "S-T01-IFE-TARGET-COST", case = "V1_house_bottomup_cons" },
  { quantity = "house_fraction_bottom_up_advanced", value = 2.6e-5, unit = "1", basis = "TARGET", source = "S-T01-CRYO", case = "V1_house_bottomup_adv" },
]

[revise.VTX-01C]
limitations = "No repetition-rated engagement demonstration. NEW (T01): FDP-1 flies 12.5 targets at once on the axis, 3.7 m apart at 400 m/s; each is 3.7 m from the previous 81 GJ pulse (about 5e6 J/m2 of X-rays and 5e8 J/m2 of plasma) and cannot survive. Only one target may be in the open per period: v >= path x rate, 4.7-7.5 km/s in the T01 cases."
breakthrough = "Cryogenic D2/He-3 targets launched at 4.7-7.5 km/s (1e5 g in a 10-20 m barrel) at 100-150 Hz, or a shielded flight path; made at about 1-9 MJ each."
claims = [
  { quantity = "injection_speed_required_one_in_flight", value = 6067.0, unit = "m/s", basis = "MODEL", source = "S-T01-LEDGER", case = "S1_advanced_eta0.30" },
  { quantity = "injection_speed_fdp1", value = 400.0, unit = "m/s", basis = "ASSUMPTION", source = "S-FDP1" },
]

[revise.VTX-07A]
prior_finding = "T01 split ledger: with TARGET components (cores 640 K, power stages 740 K, capacitors 550 K, dumps 1,000 K) the equivalent single loop is 628 K on a tin droplet sheet at emissivity 0.5 (670 K at 0.8; 679 K but 1.5 kg/m2 on panels); the 640 K induction cores alone are about 40 % of the warm area, not 700-800 K. With near-term components (cores 470 K, SiC 500 K) it is 489 K and the ship does not close on 3 kg/m2 radiators at any driver efficiency."
uncertainties = "Induction-core loss above 473 K; MW power stages above 523 K; pulse capacitors above 473 K; sheet emissivity of a tin droplet layer."

[revise.VTX-07]
limitations = "Induction cores and MW SiC are demonstrated to about 423-523 K, not 600-800 K; the 450-700 K band is the heat-pipe working-fluid gap; the Atlas warm radiator (1.0 kg/m2 at 600-800 K) matches no solid panel technology, only a droplet sheet TARGET. FDP-1 itself (V0) does not close at 2.5 kg/m2 or at 500 K."

[revise.VTX-07B]
prior_finding = "T01: a tin sheet at 0.6 kg/m2 (emissivity 0.5) is the only radiator in the record that delivers the Atlas areal mass above 520 K; at emissivity 0.3 the ship grows 11.8 % (S1_adv_eps0.3_eta0.30), at 0.8 it shrinks 5.6 %."
uncertainties = "Sheet emissivity; collection loss at 0.007-0.019 g (fly the drops parallel to the thrust axis so acceleration only changes their speed: 0.5 a t^2 about 0.9 m over 100 m at 20 m/s); dust (T02)."

[revise.VTX-01B]
uncertainties = "Efficiency 0.45 vs 0.20-0.30 published; driver mass per W: the closure is steep in it (V1 10.4 kt at 0.05 kg/kW, 12.9 kt at 0.1, 25.1 kt at 0.2 = the calculator's central tier; the T01 advanced case at eta 0.30 does not close at 0.2 kg/kW). Volt-second scaling of the induction cores suggests 0.05 kg/kW is optimistic by more than 10x (EXTRAPOLATION, unmodelled)."

