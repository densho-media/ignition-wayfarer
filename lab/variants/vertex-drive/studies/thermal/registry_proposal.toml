[decision.D-T01-1]
type = "TECHNICAL_CONCLUSION"
question = "Which warm-loop temperature may a Vertex generation claim?"
recommendation = "Claim the equivalent temperature of the booked circuits, not a single loop: about 630 K with every component TARGET met and a tin droplet sheet; 700-800 K only as a stretch band. V1/V2 should carry the split ledger instead of the 700 / 800 K overrides."
who = "T00 proposes; ApeDevil confirms at integration."

[decision.D-T01-2]
type = "TECHNICAL_CONCLUSION"
question = "Should the target-injection speed be a closure input (one target in flight)?"
recommendation = "Yes. FDP-1's 12.5 targets in flight is not physical at 81 GJ per pulse. Propose a calculator change (T00 integration proposal, owner approval): cap the pulse rate at v_inj / path, or carry v_inj as a TARGET of 5-7 km/s."
who = "Calculator change: T00 proposal, ApeDevil approval. Target physics: T04."
