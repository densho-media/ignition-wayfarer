[new.T01-NEW-1]
name = "One-target-in-flight injection (fast cryogenic target launcher)"
kind = "technology"
workstream = "VTX-01"
purpose = "Keep every target behind the shield until the previous pulse has fired, then deliver it to the burn point within one period."
principle = "The next target must not be in the open when a pulse fires: v >= (muzzle-to-burn path) x pulse rate. At FDP-1 scale the path is about the X-ray stand-off (43-50 m) and the rate 100-150 Hz, so v is about 4.7-7.5 km/s."
penalties = "Launcher energy small (0.02-0.25 MJ per target); the hard part is a 1e5 g launch of a liquid-He-3-in-D2 target. A slower launcher caps the pulse rate: 4 km/s +6.3 %, 2.5 km/s +17.5 % (rate 36 Hz), 1.5 km/s does not close (T01 advanced, eta 0.30)."
credibility = "PLAUSIBLE_FUTURE"
claims = [
  { quantity = "mass_penalty_at_2500_m_s", value = 0.175, unit = "1", basis = "MODEL", source = "S-T01-LEDGER", case = "S1_advanced_eta0.30_vinj2500" },
]
handoff = "T04 owns the target and cadence; T03 owns whether the nozzle field can shelter a slower target."

[new.T01-NEW-2]
name = "Circuit-by-circuit warm radiator (split warm loop as booked)"
kind = "technology"
workstream = "VTX-07"
purpose = "Replace the single warm loop with the circuits the components allow; report each circuit's area."
principle = "Equivalent radiator: same total area and mass as the circuits; T_eq from the area, areal mass area-weighted."
claims = [
  { quantity = "warm_T_eq_advanced", value = 628.0, unit = "K", basis = "TARGET", source = "S-T01-LEDGER", case = "S1_advanced_eta0.30" },
  { quantity = "warm_T_eq_conservative", value = 489.0, unit = "K", basis = "EXTRAPOLATION", source = "S-T01-LEDGER", case = "S1_cons_T_calcopt_eta0.45" },
]

