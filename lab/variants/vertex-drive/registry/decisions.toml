# Vertex Drive Technology Atlas: the decision register. Research records, not canon.
#   type  TECHNICAL_CONCLUSION (a finding the Atlas states; the owner may challenge it) | OWNER_APPROVAL_CANON (changes canon or the ship,
#         needs the owner) | OWNER_APPROVAL_EXPERIMENT (authorises a study, Blender work or Drive change)
#   state OPEN | DECIDED
# Phase 4 integration 2026-11-09: written by planning/integrate_phase4.py from the 8de3ffa registry and the thread proposals.


[[decision]]
id = "D-01"
type = "TECHNICAL_CONCLUSION"
state = "DECIDED"
technologies = ["VTX-03", "VTX-03A", "VTX-03C"]
question = "What form may a helical field take?"
conclusion = "Magnetic shear only, by clocking the trim sectors (m = 4 harmonic), with balanced helicity. A net swirl about the axis needs axial current in the plasma (Ampere) and would spin the exhaust (1 % swirl about 2.8e5 N m roll, 11x the RCS couple). | T03 2026-11-09: supported and refined: sector clocking gives under 1 deg of shear; the harmonic is m = 2 (trim) / m = 4 (gaps, no handedness)."

[[decision]]
id = "D-02"
type = "TECHNICAL_CONCLUSION"
state = "DECIDED"
technologies = ["VTX-04", "VTX-04A"]
question = "Does a sacrificial liner or tamper help at the mission exhaust velocity?"
conclusion = "No with the current target model: the four-burn optimiser and the Atlas liner study both find the best tamper is essentially zero. Reopened only through D-T spark targets (VTX-01D) and an unmodelled burnup gain. | T04 2026-11-09 amendment: no tamper raises ve by more than about 1 % at the mission rhoR even with tamper inertia; up to 10 % only below 10 g/cm2."

[[decision]]
id = "D-03"
type = "TECHNICAL_CONCLUSION"
state = "DECIDED"
technologies = ["VTX-05", "VTX-05A"]
question = "Where does fast pulse control act?"
conclusion = "On the target and driver side only. Superconducting loops cannot be trimmed between pulses (1 % trim in 5 ms is about 340 GW); loops are trimmed over seconds for vectoring. | T03 2026-11-09: strengthened: at 10-15 E_p of stored field (0.8-1.2 TJ) a 1 % trim in 5 ms is 3-5 TW, not 340 GW (which assumed 1 E_p)."

[[decision]]
id = "D-04"
type = "OWNER_APPROVAL_CANON"
state = "OPEN"
technologies = ["VTX-04B"]
question = "Keep the three idle canon H2 vessels and the hydrogen low gear, or remove them?"
conclusion = "Removing them saves about 1.2 kt at departure in V0. Keeping them is right only if a mission phase needs high thrust at low ve. V1 and V2 assume removal; convergence.py reports V1 with them kept. | Owner 2026-11-09: keep the hydrogen low gear out of the preferred experimental configuration, without changing canon (canon keeps the vessels)."

