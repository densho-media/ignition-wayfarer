# Vertex Drive Technology Atlas: interactions between technologies. Research records, not canon.
#
# Hard prerequisites are `depends_on` in technologies.toml. This file holds the softer interactions the brief asks for: one [[link]] per
# directed effect of `from` on `to`.
#   kind      enables (makes `to` possible or easier) | improves (raises its performance) | worsens (raises its cost or risk) |
#             conflicts (the two cannot both be used as specified) | shares (common hardware or loop)
#   effect    what happens, in words
#   quantified  a case name in results/convergence.json that measures it, or "UNKNOWN" (never a guessed number)
# Phase 4 integration 2026-11-09: written by planning/integrate_phase4.py from the 8de3ffa registry and the thread proposals.


[[link]]
from = "VTX-02A"
to = "VTX-01A"
kind = "enables"
effect = "The lattice provides the target seed field that magnetised targets need."
quantified = "UNKNOWN"

[[link]]
from = "VTX-01A"
to = "VTX-01"
kind = "improves"
effect = "Magnetisation is the most direct route to the gain the drive needs; the gain cliff per generation is measured."
quantified = "gain_threshold"

[[link]]
from = "VTX-01C"
to = "VTX-07C"
kind = "improves"
effect = "The target factory is the bulk of the house load; its energy per pellet sets the warm loop."
quantified = "house_sweep"

[[link]]
from = "VTX-07C"
to = "VTX-07"
kind = "improves"
effect = "Every watt of house load is a watt of warm-loop heat and radiator area."
quantified = "house_sweep"

[[link]]
from = "VTX-07A"
to = "VTX-07D"
kind = "improves"
effect = "A hotter machinery loop shrinks the wings (tip radius falls from km to hundreds of metres), which makes deployment and dust protection credible."
