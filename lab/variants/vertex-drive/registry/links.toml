[[link]]
from = "VTX-05A"
to = "VTX-03"
kind = "improves"
effect = "Symmetric, well-placed burns keep the nozzle at its design efficiency and plume-strike share."
quantified = "UNKNOWN"

[[link]]
from = "VTX-05B"
to = "VTX-06B"
kind = "enables"
