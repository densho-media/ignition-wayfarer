[[technology]]
id = "VTX-03"
name = "Helical magnetic capture"
kind = "workstream"
workstream = "VTX-03"
purpose = "Turn more of each expanding plasma shell into a narrow axial jet and less into off-axis plume that strikes hardware."
principle = "Thrust comes from the plasma's diamagnetic current against the applied field. Magnetic shear (field-line direction changing across the plasma-field interface) stabilises Rayleigh-Taylor and flute modes of a decelerating plasma; a net twist about the axis would need axial current (Ampere) and would spin the exhaust, which is a loss and a roll torque."
ancestry = ["S-MERINO-AHEDO", "S-CASSIBRY-PMN", "S-MSFC-NOZZLE", "S-W7X-2025"]
ancestry_note = "Detachment theory; simulated pulsed nozzles 0.34-0.70; theoretical 0.79-0.86; stellarators show engineered 3D fields."
limitations = "No pulsed beta >> 1 nozzle has been tested; sector gaps and m = 4 ripple open leakage paths; FDP-1 already assumes 0.79, the theoretical bound."
breakthrough = "Nozzle efficiency at or above about 0.79 in a 3D-shaped field, with a plume-strike share near 1 % of the nozzle loss."
depends_on = ["VTX-02"]
materials = ["MAT-REBCO"]
purposes = ["P05"]
inputs = "Sector current differences (slow); shaping-coil currents."
outputs = "Higher nozzle efficiency and less plume on hardware (benefit UNKNOWN until simulated)."
penalties = "Ripple losses; possible net angular momentum; more conductor."
criteria = "Nozzle efficiency; plume-strike share; net angular momentum flux; ripple at the stopping surface."
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "UNRESOLVED"
research_status = "UNDER_INVESTIGATION"
canon_status = "NON_CANON"
prior_finding = "Integration study: shear only, by clocking the trim sectors; net swirl forbidden (1 % swirl about 2.8e5 N m roll, CMGs full in 0.36 s); efficiency 0.79 -> 0.72 costs +61 % mass."
evidence = ["S-MERINO-AHEDO", "S-CASSIBRY-PMN", "S-VTX-STUDY-2026-11-08"]
uncertainties = "Sign and size of the effect: the benefit and the penalty are both plausible, neither is computed."
next = ["2D/3D resistive MHD or hybrid PIC of a pulsed shell in plain vs clocked vs shaped fields", "Nozzle-efficiency cliff per generation (convergence.py, done)"]

[technology.stages]
present = "Steady magnetic nozzles in thrusters; simulated pulsed nozzles; stellarator 3D fields for confinement."
advanced = "Optimised 3D nozzle fields designed by the same methods as stellarators, validated on pulsed-plasma test stands."
wayfarer_era = "A nozzle field whose shear is tuned pulse to pulse within slow coil limits, holding efficiency near the theoretical bound."

