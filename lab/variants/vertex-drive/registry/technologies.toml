# Vertex Drive Technology Atlas: the technology registry. Research records, not canon.
#
# One [[technology]] per record. `kind = "workstream"` is one of the eight Vertex workstreams VTX-01..VTX-08; `kind = "technology"` is a
# candidate mechanism inside one (`workstream` names it). IDs are stable: Blender objects, engineering models and lore cite them, never the
# display name. Never reuse or renumber an ID; retire a record with research_status = "RETIRED" instead.
#
# Three independent classifications (atlas.py validates the vocabularies):
#   credibility      ESTABLISHED (Atlas level A: the effect is experimentally shown) | PLAUSIBLE_FUTURE (level B: accepted physics, application
#                    not demonstrated) | FICTIONAL_BREAKTHROUGH (level C: a defined IGNITION property). Not the PMDS material levels.
#   physics_verdict  IMPOSSIBLE | POSSIBLE_NOT_PRACTICAL | PLAUSIBLE_FUTURE | FICTIONAL_DEPENDENT | UNRESOLVED  (the brief's five outcomes)
#   research_status  PROPOSED | UNDER_INVESTIGATION | SUPPORTED | CONTRADICTED | PARKED | RETIRED
#   canon_status     NON_CANON | CANDIDATE | APPROVED   (only the owner moves a record past NON_CANON; no study promotes one)
# questions.a/b/c answer the brief: A can we do this today, B could advanced engineering make it practical (and the bottleneck), C would it
# benefit Wayfarer as an integrated system. stages are developmental hypotheses, never timeline entries.
# depends_on lists hard prerequisites (the record cannot work without them); it must stay acyclic. Synergies and conflicts are in links.toml.
# materials are PMDS catalogue IDs (data/materials/catalogue.toml), purposes are PMDS purposes P01-P14; the Atlas does not copy material data.
# geometry.status: ENGINEERING_SUPPORTED | PARAMETRIC_PLACEHOLDER | CONCEPTUAL_ILLUSTRATION | NONE; geometry.representation: HARDWARE |
# VISUALIZATION | MIXED | NONE; geometry.colour is a src/wayfarer/functional_colors.py PALETTE key.
# priority scores 1-5: feasibility (influence on mission feasibility), credibility, independence (few unmet prerequisites), mass_thermal,
# unlock (opens other regimes), design_3d (value to the 3D model). atlas.py weights them 3/2/1/2/2/1.
# claims: every number the record asserts. basis PUBLISHED (a source shows it) | MODEL (a Wayfarer calculation) | ASSUMPTION | TARGET (a
# requirement the technology would have to meet). source is a registry/sources.toml ID or case:<name> in results/convergence.json.

# =====================================================================================================================================
# VTX-01  Advanced pulsed fusion ignition
# =====================================================================================================================================

[[technology]]
id = "VTX-01"
name = "Advanced pulsed fusion ignition"
kind = "workstream"
workstream = "VTX-01"
purpose = "Release D-3He fusion energy in discrete, dense micro-burns far from all hardware, at the gain and burnup the mission exhaust velocity needs."
principle = "Inertial confinement: a target compressed to areal density rhoR burns a fraction b = rhoR / (rhoR + H_B) before it disassembles; target gain G = yield / driver energy sets the recirculating power 1/(G eta_driver)."
ancestry = ["S-NIF-2025", "S-MAGLIF-2020", "S-DAEDALUS-1978", "S-FIJI-V4", "S-FOURBURN"]
ancestry_note = "NIF has shown D-T ignition at gain about 4; MagLIF shows magnetisation helps; Daedalus defined the pulsed D-3He drive; Fiji v4 derived the ve gate eta x b >= 0.52."
limitations = "D-3He has never been ignited; it needs about 5-10x the temperature of D-T; best target gain is about 4 (D-T), laser wall-plug about 1 %, cadence about one shot per day."
breakthrough = "D-3He ignition at target gain of about 1,000 or more with rhoR about 90 g/cm2 at 100-200 Hz for years."
depends_on = ["VTX-01A", "VTX-01B", "VTX-01C"]
materials = ["MAT-W", "MAT-LIH"]
purposes = ["P03", "P07"]
inputs = "Driver beam energy (27 MJ per pulse in FDP-1), cryogenic D and He-3, electricity for the target factory."
outputs = "Plasma kinetic energy per pulse (19.5 t TNT, 8.1e10 J in FDP-1), plus escaping X-rays and neutrons."
penalties = "Recirculating power, driver waste heat (warm loop), X-ray fluence on hardware, D-D neutrons and tritium."
criteria = "Target gain G; burn fraction b; driver wall-plug efficiency; repetition rate; neutral (X-ray + neutron) escape fraction; target cost in energy per pellet."
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "PLAUSIBLE_FUTURE"
research_status = "UNDER_INVESTIGATION"
canon_status = "NON_CANON"
prior_finding = "Integration study 2026-11-08: keep FDP-1's pulsed point burn as is; the gain cliff sits at about 1,100 (FDP-1) and moves to 700-1,000 with the thermal package. Atlas bisection: 1,257 (V0), 705 (V1), 581 (V2)."
evidence = ["S-NIF-2025", "S-FDP1", "S-FIJI-V4"]
uncertainties = "Whether D-3He can ignite without a D-T spark; burn physics at 100 keV and rhoR 90 g/cm2; pellet survival at 1.5 K during 400 m/s injection."
next = ["Gain threshold sweep per Vertex generation (convergence.py, done)", "Burn-fraction model check against published D-3He ICF simulations", "Target-factory energy per pellet (VTX-01C)"]

[technology.stages]
present = "D-T ignition at gain about 4 with lasers; magnetised liner targets on Z; pellet injection at 400 m/s."
advanced = "Fuel-only magnetised targets compressed by efficient stand-off drivers at 10-100 Hz; gain hundreds (D-T)."
wayfarer_era = "Magnetised D-3He targets at gain about 1,000-3,000, 100-200 Hz, with Fiji-seeded magnetisation (VTX-02A); still the cliff of the design."

[technology.questions]
a = "No. D-3He ignition is undemonstrated, and gain is three orders of magnitude short."
b = "Plausibly; the bottleneck is gain x driver efficiency (recirculating power), then repetition rate and target cost."
c = "Yes, it is the only fusion mode in the record that closes four 0.016 c burns; but the whole design exists only above the gain cliff."

[technology.geometry]
