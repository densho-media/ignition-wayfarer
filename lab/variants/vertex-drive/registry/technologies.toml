limitations = "At rhoR 90 g/cm2 the fuel already absorbs its own neutrons and most X-rays (about 1.15 % of fusion escapes), so there is little to recover."
breakthrough = "A target regime that leaks enough radiation for a tamper to recover more than its mass costs, or a tamper that raises burnup by inertial confinement (not modelled)."
