envelope = "Point burn 43 m aft of the shadow shield; X-ray stand-off sphere radius 43 m."
location = "Aft of the equipment module on the ship axis."
connections = "Pellets from VTX-01C, beams from VTX-01B, plasma into the VTX-03 nozzle."
loads = "None on hardware directly; impulse is carried by the nozzle field."
radiation = "Source of all X-rays and neutrons."
thermal = "Escaping radiation on hardware goes to the hot loop."
maintenance = "Nothing at the burn; the plug and ports are serviced behind the shield after shutdown."
