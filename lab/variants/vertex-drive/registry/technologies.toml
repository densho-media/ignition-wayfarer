uncertainties = "Grain size spectrum on the actual path; penetration physics at 0.016 c; whether the plume clears grains."
next = ["Exposure map per generation using lab/problems/fdp1-requirements P11 (protrusion, frontal area)", "Vaporisation-regime bumper model", "Owner question on braking orientation (decision D-C9)"]

