name = "Sacrificial injection and radiation conversion"
kind = "workstream"
workstream = "VTX-04"
purpose = "Use deliberately added material to absorb radiation, protect hardware, or supply reaction mass, where that helps the integrated drive."
principle = "Added mass mu (kg per kg of fuel) lowers exhaust velocity as ve = sqrt(2 eta b eps / (1 + mu)) unless the energy it recovers per kg exceeds the jet's specific energy (1.84e14 J/kg at 19,201 km/s). At fixed jet power, thrust rises as sqrt(1 + mu)."
ancestry = ["S-FOURBURN", "S-SOLEM-MEDUSA", "S-LI-VAPOR", "S-FIJI-V4"]
