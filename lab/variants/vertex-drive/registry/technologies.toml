[[technology]]
id = "VTX-02"
name = "Fiji lattice field engineering"
kind = "workstream"
workstream = "VTX-02"
purpose = "Create and hold the nozzle field geometry (and the target seed field) with as little conductor and structure as the physics allows."
principle = "Superconducting loops store field energy W; the virial theorem sets the minimum structure mass M >= rho W / sigma. The Fiji lattice amplifies and stabilises the field (canon) but cannot change W or the stress it imposes."
ancestry = ["S-HAHN-2019", "S-SORBOM-2015", "S-FIJI-V4", "S-CANON"]
ancestry_note = "Real HTS at 45.5 T and demountable REBCO magnets; canon Fiji amplification up to x30, stabilisation only, not a heat sink."
limitations = "Structure mass from stored energy; quench protection of large loops; conductor dose; field ripple at sector gaps."
breakthrough = "None beyond canon Fiji (Level C) plus advanced HTS; every added Fiji ability is forbidden."
depends_on = ["VTX-02A", "VTX-02B"]
materials = ["MAT-REBCO", "MAT-REBCO-APC01", "MAT-SS-316LN", "MAT-INCONEL-718"]
purposes = ["P05", "P06", "P10"]
inputs = "Charging energy (about 8e10 J stored, FDP-1 ratio 1:1 with pulse energy); cryocooling."
outputs = "A paraboloidal nozzle field, 3 loops x 4 sectors."
penalties = "Loop structure 86 t, armour 91 t (V0); solid angle 0.009 of the burn's sky."
criteria = "kg per J stored; ampere-turns; quench energy dump; fluence limit; ripple."
credibility = "FICTIONAL_BREAKTHROUGH"
physics_verdict = "FICTIONAL_DEPENDENT"
research_status = "UNDER_INVESTIGATION"
canon_status = "NON_CANON"
prior_finding = "Integration study: the lattice gets no new properties; it lowers ampere-turns, not stored energy or virial structure. The calculator gives Fiji no mass credit."
evidence = ["S-CANON", "S-FIJI-V4"]
uncertainties = "The canon lattice's operating temperature, response time and field limit at the loops are OPEN in canon."
next = ["Write the Fiji capability card (VTX-02A) into the Atlas (done)", "Ask the owner which open lattice parameters (temperature, response) canon fixes"]

[technology.stages]
present = "REBCO at 45.5 T in small coils; demountable HTS for tokamaks; no Fiji."
advanced = "Large no-insulation REBCO loops with distributed quench protection and radiation-tolerant pinning."
wayfarer_era = "Fiji-cored loops: fewer ampere-turns and a stabilised flux geometry between pulses; structure still set by W."

[technology.questions]
a = "The field strengths are reachable; the loop sizes, cycling and dose are not demonstrated."
b = "Yes for HTS; Fiji itself is a Level C dependency."
c = "Yes; the nozzle is irreplaceable, but its mass is set by physics, not by Fiji."

