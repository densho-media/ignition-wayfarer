[[technology]]
id = "VTX-08"
name = "Interstellar and interplanetary particle protection"
kind = "workstream"
workstream = "VTX-08"
purpose = "Protect every critical part from gas and dust at up to 0.016 c in coast and in both burn orientations, including engine-first braking."
principle = "At 4,800 km/s a grain carries about 1.2e13 J/kg (about 2,800 times TNT per unit mass); impacts are in the vaporisation regime far above any tested shield; neutral grains are not deflected by magnetic fields."
ancestry = ["S-HOANG-2017", "S-ULYSSES-ISD", "S-WHIPPLE-BLE", "S-CANON"]
ancestry_note = "Relativistic erosion scaling; interstellar grain mass and flux; Whipple equations end near 7-9 km/s tested; canon forward-shield shadow rule."
limitations = "No shield physics validated at 0.016 c; the forward shield covers only r 45 m and only in the bow-first orientation; FDP-1 loops reach r 112 m and wings 3.6 km; during braking the engine leads."
breakthrough = "Validated multi-layer vaporisation-regime shields; dust detection and clearing ahead of the ship; protection for the engine-first orientation."
depends_on = ["VTX-08A"]
materials = ["MAT-CC", "MAT-B4C", "MAT-HDPE", "MAT-W"]
purposes = ["P11", "P14", "P07"]
inputs = "Shield mass; sensing power; for active clearing, laser or plasma energy."
outputs = "Survival of loops, wings, tanks and rings."
penalties = "Mass ahead of the ship; for engine-first braking, mass on the engine side; solid angle if bumpers sit in the burn's sky."
criteria = "Critical parts outside the shield silhouette; bumper mass per m2; survival probability over the mission path."
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "UNRESOLVED"
research_status = "UNDER_INVESTIGATION"
canon_status = "NON_CANON"
prior_finding = "Integration study: the largest integration problem; braking burns fly engine-first into the dust stream (canon ship too); nothing in the record addresses it."
