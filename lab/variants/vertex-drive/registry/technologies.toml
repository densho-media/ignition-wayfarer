[[technology]]
id = "VTX-01A"
name = "Magnetised fuel-only D-3He target"
kind = "technology"
workstream = "VTX-01"
purpose = "A target made only of fuel (no liner, no high-Z ablator), magnetised so that 14.7 MeV protons and hot electrons stay in the burn."
principle = "A seed field compressed with the fuel traps charged fusion products (Larmor radius millimetres at 150 T, microns after compression) and suppresses electron heat loss, lowering the ignition threshold."
ancestry = ["S-MAGLIF-2020", "S-FIJI-V4", "S-DAEDALUS-1978"]
ancestry_note = "MagLIF shows that magnetisation plus preheat is needed for yield; v4 section 4 derived the Fiji seed-field role; Daedalus used D-3He pellets."
limitations = "Magnetisation lowers driver energy, not the rhoR needed for burnup (the fuel at beta >> 1 is held by inertia); D-3He needs about 100 keV."
breakthrough = "Compressing a magnetised D2-shell / liquid He-3 target to about 3,000 g/cm3 without mixing, and igniting it without a D-T spark."
depends_on = ["VTX-02A"]
materials = []
purposes = ["P03"]
inputs = "Seed field at target formation; cryogenic He-3 and D."
outputs = "Higher target gain at a given driver energy."
penalties = "Field coils near the target-formation region; cryogenic handling at 1.5 K."
criteria = "Gain improvement factor from magnetisation; seed field required; mix fraction."
credibility = "PLAUSIBLE_FUTURE"
physics_verdict = "PLAUSIBLE_FUTURE"
research_status = "PROPOSED"
canon_status = "NON_CANON"
prior_finding = "Fiji v4: target magnetisation raises gain and lowers driver energy but does not lower the rhoR needed for burn fraction."
evidence = ["S-MAGLIF-2020", "S-FIJI-V4"]
uncertainties = "No quantitative gain model for magnetised D-3He in the calculator; its benefit is UNKNOWN and is not credited in any generation."
next = ["Find published magnetised D-3He ICF simulations and their gain curves", "Define the seed field the Fiji lattice must provide at the target"]

[technology.stages]
present = "Magnetised D-T liner targets on Z (kJ-class yield); no fuel-only magnetised targets."
advanced = "Fuel-only magnetised D-T targets compressed by beams; magnetisation as a standard gain multiplier."
wayfarer_era = "Fiji-seeded magnetised D-3He targets as the drive's consumable; the gain the mission needs is reached partly through magnetisation."

[technology.questions]
a = "No; magnetised targets exist only with liners and at D-T."
b = "Plausibly; bottleneck is magnetic flux compression without a liner and fuel mix at extreme compression."
c = "Yes if it raises gain past the cliff; it is the most direct lever on VTX-01's breakthrough."

