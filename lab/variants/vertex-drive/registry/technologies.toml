purposes = ["P05"]
inputs = "Sector current differences (slow); shaping-coil currents."
outputs = "Higher nozzle efficiency and less plume on hardware (benefit UNKNOWN until simulated)."
penalties = "Ripple losses; possible net angular momentum; more conductor."
