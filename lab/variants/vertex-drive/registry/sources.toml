[S-W7X-2025]
title = "Wendelstein 7-X sets new performance records in fusion research (long-pulse triple product)"
authors = "Max Planck Institute for Plasma Physics (IPP), EUROfusion"
date = "2025-06"
locator = "https://www.ipp.mpg.de/5532945/w7x"
kind = "press"
finding = "An optimised stellarator (3D helical field shaped by non-planar coils) held a record long-pulse triple product for about 43 s, fuelled by about 90 injected frozen pellets at a programmed rate."
limits = "Steady confinement, not a pulsed expanding plasma; the paper was under review at the time of the release."
relation = "Ancestry for VTX-03B: externally generated non-axisymmetric fields can be engineered to a specification; also pellet-injection heritage for VTX-01C."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-08 web search: IPP, EUROfusion and World Nuclear News agree (43 s vs 'up to 60 s' differ between releases)."

[S-MERINO-AHEDO]
title = "On plasma detachment in propulsive magnetic nozzles; Magnetic nozzles for space plasma thrusters (review)"
authors = "E. Ahedo, M. Merino (Universidad Carlos III de Madrid)"
date = "2011; 2016"
locator = "Physics of Plasmas 18, 053504 (2011); Encyclopedia of Plasma Technology (Taylor & Francis, 2016)"
kind = "journal"
finding = "Thrust in a magnetic nozzle comes from the diamagnetic azimuthal current; the classic detachment mechanisms (induced field, electron inertia, collisions) tend to push the plasma outward; ion demagnetisation is the key to inward detachment."
limits = "Steady, low-beta thruster plumes; not pulsed beta >> 1 fusion plasmas."
relation = "Foundation of VTX-03 (what a nozzle field can and cannot do) and of the plume-strike uncertainty."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-08 web search: UC3M repository, APS abstract and journal records."

