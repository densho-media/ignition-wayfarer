authors = "S. Ryan, W. P. Schonberg; E. L. Christiansen (NASA JSC)"
date = "2024; 1990-2009"
locator = "International Journal of Impact Engineering 187 (2024); NTRS 20090024821"
kind = "journal"
finding = "Whipple ballistic-limit equations cover three regimes: ballistic below 3 km/s, shatter 3-7 km/s, melt and vaporisation above 7 km/s; test data above about 9 km/s are scarce."
limits = "Orbital-debris speeds (up to ~15 km/s); Wayfarer's 4,800 km/s is about 300 times beyond the tested range, so these equations do not apply directly."
relation = "Shows why VTX-08A cannot reuse orbital shielding rules; points to vaporisation-regime physics instead."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-08 web search: IJIE abstract and NTRS records."

