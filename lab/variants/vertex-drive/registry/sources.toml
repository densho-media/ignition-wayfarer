# Vertex Drive Technology Atlas: evidence register.
#
# One entry per source. The verification states reuse the PMDS vocabulary (docs/MATERIALS.md):
#   PRIMARY_VERIFIED    read in the original publication
#   SECONDARY_VERIFIED  matched against a secondary reproduction (abstract page, catalogue record, institutional press release)
#   TRANSCRIBED         a named source carried over from an earlier Wayfarer study; not re-checked here
#   UNVERIFIED          the source, or its support for the claim, is not established
# `checked` records how and when. The cloud session cannot open arxiv.org, osti.gov or ntrs.nasa.gov full texts, so nothing here is
# PRIMARY_VERIFIED. `finding` is what the source demonstrates; `limits` is what it does not; `relation` is how the Atlas uses it.
# Our own extrapolations never live here: they are the `advancement` fields of registry/technologies.toml and are labelled there.
# `kind` is one of: journal, conference, report, press, book, dataset, model (a Wayfarer lab calculation), canon (a Wayfarer canon value).
# Phase 4 integration 2026-11-09: written by planning/integrate_phase4.py from the 8de3ffa registry and the thread proposals.


[S-NIF-2025]
title = "NIF achieves record 8.6 MJ yield from 2.08 MJ laser energy (eighth ignition shot, 7 April 2025)"
authors = "Lawrence Livermore National Laboratory"
date = "2025-05"
locator = "https://lasers.llnl.gov/news/llnl-experts-foster-national-fusion-energy-ecosystem-ife-star-conference"
kind = "press"
finding = "Indirect-drive D-T ignition; target gain (yield / laser energy on target) of about 4.1, the record as of 2025. LLNL estimates a target gain approaching 15 for a facility with zero net electric demand."
limits = "D-T, not D-3He; one shot per day-scale cadence; laser wall-plug efficiency about 1 %; gain is target gain, not facility gain."
relation = "Present foundation of VTX-01: demonstrated ignition, three orders of magnitude below the gain FDP-1 assumes (3,000)."
verification = "SECONDARY_VERIFIED"
checked = "2026-11-08 web search: LLNL release and independent press agree on 8.6 MJ / 2.08 MJ; the 4.13 figure is press-reported, LLNL says 'exceeding four'."

