# FDP-1 (Fiji Drive Pulsed prototype) baseline configuration, version fdp1-v1 (2026-11-04). Research prototype, nothing here is canon.
#
# One authoritative pipeline: this file -> lab/studies/four-burn-mission (the four-burn calculator, scenario v1) -> engineering/ (shielding,
# structure, thermal, tanks, mission, geometry) -> results/<version>/<variant>.json -> blender/build_fdp1.py. Blender reads the same
# engineering record the reports print; nothing is typed twice.
#
# Status of every entry, as in the four-burn scenario:
#   CANON      read from data/wayfarer_3d.toml / the built ship (never retyped here unless quoted as a reference)
#   STUDY      a four-burn scenario v1 value (lab/studies/four-burn-mission/scenarios/v1.toml), used as is
#   RESEARCH   a published value or standard physics (source given)
#   ASSUMPTION an engineering judgement inside a researched range
#   PROTOTYPE  a free FDP-1 design choice (geometry, layout)
# A variant file (config/variants/<name>.toml) holds only the entries it changes; it is deep-merged over this file.

version = "fdp1-v1"
date = "2026-11-04"

[base]
calculator = "lab/studies/four-burn-mission"            # the authoritative four-burn engine (fourburn package)
scenario = "v1"                                  # its scenario file
architecture = "IFD-PH"                          # pulsed D-3He, optional H tamper (the optimiser picks ~0 tamper -> fuel-only)
tier = "optimistic"                              # speculative-engineering tier: gain 3,000, rhoR ~90 g/cm2 (see NOTES "gain discrepancy")
[base.overrides]                                 # deep-merged into the four-burn scenario; empty = scenario v1 unchanged

[mission]
ve_km_s = { value = 19201.17208, status = "STUDY", note = "four-burn optimistic optimum (= canon operating-point exhaust velocity)" }
a0_g = { value = 0.006895573489099627, status = "STUDY", note = "departure acceleration of the four-burn IFD-PH optimistic 10 kt design (case 5); FDP-1 holds it and lets the mass close" }
payload = { source = "mass_model", reference_t = 860.0, status = "CANON", note = "non-propulsion dry mass from src/wayfarer/mass_model.dry_parts minus the superseded items; the four-burn study used 860 t (see NOTES)" }
superseded_items = ["drive_package", "radiators_thermal", "tankage_"]   # mass_model ids (prefix match) that FDP-1 replaces with its own sizing
destination_distances_AU = [0.0, 10000.0, 63241.077]   # 0 = minimum stopping distance; 63,241 AU = 1 light year (reference only, not a story choice)
dose_budget_share = { value = 0.5, status = "ASSUMPTION", note = "share of the crew's annual limit given to the drive (the rest: cosmic rays, solar events)" }
crew_dose_limit_Sv_per_year = { value = 0.020, status = "RESEARCH", note = "ICRP occupational average 20 mSv/y" }

[integration]
# Geometry and engineering are solved together: shield mass, FDP-1 structure, idle-vessel tankage and the hardware solid angle the
# geometry actually presents are fed back into the four-burn closure until the departure mass reproduces itself.
feedback = true
max_iterations = 200
tolerance = 1.0e-7
keep_idle_hydrogen_vessels = { value = true, status = "PROTOTYPE", note = "brief: do not delete the hydrogen vessels; their dry mass is carried (and reported)" }
low_loop_radiator_kg_m2 = { value = 2.5, status = "ASSUMPTION", note = "300 K panel for the added propellant cryocooling" }

[layout]
# Ship-frame metres, +X bow. The aft module bolts to the existing thrust ring; everything aft of it is FDP-1.
hull_attach = { datum = "AFT", offset_m = 0.0, status = "CANON", note = "layout AFT datum -144.75 m: the four-nozzle drive's exit plane, hidden (not deleted) in the FDP-1 scene" }
module_length_m = { value = 36.0, status = "PROTOTYPE", note = "equipment module: target factory, energy storage, power conditioning, cryoplant, final transport" }
module_radius_m = { value = 6.5, status = "PROTOTYPE", note = "= body radius, inside the shadow cone" }
shield_standoff_factor = { value = 1.0, status = "PROTOTYPE", note = "shield aft face distance from the burn point in units of the X-ray stand-off R_s (>= 1)" }
shadow_margin_m = { value = 1.0, status = "PROTOTYPE", note = "shield rim beyond the protected cone" }

[nozzle]
# Single axial magnetic nozzle: a paraboloidal cup of loops with the burn point at its focus, open aft (v4 aft escape geometry).
coil_count = { value = 3, status = "PROTOTYPE", note = "v4: three Fiji loops" }
phi_min_deg = { value = 60.0, status = "PROTOTYPE", note = "polar angle (from +X) of the forward-most loop; it sits exactly at R_s" }
phi_max_deg = { value = 120.0, status = "PROTOTYPE", note = "polar angle of the aft-most loop" }
trim_sectors = { value = 4, status = "PROTOTYPE", note = "independently powered magnetic trim sectors per loop: control authority, not engines" }
sector_gap_deg = { value = 5.0, status = "PROTOTYPE" }
conductor_density_kg_m3 = { value = 4000.0, status = "ASSUMPTION", note = "REBCO tape + CFRP/steel hoop structure, smeared" }
envelope_factor = { value = 3.0, status = "ASSUMPTION", note = "cryostat and armour envelope radius / structural minor radius" }
struts_per_loop = { value = 6, status = "PROTOTYPE" }
strut_topology = { value = "chain", status = "PROTOTYPE", note = "loop 3 -> loop 2 -> loop 1 -> shield frame along the paraboloid; star = every loop straight to the shield" }
strut_solidity = { value = 0.15, status = "ASSUMPTION", note = "lattice (truss) columns: projected solid share of the column envelope seen by the burn" }
fiji_lattice_band_deg = { value = 70.0, status = "PROTOTYPE", note = "outer-face arc of each loop carrying the Fiji amplification lattice (canon: amplification and stabilisation only)" }
plume_half_angle_deg = { value = 20.0, status = "ASSUMPTION", note = "detached exhaust cone; magnetic nozzle studies 15-30 deg" }

[drivers]
type = "heavy-ion induction linac"
beams = { value = 9, status = "PROTOTYPE", note = "HIF designs 8-100 beams; three per gallery" }
galleries = { value = 3, status = "PROTOTYPE", note = "driver galleries along the hull, placed in the widest gaps between the radiator planes" }
gallery_radius_m = { value = 12.0, status = "PROTOTYPE", note = "outside the hull service envelope; the folded passes need angular room" }
beam_aperture_m = { value = 0.8, status = "ASSUMPTION", note = "radial spacing of nested arcs (magnet aperture + cryostat)" }
ion_mass_u = { value = 207.0, status = "RESEARCH", note = "Pb (HIF reference ions Bi/Pb)" }
ion_energy_GeV = { value = 4.0, status = "ASSUMPTION", note = "HIF drivers 2-10 GeV" }
charge_state = { value = 3, status = "ASSUMPTION" }
gradient_MV_m = { value = 3.0, status = "ASSUMPTION", note = "induction linac average gradient 1-3 MV/m" }
folds = { value = 2, status = "PROTOTYPE", note = "passes per beam joined by a 180 deg arc (nested arcs, tangential plane)" }
bend_field_T = { value = 10.0, status = "ASSUMPTION", note = "superconducting arc dipoles (LHC 8.3 T, HL-LHC 11 T class)" }
core_density_kg_m3 = { value = 3000.0, status = "ASSUMPTION", note = "smeared induction-core + cell density; sets the drawn cross-section from the calculator's driver mass" }
storage_pulses = { value = 5, status = "PROTOTYPE", note = "pulse-power buffer between recovery and driver" }
storage_kJ_per_kg = { value = 2.0, status = "ASSUMPTION", note = "pulsed-power capacitor/inductive store energy density 1-3 kJ/kg" }
beam_cone_fraction = { value = 0.7, status = "PROTOTYPE", note = "beam approach half-angle as a share of the shield's shadow half-angle" }
port_diameter_m = { value = 0.4, status = "PROTOTYPE", note = "beam port bore through the shield" }

[fuel]
target_concept = "frozen D2 shell holding liquid He-3 at ~1.5 K (He-3 does not solidify below ~29 bar)"
d2_ice_density_kg_m3 = { value = 200.0, status = "RESEARCH" }
he3_liquid_density_kg_m3 = { value = 82.0, status = "RESEARCH", note = "liquid He-3 near 1.5 K (0.082 g/cm3)" }
injection_speed_m_s = { value = 400.0, status = "ASSUMPTION", note = "gas-gun pellet injectors 0.3-1 km/s (fusion fuelling)" }
magazine_pulses = { value = 3000, status = "PROTOTYPE", note = "pellet buffer at the injector" }
injectors = { value = 2, status = "PROTOTYPE", note = "one active, one fault-isolated spare" }
bore_diameter_m = { value = 0.15, status = "PROTOTYPE" }
plug_margin_m = { value = 0.25, status = "PROTOTYPE", note = "on-axis LiH plug behind the injector breech: as thick as the crew core plus this margin (the crew trunk lies on this axis)" }
plug_radius_m = { value = 0.8, status = "PROTOTYPE" }

[shielding]
lambda_LiH_m = { value = 0.15, status = "ASSUMPTION", note = "neutron relaxation length in LiH for 2.45-14 MeV (fission-spectrum ~0.10-0.17 m)" }
rho_LiH_kg_m3 = { value = 780.0, status = "RESEARCH" }
rho_W_kg_m3 = { value = 19300.0, status = "RESEARCH" }
w_face_m = { value = 0.01, status = "PROTOTYPE", note = "tungsten X-ray face: ~3 mm stops the escaping 100 keV X-rays to the crew limit (computed); 1 cm for erosion margin, renewable" }
w_mu_per_m = { value = 8570.0, status = "RESEARCH", note = "W at 100 keV (NIST XCOM 4.44 cm2/g x 19.3 g/cm3)" }
tissue_mu_en_m2_kg = { value = 0.00256, status = "RESEARCH", note = "100 keV soft tissue (NIST)" }
neutron_energy_MeV = { value = 2.45, status = "RESEARCH", note = "D-D neutrons dominate the escaping spectrum" }
fluence_to_dose_Sv_m2 = { value = 4.2e-14, status = "RESEARCH", note = "ICRP 74 ambient dose per neutron fluence at 2.5 MeV (416 pSv cm2)" }
hardware_decades = { value = 3.0, status = "ASSUMPTION", note = "attenuation for tanks, drivers, forward hardware (cryogenic heating, activation): placeholder until transport" }
frame_fraction = { value = 0.08, status = "ASSUMPTION", note = "shield support frame per kg shield" }
# Protected envelopes (radius, nearest x) are read from canon geometry by engineering/shielding.py; edge-on radiator planes are exempt.

[structure]
sigma_allow_Pa = { value = 6.0e8, status = "ASSUMPTION", note = "CFRP/Ti struts, before the safety factor" }
safety_factor = { value = 2.0, status = "ASSUMPTION" }
modulus_Pa = { value = 1.2e11, status = "ASSUMPTION" }
density_kg_m3 = { value = 1700.0, status = "ASSUMPTION" }
tube_t_over_r = { value = 0.05, status = "ASSUMPTION" }
design_accel_g = { value = 1.5, status = "CANON", note = "owner ceiling; structure is sized for 1.5 g although FDP-1 peaks far lower (re-rateable later)" }
module_frame_kg_per_m = { value = 1500.0, status = "ASSUMPTION", note = "equipment-module frame and decks per metre" }
wing_spar_kg_per_m = { value = 25.0, status = "ASSUMPTION", note = "radiator wing spar/manifold truss per metre of span: in-plane thrust loads are tiny; sized by deployment and manoeuvre loads (unresolved)" }
gallery_kg_per_m = { value = 120.0, status = "ASSUMPTION", note = "driver gallery truss per metre" }

[radiators]
# Areas and masses come from the four-burn closure (hot 1800 K heat pipes / 1100 K droplet, warm 400-600 K driver loop).
reuse_existing_hot_blades = { value = true, status = "PROTOTYPE", note = "the three 1800 K blades (canon) carry part of the FDP-1 hot loop" }
layout = { value = "auto", status = "PROTOTYPE", note = "auto = the lightest candidate (radiator view-factor penalty + spars); W2/W3/W6 force one" }
candidates = ["W2", "W3", "W6", "ENVELOPE"]
root_radius_m = { value = 10.0, status = "PROTOTYPE" }
wing_forward_x = { value = 88.0, status = "PROTOTYPE", note = "forward edge: ring A aft sweep 95.15 m less 7 m clearance" }
# hot panels beyond the reused blades form the root band of each warm wing (1800 K band, thermal break, then the 400-600 K field)

[tanks]
selected = { value = "T-B", status = "PROTOTYPE", note = "proposed layout drawn in place; the others are computed and drawn as hidden alternatives" }
options = ["T-A", "T-B", "T-C"]
bay_gap_m = { value = 2.0, status = "PROTOTYPE" }
outer_ring_radius_m = { value = 41.5, status = "PROTOTYPE", note = "T-C third vessel ring" }
