# Vertex Drive Technology Atlas: the Vertex generations. Research records, not canon.
#
# status  HISTORICAL_CONDITIONAL  the 2026-11-08 Atlas generations V0-V2, kept unchanged as a record. T04 showed their target (gain 3,000
#                                 at 3,000 g/cm3) needs a compression coupling eta_c/alpha of 1.68 (compression alone; 2.1 with the ignitor), i.e. more energy in the cold fuel than
#                                 the driver delivers; T01 withdrew the 700-800 K warm loop; T03 showed 0.79 is a momentum efficiency.
#                                 Their masses are conditional on all three and are not design figures.
#         RESEARCH_TARGET         corrected generations (2026-11-09, T00 Phase 4): every thread correction applied; remaining TARGETs named.
#         BOUND                   the lightest ship the combined physics allows in this model; never a target.
# Paths under `vertex.` are Vertex adapter inputs (convergence.py), not FDP-1 keys: `vertex.compression_coupling` with
# `vertex.rho_g_cc` sets the target gain at the T04 compression bound; `vertex.launcher_speed_m_s` caps the pulse rate so that only one
# target is in the open per period (T01/T04). The FDP-1 calculator itself is not changed.
#
# Each generation is FDP-1 (lab/variants/fdp1, variant "baseline") plus a list of [[generation.change]] entries. convergence.py turns the
# changes into FDP-1 overrides (path = dotted key into the FDP-1 override tree), solves the ship and runs the benchmarks.
# Every change names the technology that would earn it, its basis (TARGET = a requirement that technology must meet, never a demonstrated
# value; MODEL = a geometric consequence the calculator computes) and, where the change alters canon or the ship's role, the owner
# decision it needs (decisions.toml). No change may raise an efficiency without a technology record behind it.
# Benefits that no model quantifies (collimation by helical shear, magnetised gain, vapour curtains) are NOT in any generation; they are
# carried as sensitivity bands in convergence.py and reported separately.

