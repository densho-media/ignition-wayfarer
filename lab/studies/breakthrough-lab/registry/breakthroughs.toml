# Breakthrough Lab: the breakthrough registry. Research records, NOT canon.
#
# A breakthrough (BT-nnn) is the smallest, precisely defined technological advance that would remove one named engineering limitation
# (a weakest link, WL-nnn). It changes only the calculator inputs it lists under `levels`; everything else stays at the scientific
# reference (scenarios.toml [reference]). IDs are stable: never reuse or renumber one; retire a record with development = "REJECTED".
#
# Classifications (lab.py validates every vocabulary; they are kept apart on purpose):
#   level        A established | B advanced, physics-consistent extrapolation | C speculative (a defined fictional property). The same
#                A/B/C as the PMDS material levels (docs/MATERIALS.md) and the Technology Atlas credibility (ESTABLISHED, PLAUSIBLE_FUTURE,
#                FICTIONAL_BREAKTHROUGH); not a new scale.
#   evidence     scientific evidence for the advanced value: DEMONSTRATED | LITERATURE_SUPPORTED | CALCULATED | EXTRAPOLATED | UNVERIFIED |
#                FICTIONAL_ASSUMPTION. A calculated result is not a demonstration.
#   development  PROPOSED | UNDER_INVESTIGATION | SELECTED_FOR_EXPERIMENT | REJECTED | APPROVED_FOR_CANON
#   canon        NON_CANON | CANDIDATE | APPROVED (the Atlas canon vocabulary). Only the owner moves a record past NON_CANON, with a decision
#                id in `canon_decision`. Switching a breakthrough on in the website's Breakthrough Lab never changes it.
#
# Each [[breakthrough.levels]] is one point of a bounded parameter table: `set` maps calculator input paths (the Technology Atlas adapter,
# lab/variants/vertex-drive/convergence.py at the pinned T00 commit) to values. Level 0 is always the scientific reference and must equal
# scenarios.toml [reference] exactly; a level may only set paths the breakthrough lists in `modifies`. `limit` is the edge of what the
# calculator may be asked: a value beyond it is reported OUT_OF_RANGE, never computed. `penalties.booked` names what the calculator
# re-sizes on every solve; `penalties.unbooked` names consequences it cannot compute (they stay as open indicators on every scenario).

[[breakthrough]]
id = "BT-001"
name = "Advanced fusion-target compression"
summary = "Put a much larger share of the driver pulse into compressing the D-3He fuel than any implosion has shown."
limitation = "Compressing 0.77 g of D-3He to 2,000 g/cm3 costs about 78 MJ on the ideal cold adiabat, 47 % of FDP-1's 168 MJ driver. Heavy-ion drivers couple about 10-20 % of the beam into the fuel; at that coupling the reachable density is 110-310 g/cm3 and the gain falls far below the mission's needs."
weakest_links = ["WL-001", "WL-004"]
basis = "Indirect- and direct-drive ICF (NIF ignition at target gain about 4), heavy-ion driver studies, magnetised targets (MagLIF). The compression ceiling is T04's Fermi-degenerate adiabat plus a calibrated fast-ignitor hot spot."
level = "B"
evidence = "EXTRAPOLATED"
development = "UNDER_INVESTIGATION"
canon = "NON_CANON"
assumption = "The driver-to-fuel compression coupling eta_c/alpha reaches the level chosen (0.3-0.7) at 2,000 g/cm3, by target architecture and beam coupling. Not a new physical law: the gain stays at T04's compression ceiling for that coupling."
modifies = ["vertex.compression_coupling"]
unchanged = "Fuel (D-3He), fuel density 2,000 g/cm3, burn physics and burn fraction, driver efficiency 0.30, the compression energy itself (the ceiling is recomputed, never waived), every other subsystem."
allowed = "A larger fraction of the delivered driver energy ends in the cold fuel; the gain follows the T04 ceiling for that coupling; the ship re-sizes."
forbidden = "Coupling above 1.0 (more energy in the fuel than the driver delivers); gain above the compression ceiling; energy-free compression; a Fiji effect on compression (none is declared; it would be a separate Level C record)."
energy = "Driver pulse energy, from the ship's electrical plant. Energy is conserved: compression work = coupling x driver energy, and the calculator books the driver, its losses and its waste heat on every solve."
depends_on = []
risks = "No implosion has shown more than a few per cent coupling; D-3He has never ignited; 47 % coupling at alpha 1 is already the T00 gate's minimum for the FDP-1 target. The gain cliff (about 700) sits close to every closing case."
validation = "1D radiation-hydrodynamics implosion of FDP-1's D-3He target at its scale (0.77 g, 168 MJ heavy-ion drive): reachable rhoR, density, adiabat and gain (T00 gate section 7, the next decisive experiment; needs a D-21-class authorisation)."
references = ["S-T04-STUDY", "S-T00-GATE", "S-NIF-2025", "S-HIF-REVIEWS", "S-T04-ATZENI-2004", "S-T06-NIF-DENSITY"]
atlas = ["VTX-01", "VTX-01E", "VTX-01A"]
materials = []
penalties = { power = "Recomputed: driver electrical power follows pulse energy and rate.", heat = "Recomputed: driver loss heat to the warm loop.", mass = "Recomputed: driver, radiators, propellant, tanks, structure.", maintenance = "Not modelled: target-factory and driver life.", booked = ["driver", "radiators", "propellant", "tanks", "structure", "shield"], unbooked = ["Target fabrication and fill at 196-560 Hz (WL-004)", "Ignition of D-3He itself (undemonstrated)"] }
limit = { path = "vertex.compression_coupling", max = 1.0, why = "Coupling 1.0 is the ideal bound: all driver energy in the fuel. The T00 V5 bound uses it; no implosion can exceed it." }

