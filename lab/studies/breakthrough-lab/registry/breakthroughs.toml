[[breakthrough]]
id = "BT-005"
name = "Advanced target delivery"
summary = "Launch each fusion target fast enough that only one is in the open per pulse, without destroying it."
limitation = "Only one target may be between the shield and the burn point at a time, so the launcher speed caps the pulse rate (f <= v / path). Demonstrated cryogenic target injection reaches about 400 m/s; layered D-3He targets survive about 1,000 g, and the only capsule that survives 30,000 g (gas-filled diamond) is not a defensible fusion target."
weakest_links = ["WL-004"]
basis = "GA/HAPL target injection and tracking (400 m/s), coilgun and railgun launchers, T00 Rev 4 and gate launcher studies."
level = "C"
evidence = "FICTIONAL_ASSUMPTION"
development = "PROPOSED"
canon = "NON_CANON"
assumption = "A target that is both a working fusion target (BT-001's gain) and survives a launch to the stated speed, arriving with the required precision. Survival and gain are separate requirements; this record only asserts survival and precision."
modifies = ["vertex.launcher_speed_m_s"]
unchanged = "Target gain and design (set by BT-001), the one-target-in-flight rule, driver energy, path length (recomputed from the stand-off)."
allowed = "A higher launcher speed, which lifts the pulse-rate cap."
forbidden = "Any change to target gain; target mass removed from the exhaust; a launcher without power and mass (the coupled gate books them: 336 t and 3.1 GWe at 459 Hz)."
energy = "Electrical launcher energy (small against the drive); not booked in the scenario grid, booked in the T00 coupled gate."
depends_on = ["BT-001"]
risks = "At the coupled ships' rates (320-560 Hz) the launcher needs 27.5 km/s and a 1.3 km barrel; the fill process for 3.5e10 targets at 196-560 Hz does not exist."
validation = "Survival of a layered cryogenic D-3He target at the launch acceleration; placement accuracy at the burn point; a fill process at the pulse rate."
references = ["S-GA-TARGET", "S-T00-GATE", "S-T00-REV4", "S-T04-STUDY"]
atlas = ["VTX-01H", "VTX-01C"]
materials = []
penalties = { power = "Not booked in the grid (booked in the T00 coupled gate).", heat = "Not booked in the grid.", mass = "Not booked in the grid.", maintenance = "Not modelled.", booked = ["pulse-rate cap and its re-sizing"], unbooked = ["Launcher mass and power", "Target survival", "Fill process at the pulse rate"] }

