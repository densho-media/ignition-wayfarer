[[breakthrough]]
id = "BT-003"
name = "Advanced magnetic nozzle control"
summary = "Reach the ideal-model thrust efficiency of the closure-coil nozzle, and move its unavoidable field zero off the shield."
limitation = "Published pulsed magnetic-nozzle thrust efficiencies are 0.30-0.64; at 0.64 the V4 ship grows to 1,726 kt. T03's ideal thin-shell model gives 0.791 at 15 pulse energies of field. Separately, an axisymmetric nozzle has a field zero on its axis that sends 342 J/cm2 per pulse onto the shield centre."
weakest_links = ["WL-002", "WL-009"]
basis = "Laser-fusion magnetic thrust chamber experiments (Osaka, GEKKO) and simulations (Nagamine, Matsuda, Inatomi); T03's thin-shell vacuum-field model; the T00 gate's tilted closure A1."
level = "B"
evidence = "CALCULATED"
development = "UNDER_INVESTIGATION"
canon = "NON_CANON"
assumption = "The real plasma reaches the thin-shell model's thrust efficiency (0.70 or 0.791), and the tilted closure (C1 and C2 tilted 14 deg as a pair) moves the axial leak off the shield as the vacuum-field model predicts."
modifies = ["base.overrides.pulsed.nozzle_efficiency.optimistic"]
unchanged = "Fiji lattice behaviour (its canon card VTX-02A only; no new property), stored field energy 15 E_p, coil currents and stresses, the plasma pulse energy and momentum."
allowed = "Thrust efficiency up to the ideal model's 0.791; moving the field zero (it can be moved, not removed)."
forbidden = "Thrust efficiency above 0.791 (beyond the ideal thin-shell model); removing the field zero: on any closed flux-excluding surface the tangential field has at least two zeros (it is the surface gradient of a potential), so no field shape eliminates the leak; a new Fiji property (it would be a separate Level C record)."
energy = "Plasma kinetic energy, redirected by stored field; momentum is conserved (the tilted closure turns the nozzle 2.7 deg so the thrust passes through the centre of mass, at a 1.7 % thrust cost)."
depends_on = []
risks = "Lateral plasma flow toward the moved zero (funnelling) is outside the thin-shell model; the specular-reflection ledger depends on angular resolution (gate G1); A1 fails once the shadow cone exceeds about 7.5 deg."
validation = "2D/3D MHD or hybrid PIC of the pulsed shell in the closure-coil field, plain and tilted (D-21, not authorised); T05 azimuth sweep of the A1 leak against the full ship."
references = ["S-T03-STUDY", "S-T00-GATE", "S-T05-GATE", "S-T03-NAGAMINE-1999", "S-T03-MATSUDA-2009", "S-T03-INATOMI-2023", "S-T03-MAENO-2013"]
atlas = ["VTX-03D", "VTX-03", "VTX-02A"]
materials = []
penalties = { power = "None booked beyond the nozzle field (15 E_p, recomputed).", heat = "Recomputed: plume strike share 0.065 of the nozzle loss.", mass = "Recomputed: nozzle structure follows the field energy.", maintenance = "Not modelled.", booked = ["nozzle field energy", "plume-to-hardware heat", "whole ship"], unbooked = ["A1 tilt: 1.7 % thrust (booked only in the coupled check)", "Side torque of the turned nozzle", "Re-landing loop-1 struts 4 and 5 (T05 clash)"] }
limit = { path = "base.overrides.pulsed.nozzle_efficiency.optimistic", max = 0.791, why = "0.791 is the T03 ideal thin-shell upper bound at 15 E_p; nothing in the record supports a higher value." }

