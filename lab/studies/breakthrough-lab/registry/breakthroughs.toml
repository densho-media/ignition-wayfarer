[[breakthrough]]
id = "BT-002"
name = "Advanced superconducting and structural materials"
summary = "Halve the mass of the nozzle's virial structure, radiator spars, driver galleries and the renewable loop armour."
limitation = "The magnetic nozzle stores about 15 pulse energies of field; its hoop structure, the radiator spars, the galleries and the tungsten armour are mass the drive must lift, and V4 gears about 12 t of departure per added tonne."
weakest_links = ["WL-007", "WL-003"]
basis = "CFRP hoop structures, carbon-nanotube fibres (14 GPa dynamic strength shown in 2024), tungsten-fibre-reinforced tungsten (PMDS MAT-W-ADV01, Level B), REBCO with artificial pinning (MAT-REBCO-APC01, Level B)."
level = "B"
evidence = "EXTRAPOLATED"
development = "PROPOSED"
canon = "NON_CANON"
assumption = "Structure at twice CFRP specific strength (virial nozzle structure 5.35e-7 kg/J, spars 12.5 kg/m, galleries 60 kg/m) and advanced W armour at half areal mass (100 kg/m2) holding the same fluence."
modifies = ["base.overrides.pulsed.nozzle_kg_per_J.optimistic", "structure.wing_spar_kg_per_m.value", "structure.gallery_kg_per_m.value", "base.overrides.pulsed.loop_armor_kg_m2.optimistic"]
unchanged = "Field strength, stored field energy (15 E_p), magnetic stresses (the virial theorem sets the minimum structure per joule; only the material's strength-to-density changes), X-ray and neutron fluence, conductor current density."
allowed = "Lower specific mass of structure that carries the same loads; armour that survives the same fluence with half the areal mass."
forbidden = "Less stored field energy, lower magnetic pressure, fewer neutrons or less X-ray dose; any change to conductor current density (that is the coupled solve's J_e, reported separately)."
energy = "None: a material property. The virial minimum mass per stored joule still holds; only the allowable stress per density rises."
depends_on = []
risks = "Specific strength of macroscopic CNT structures is far below single-fibre values; neutron damage of composites and REBCO is unmeasured at these fluences; armour erosion sets maintenance."
validation = "Measured strength and stiffness of large CNT or advanced composite hoops under cyclic magnetic load; irradiated W-fibre armour fluence limits; REBCO and CFC data at the coil fluence (T00 Rev 4 item)."
references = ["S-T06-CNTF-2024", "S-T06-STUDY", "S-T00-GATE", "S-T02-REBCO-N"]
atlas = ["VTX-02D", "VTX-06B", "VTX-02B", "VTX-03F"]
materials = ["MAT-W-ADV01", "MAT-REBCO-APC01", "MAT-CFRP"]
