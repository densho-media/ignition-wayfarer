# Breakthrough Lab: the Weakest Links register. Wayfarer's (Vertex) engineering bottlenecks, ranked. Research records, NOT canon.
#
# A weakest link (WL-nnn) is one place where the scientific reference model fails or depends on an unproven value. The register does
# not restate the studies: each `metrics` entry points into an imported result file (imports/<snapshot>/<file>, a JSON pointer) and
# site.py reads the number from there, so a re-import updates the register. Text fields say what the numbers mean.
#
# Ranking (transparent, reproducible; no weighted score). Four yes/no questions, answered per record with the reason in `tier_reason`:
#   blocks_engine    If this stays unsolved, would no other change make the engine work?                      -> tier 1
#   non_convergence  Does it (alone or with what it drives) make the coupled mass loop diverge or fail to close? -> tier 2
#   major_penalty    Does it cost more than about 10 % of departure mass, or a dimension far beyond the frame?   -> tier 3
#   local            Is it confined to one assembly with a known engineering fix?                              -> tier 4, else 5
# The tier is the first question answered yes (lab.py computes it). Inside a tier, records order by how far conventional engineering is
# from a fix (NO, UNLIKELY, POSSIBLY, YES), then by how many other links depend on them (depends_on, counted transitively), then by
# confidence (HIGH first), then by ID. Mass alone never ranks a problem.
#
# Vocabularies: confidence HIGH | MEDIUM | LOW (in the assessment, not in the physics); conventional (can conventional engineering solve
# it?) YES | POSSIBLY | UNLIKELY | NO; speculative (would a declared breakthrough be needed?) NOT_NEEDED | MAY_HELP | LIKELY_REQUIRED |
# REQUIRED; resolution OPEN | PARTIAL | CANDIDATE_FIX (a fix exists in a model, not demonstrated). A resolved link is deleted.
# systems are the Explore Ship subsystem ids (shots/m5_subsystems.toml) and FDP-1 problem-map ids (P01-P11) where the link touches them.

[[link]]
id = "WL-001"
name = "Fusion target compression and gain"
subsystem = "Drive: fusion target and driver"
description = "The D-3He target must be compressed to 2,000 g/cm3 and reach gain about 1,084 on a 168 MJ heavy-ion pulse. Compressing its 0.77 g of fuel on the ideal cold adiabat alone takes about 47 % of the driver energy; heavy-ion drivers couple 10-20 %."
baseline = "Indirect- and direct-drive ICF: D-T ignition at target gain about 4 (NIF 2025); D-3He has never ignited; heavy-ion coupling into fuel 10-20 %."
metrics = [
  { label = "Compression energy per gram at alpha 1", file = "t00-030fc14/studies/gate/results/target.json", pointer = "/compression/specific_MJ_g_alpha1", unit = "MJ/g", fmt = "{:,.1f}" },
  { label = "FDP-1 target fuel", file = "t00-030fc14/studies/gate/results/target.json", pointer = "/fdp1_target/fuel_g", unit = "g", fmt = "{:.2f}" },
  { label = "Driver energy per pulse", file = "t00-030fc14/studies/gate/results/target.json", pointer = "/fdp1_target/driver_MJ", unit = "MJ", fmt = "{:,.0f}" },
  { label = "Target gain the V4 ship needs", file = "t00-030fc14/studies/gate/results/target.json", pointer = "/fdp1_target/gain", unit = "", fmt = "{:,.0f}" },
  { label = "Compression energy, first principles (Gate 2)", file = "t00-030fc14/studies/gate2/results/target2.json", pointer = "/compression/ideal_E_MJ_alpha1", unit = "MJ", fmt = "{:.1f}" },
  { label = "Lowest gain at which V4 closes at all (Gate 2)", file = "t00-030fc14/studies/gate2/results/target2.json", pointer = "/gain_sensitivity_fdp1_V4/closure_threshold_gain", unit = "", fmt = "{:,.0f}" },
  { label = "Best analytical target gain (Gate 2 operating map)", file = "t00-030fc14/studies/gate2/results/target2.json", pointer = "/operating_map/best_any/gain", unit = "", fmt = "{:,.0f}" },
  { label = "Ignitor energy that best case deposits in 20 ps", file = "t00-030fc14/studies/gate2/results/target2.json", pointer = "/operating_map/best_any/ignitor_MJ_deposited", unit = "MJ", fmt = "{:.1f}" },
  { label = "Coupling needed for closure at alpha 1, free ignitor", file = "t00-030fc14/studies/gate2/results/target2.json", pointer = "/coupling_needed_for_closure/alpha 1", unit = "", fmt = "{:.2f}" },
]
current = "Coupling eta_c/alpha 0.10-0.20 reaches 110-310 g/cm3, far below 2,000. Gate 2: the best analytical operating point reaches gain 440, and only with alpha 1, 20 % coupling and a 7.8 MJ, 20 ps ignitor that does not exist."
required = "Gain at least 703 for V4 to close at all (Gate 2), i.e. coupling at least 0.30 at alpha 1 with a free ignitor, more with the coupled extras; and D-3He ignition itself (hot spot rhoR 8-10 g/cm2 at about 60 keV)."
gap = "Gain 440 at best against 703 needed; the ignitor about 10^4 beyond any built; D-3He ignition undemonstrated (gain 4 shown for D-T)."
evidence = [ { source = "S-T00-GATE2", note = "section 2: compression 77.8 MJ confirmed, gain 440 against 703, no defensible operating point" }, { source = "S-T00-GATE", note = "section 3: compression energy, gas capsule NOT DEFENSIBLE" }, { source = "S-T04-STUDY", note = "compression ceiling, D-T04-1" }, { source = "S-NIF-2025", note = "demonstrated gain" } ]
confidence = "HIGH"
uncertainty = "The 1D implosion of this target at this scale has never been computed (Gate 2 defines it as a falsification test, expected to fail); the ideal adiabat is a lower bound on the energy, so the real coupling needed is higher."
consequences = "If the gain is far below 1,084, no launcher, nozzle or spine change rescues V4: Vertex needs a different fuel or driver basis."
depends_on = []
candidates = "Higher-coupling target architectures; magnetised fuel; a D-T spark; a declared Level C compression aid (none declared)."
conventional = "UNLIKELY"
speculative = "LIKELY_REQUIRED"
resolution = "OPEN"
questions = { blocks_engine = true, non_convergence = false, major_penalty = false, local = false }
tier_reason = "Upstream of everything: without the gain the drive produces no net thrust power, whatever else is fixed."
breakthroughs = ["BT-001", "BT-006"]
systems = ["drive", "P01", "P02"]

