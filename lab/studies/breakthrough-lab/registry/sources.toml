# Breakthrough Lab: sources this study adds. The literature sources are the Technology Atlas registry (imported read-only from T00 in
# imports/t00-030fc14/registry/sources.toml) and are cited by the same IDs; this file adds the Wayfarer research results the register and
# the breakthroughs rest on. `nature`: SCIENTIFIC (published literature or data), PROJECT_MODEL (a Wayfarer calculation: a result of a model,
# not a demonstration), FICTIONAL (IGNITION canon or a declared fictional property). Imported Atlas sources of kind "canon" count as FICTIONAL,
# kind "model" as PROJECT_MODEL, every other kind as SCIENTIFIC (site.py applies this when it shows them).

