<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 520' width='900' height='520' role='img'><title>Schematic of the edge-on remote ring concept</title><rect width='900' height='520' fill='#fcfcfb'/><text x='20' y='26' font-family='Inter, Helvetica, Arial, sans-serif' font-size='16' font-weight='600' fill='#0b0b0b'>Candidate F: edge-on remote ring (schematic, not to scale)</text><text x='20' y='46' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e'>Every member is laid along the rays from its burn, so the burn sees only edges. Rays are illustrative, not computed trajectories.</text><path d='M160,290 L20,220 L20,360 Z' fill='#2a78d6' fill-opacity='0.12' stroke='none'/><text x='26' y='380' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>charged exhaust (magnetic, aft)</text><line x1='160' y1='290' x2='183' y2='420' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='207' y2='420' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='235' y2='420' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='269' y2='420' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='315' y2='420' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='385' y2='420' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='517' y2='420' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='672' y2='380' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='680' y2='290' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='672' y2='200' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='649' y2='112' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='524' y2='80' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='410' y2='80' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='336' y2='80' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='281' y2='80' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='236' y2='80' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><line x1='160' y1='290' x2='197' y2='80' stroke='#eda100' stroke-width='1' stroke-opacity='0.55'/><text x='640' y='96' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>X-rays and neutrons: released to space</text><line x1='433' y1='184' x2='498' y2='159' stroke='#eb6834' stroke-width='5' stroke-linecap='round'/><line x1='433' y1='184' x2='444' y2='180' stroke='#e34948' stroke-width='7' stroke-linecap='round'/><line x1='433' y1='184' x2='260' y2='290' stroke='#52514e' stroke-width='1.5'/><line x1='433' y1='396' x2='498' y2='421' stroke='#eb6834' stroke-width='5' stroke-linecap='round'/><line x1='433' y1='396' x2='444' y2='400' stroke='#e34948' stroke-width='7' stroke-linecap='round'/><line x1='433' y1='396' x2='260' y2='290' stroke='#52514e' stroke-width='1.5'/><text x='510' y='152' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>REBCO ribbon ring, 4.4 cm thick, edge-on</text><text x='510' y='166' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>hot nose (red) radiates its own heat, ~1700 K</text><text x='270' y='230' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>edge-on tension tapes</text><polygon points='260,290 290,281 290,299' fill='#e34948'/><text x='250' y='320' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>shadow plug (self-radiating)</text><line x1='290' y1='290' x2='840' y2='290' stroke='#52514e' stroke-width='3'/><path d='M290,281 L840,260 L840,320 L290,299 Z' fill='#52514e' fill-opacity='0.08'/><text x='420' y='338' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>spine inside the plug's shadow cone</text><rect x='840' y='260' width='40' height='60' rx='4' fill='#2a78d6'/><text x='880' y='338' text-anchor='end' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>ship, ~2 km forward</text><circle cx='160' cy='290' r='7' fill='#eb6834' stroke='#fcfcfb' stroke-width='2'/><text x='150' y='274' text-anchor='end' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>burn</text><text x='20' y='480' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>Recommended point (V2 source): ring R 90 m, burn 180 m aft of it, 21 MA, ribbon 4.4 cm, nose 0.46 m; ship 2 km, engines 2 km apart.</text><text x='20' y='498' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>Heat, four engines: 9.3 GW of the 10.8 GW drive share; mass about 779 t per engine (magnet-driven, does not close).</text></svg>