<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 230' width='760' height='230' role='img'><title>Incidence angles on the drawn engine versus the total-reflection band</title><rect width='760' height='230' fill='#fcfcfb'/><text x='20' y='26' font-family='Inter, Helvetica, Arial, sans-serif' font-size='16' font-weight='600' fill='#0b0b0b'>The drawn engine is hit head-on, not at grazing angles</text><text x='20' y='46' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e'>Grazing angle of the first hit of 16,384 rays through the 263 real part meshes (Vertex 1.5 trace).</text><rect x='80.0' y='80' width='271.2' height='60' rx='4' fill='#1baf7a' fill-opacity='0.25'/><text x='86.0' y='98' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>total reflection possible</text><text x='86.0' y='114' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>(below θc, 10-100 keV)</text><rect x='589.6' y='88' width='92.9' height='44' rx='4' fill='#eb6834'/><line x1='358.7' x2='589.6' y1='110' y2='110' stroke='#eb6834' stroke-width='2'/><text x='720' y='160' text-anchor='end' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#0b0b0b'>5 % of hits: 14°   median: 53°   lowest: 0.53°</text><text x='80.0' y='200' text-anchor='middle' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>0.01°</text><text x='241.9' y='200' text-anchor='middle' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>0.1°</text><text x='403.7' y='200' text-anchor='middle' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>1°</text><text x='565.6' y='200' text-anchor='middle' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>10°</text><text x='720.0' y='200' text-anchor='middle' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>90°</text><text x='380.0' y='220' text-