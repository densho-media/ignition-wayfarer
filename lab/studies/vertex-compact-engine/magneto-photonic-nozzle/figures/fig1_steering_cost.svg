<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 470' width='760' height='470' role='img'><title>Steering cost of grazing reflection versus photon energy for five materials and the Compton floors</title><rect width='760' height='470' fill='#fcfcfb'/><text x='20' y='26' font-family='Inter, Helvetica, Arial, sans-serif' font-size='16' font-weight='600' fill='#0b0b0b'>Steering cost: what it costs to turn a photon</text><text x='20' y='46' font-family='Inter, Helvetica, Arial, sans-serif' font-size='12' fill='#52514e'>Loss per radian of deflection by grazing reflection, 2β/θc³ (xraylib data). A 10 mrad turn loses ≈ g × 0.01.</text><line x1='78' x2='570' y1='390.1' y2='390.1' stroke='#e4e3df'/><text x='70' y='394.1' text-anchor='end' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>0.01</text><line x1='78' x2='570' y1='317.2' y2='317.2' stroke='#e4e3df'/><text x='70' y='321.2' text-anchor='end' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>0.1</text><line x1='78' x2='570' y1='244.4' y2='244.4' stroke='#e4e3df'/><text x='70' y='248.4' text-anchor='end' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>1</text><line x1='78' x2='570' y1='171.6' y2='171.6' stroke='#e4e3df'/><text x='70' y='175.6' text-anchor='end' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>10</text><line x1='78' x2='570' y1='98.7' y2='98.7' stroke='#e4e3df'/><text x='70' y='102.7' text-anchor='end' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>100</text><text x='78.0' y='430' text-anchor='middle' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>3</text><text x='180.0' y='430' text-anchor='middle' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>10</text><text x='273.0' y='430' text-anchor='middle' font-family='Inter, Helvetica, Arial, sans-serif' font-size='11' fill='#52514e'>