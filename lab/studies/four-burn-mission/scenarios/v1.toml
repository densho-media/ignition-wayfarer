# Wayfarer four-burn 0.016 c round trip: scenario v1 (2026-11-03). Research study, PROTOTYPE.
#
# Every input carries a status:
#   CANON      read from data/wayfarer_3d.toml (its own workbook status is quoted in `canon`)
#   RESEARCH   a published measurement or a standard physics value (source given)
#   ASSUMPTION an engineering judgement inside a researched range (range given)
#   PROTOTYPE  a free design choice of this study
#   FICTION    an IGNITION capability (Fiji lattice) used only within its stated canon
# Architecture tiers: `optimistic` = speculative engineering, `central` = credible extrapolation, `pessimistic` = near today's practice.
# Values that are canon are not repeated here; `fourburn.canon` reads them from data/wayfarer_3d.toml.

version = "v1"
date = "2026-11-03"

[mission]
burns = 4
target_speed_c = { value = 0.016, status = "CANON", canon = "mission.target_speed LOCKED" }
max_accel_g = { value = 1.5, status = "CANON", canon = "owner brief 2026-11-03: absolute ceiling" }
preferred_accel_g = { value = 1.0, status = "CANON", canon = "owner brief 2026-11-03: preferred" }
accel_cases_g = [0.001, 0.003, 0.01, 0.05, 0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]
ve_cases_km_s = [3000, 5000, 8000, 10000, 12000, 13000, 15000, 19201.17208, 20000, 23000]
propellant_reserve = { value = 0.02, status = "PROTOTYPE", note = "unused reserve carried to the end, fraction of mission propellant (trajectory corrections, capture, off-nominal burns)" }

[payload]
# Ship mass that is not drive, radiators, propellant tanks or propellant. Derived from canon physics.mass_budget (1,100 t) and
# physics.operating_point (1,300 t incl. the 200 t operational inventory and the tanks of the legacy 600 t inventory, 0.15 x 600 = 90 t).
existing_kg = { value = 860000.0, status = "CANON", canon = "1,300 t - drive 250 t - radiators 100 t - legacy tanks 90 t" }
reduced_kg = { value = 560000.0, status = "PROTOTYPE", note = "minimum crew-survival ship: habitat, life support, water shielding and forward impact shield kept; workshop/cargo halved, operational inventory 200 -> 50 t, main structure scaled -25 %" }
illustrative_dry_kg = { value = 1000000.0, status = "PROTOTYPE", note = "owner brief case 2: a 1,000 t dry spacecraft (everything but propellant)" }

[tanks]
# Tank dry mass per m3 of capacity, calibrated on the as-built TANK-AXIAL farm: 457.9 t for 40,179 m3 (references/evidence/longitudinal_tanks.json).
mass_per_m3 = { optimistic = 7.0, central = 11.397, pessimistic = 15.0, unit = "kg/m3", status = "CANON (central)", canon = "central = longitudinal_tanks.json dry_mass.total_kg / capacity (first order, WORKING); optimistic = larger vessels (MLI and supports scale with area), pessimistic = +30 % for PMDs, zero-boil-off shields and 1.5 g re-rating" }
ullage = { value = 0.03, status = "CANON", canon = "fuel_storage.ullage" }
residual = { value = 0.015, status = "CANON", canon = "fuel_storage.allowance.residual" }
boiloff_reserve = { value = 0.005, status = "CANON", canon = "fuel_storage.allowance.boiloff_reserve" }
# existing farm (fuel_storage.farm, longitudinal_tanks.json): liquid capacity per species and per vessel class
capacity_m3 = { helium_3 = 20271.0, deuterium = 4886.0, hydrogen = 15022.0, status = "CANON" }
vessel_m3 = { L = 3378.5, M = 2443.0, status = "CANON", note = "6 He-3 L vessels = 20,271 m3; 2 D2 M vessels = 4,886 m3" }
bay_length_m = { value = 28.6, status = "CANON", note = "occupied farm length for 13 vessels (9 L + 4 M)" }
cooling_W_per_m3 = { value = 9.84, status = "CANON", canon = "longitudinal_tanks.json cooling.rejected_W / capacity" }
existing_axial_limit_N = { value = 23.5e6, status = "CANON", canon = "Q45 bypass-collar axial load at 1.5 g full" }

[radiators]
# Two-sided planform radiators; q = 2 eps sigma T^4 per m2 of planform.
hot = { T_K = 1800.0, emissivity = 0.9, areal_kg_m2 = { optimistic = 3.0, central = 6.0, pessimistic = 12.0 }, transport_kg_per_W = { optimistic = 0.5e-6, central = 1.5e-6, pessimistic = 4.0e-6 }, status = "ASSUMPTION", note = "Refractory (Mo/W-Li) heat-pipe radiators; canon temperature and emissivity (radiators.temperature WORKING); SP-100/HPS studies 5-10 kg/m2 at 800-1,400 K" }
droplet = { T_K = 1100.0, emissivity = 0.8, areal_kg_m2 = { optimistic = 0.5, central = 1.2, pessimistic = 3.0 }, transport_kg_per_W = { optimistic = 0.5e-6, central = 1.5e-6, pessimistic = 4.0e-6 }, status = "ASSUMPTION", note = "Liquid-droplet (tin) radiator sheet, NASA/Mattick-Hertzberg concept studies; never flown" }
warm = { T_K = { optimistic = 600.0, central = 500.0, pessimistic = 400.0 }, emissivity = 0.9, areal_kg_m2 = { optimistic = 1.0, central = 2.5, pessimistic = 5.0 }, transport_kg_per_W = { optimistic = 2.0e-6, central = 5.0e-6, pessimistic = 10.0e-6 }, status = "ASSUMPTION", note = "Driver and power-electronics loss heat: SiC/GaN junctions and induction cores limit the coolant to 400-600 K; pumped loop + droplet or fin radiator" }
cryo = { W_per_W = { optimistic = 15.0, central = 30.0, pessimistic = 60.0 }, status = "RESEARCH", note = "Input power per watt lifted at 20-40 K (REBCO coils), 15-30 % of Carnot; the input and the lifted heat leave through the warm radiators" }

[plasma]
# Continuous (open-cage linear core) plasma point. The energy partition is computed by fourburn.plasma (Bosch-Hale, Rider bremsstrahlung).
Ti_keV = { optimistic = 120.0, central = 100.0, pessimistic = 80.0, status = "ASSUMPTION" }
Te_over_Ti = { optimistic = 0.6, central = 0.85, pessimistic = 1.0, status = "ASSUMPTION", note = "hot-ion mode lowers Te and bremsstrahlung; Te/Ti ~ 0.5-1 in D-3He reactor studies" }
he3_to_d = { value = 1.0, status = "CANON", canon = "physics.operating_point.he3_mass_share 0.5996 = 1:1 molar" }
sync_fraction = { optimistic = 0.02, central = 0.05, pessimistic = 0.10, status = "ASSUMPTION", note = "net synchrotron loss after wall reflection (reflectivity 0.9-0.99)" }
tritium_burn = { value = 0.5, status = "ASSUMPTION", note = "share of D-D tritium that burns in place (14.1 MeV neutrons)" }

[continuous]
# Open-cage linear core (IFD-C): sparse Fiji-amplified coils, radiation passes between them to space (owner-accepted aft escape geometry).
wall_flux_MW_m2 = { optimistic = 20.0, central = 10.0, pessimistic = 5.0, status = "ASSUMPTION", note = "steady flux on W armour over Li heat pipes into the 1800 K loop; 10 MW/m2 is the ITER divertor engineering class (water-cooled); Maingi 2020 models 10 MW/m2 for liquid Li" }
coil_coverage = { optimistic = 0.30, central = 0.50, pessimistic = 0.53, status = "RESEARCH", note = "share of the plasma's radiation caught by coil faces and sides; v4 Monte Carlo 0.50 (face 0.22 + sides 0.28); 0.30 assumes thinner Fiji-amplified coils" }
armour_shield_kg_m2 = { optimistic = 1500.0, central = 3000.0, pessimistic = 5000.0, status = "ASSUMPTION", note = "W armour + Li heat pipes + B4C/LiH coil shield per m2 of covered face (5-30 cm W, 0.3-0.6 m LiH)" }
beta = { value = 0.85, status = "RESEARCH", note = "FRC/high-beta open systems 0.7-0.9" }
field_T = { optimistic = 20.0, central = 12.0, pessimistic = 6.3, status = "FICTION", note = "highest field at the plasma (the model picks the best field up to it); Fiji amplification lets REBCO-class conductor reach the field; the stored energy and its structure are not reduced (canon)" }
wall_to_plasma_radius = { value = 1.4, status = "PROTOTYPE" }
coil_structure_kg_per_J = { optimistic = 1.07e-6, central = 2.67e-6, pessimistic = 6.0e-6, status = "RESEARCH", note = "virial theorem M >= rho W / sigma: CFRP 1.6 t/m3 at 1.5 GPa; x1 / x2.5 safety factor; steel-class pessimistic" }
nozzle_efficiency = { optimistic = 0.90, central = 0.80, pessimistic = 0.65, status = "RESEARCH", note = "steady magnetic nozzle thrust efficiency incl. detachment and divergence (VASIMR/DFD studies 0.6-0.9)" }
tau_p_s = { optimistic = 30.0, central = 3.0, pessimistic = 0.3, status = "FICTION", note = "particle confinement; open systems today ms-s; above ~1 s depends on Fiji stabilisation (canon: field amplification and stabilisation)" }
other_kg_per_W = { optimistic = 0.3e-6, central = 1.0e-6, pessimistic = 3.0e-6, status = "ASSUMPTION", note = "fuel injection, heating/current drive, cryoplant, power conversion, structure (per W fusion)" }
neutron_leak_to_cryo = { value = 1.0e-4, status = "ASSUMPTION", note = "share of the heat caught by coil armour that reaches the 20-40 K conductor" }
house_fraction = { value = 5.0e-3, status = "ASSUMPTION", note = "fuelling, heating and current drive, controls: electric power per W fusion" }
direct_conversion_efficiency = { optimistic = 0.9, central = 0.8, pessimistic = 0.6, status = "ASSUMPTION", note = "electric power drawn from the exhaust stream by direct conversion; loss heat into the hot loop" }
plume_to_hardware = { value = 0.02, status = "ASSUMPTION", note = "share of the nozzle loss (divergent plasma) that strikes hardware" }
shadow_shield_kg_m2 = { optimistic = 1500.0, central = 3000.0, pessimistic = 5000.0, status = "ASSUMPTION", note = "LiH/W shadow shield per m2 of a disc 1 m wider than each core's wall radius" }
core_length_max_m = { optimistic = 400.0, central = 200.0, pessimistic = 100.0, status = "PROTOTYPE", note = "longest core the ship carries; more power means more parallel cores" }

[pulsed]
# Point-burn pulsed drive (IFD-P / IFD-PH): magnetised fuel-only targets, stand-off driver, Fiji-amplified nozzle loops.
rho_g_cc = { optimistic = 3000.0, central = 1000.0, pessimistic = 300.0, status = "ASSUMPTION", note = "compressed fuel density; NIF ~100-1000 g/cm3" }
burn_T_keV = { value = 100.0, status = "ASSUMPTION" }
gain = { optimistic = 3000.0, central = 300.0, pessimistic = 50.0, status = "ASSUMPTION", note = "target gain (yield/driver energy); demonstrated 4.1 (NIF 2025, D-T); MIF magnetisation (Fiji seed field) raises it" }
driver_efficiency = { optimistic = 0.45, central = 0.30, pessimistic = 0.15, status = "ASSUMPTION", note = "wall-plug: heavy-ion induction linac 0.25-0.35 (HIF studies), diode lasers 0.15-0.2" }
driver_kg_per_W = { optimistic = 0.05e-3, central = 0.2e-3, pessimistic = 1.0e-3, status = "ASSUMPTION", note = "driver hardware per W electrical (v4: 0.2 kg/kW)" }
recovery_efficiency = { optimistic = 0.95, central = 0.90, pessimistic = 0.80, status = "ASSUMPTION", note = "inductive pick-up of the expanding plasma's flux compression (FDR, Daedalus); loss heat into the hot loop" }
nozzle_efficiency = { optimistic = 0.79, central = 0.65, pessimistic = 0.50, status = "RESEARCH", note = "pulsed magnetic nozzle: theoretical 0.79-0.86 (MSFC), simulated 0.34-0.55 (UAH)" }
fluence_J_m2 = { optimistic = 4.0e4, central = 1.0e4, pessimistic = 0.5e4, status = "RESEARCH", note = "per-pulse X-ray fluence on W hardware (~1 J/cm2 roughening/melt onset, Sandia/LLNL)" }
max_rep_Hz = { optimistic = 1000.0, central = 250.0, pessimistic = 30.0, status = "ASSUMPTION", note = "target injection and field recovery; Daedalus 250 Hz" }
nozzle_field_energy_ratio = { value = 1.0, status = "ASSUMPTION", note = "stored nozzle field energy per J of pulse energy it turns" }
nozzle_kg_per_J = { optimistic = 1.07e-6, central = 2.67e-6, pessimistic = 6.0e-6, status = "RESEARCH", note = "virial structure per J stored (as continuous coils)" }
hardware_solid_angle = { optimistic = 0.002, central = 0.003, pessimistic = 0.006, status = "RESEARCH", note = "share of the burn's sky covered by nozzle loops and shadow shield (v4 0.003)" }
brems_dense = { optimistic = 0.25, central = 0.35, pessimistic = 0.45, status = "ASSUMPTION", note = "bremsstrahlung produced inside the dense burning fuel (Te ~ Ti), before self-absorption" }
xray_kappa_cm2_g = { fuel = 0.24, hydrogen = 0.40, status = "RESEARCH", note = "~100 keV Compton opacity per gram (electrons per nucleon 0.6 for D-3He, 1.0 for H)" }
neutron_kappa_cm2_g = { fuel = 0.10, hydrogen = 1.5, status = "RESEARCH", note = "2.45 MeV removal opacity; hydrogen elastic ~2.5 b" }
HB_calibration = { DT_20keV_g_cm2 = 7.0, status = "RESEARCH", note = "burn parameter of D-T at 20 keV (textbook 6-7 g/cm2) calibrates H_B = K m c_s / <sv>" }
loop_armor_kg_m2 = { optimistic = 200.0, central = 500.0, pessimistic = 1000.0, status = "ASSUMPTION", note = "renewable W armour and coil shield per m2 of loop face seen by the burn" }
neutron_leak_to_cryo = { value = 1.0e-3, status = "ASSUMPTION", note = "share of the heat caught on loop faces that reaches the 20-40 K conductor" }
dense_tritium_burn = { value = 0.8, status = "ASSUMPTION", note = "D-D tritium burns in the dense fuel (14.1 MeV neutrons)" }
house_fraction = { value = 1.0e-3, status = "ASSUMPTION", note = "target factory, injectors, controls: electric power per W fusion" }
other_kg_per_W = { optimistic = 0.05e-6, central = 0.2e-6, pessimistic = 1.0e-6, status = "ASSUMPTION", note = "target factory, injectors, cryo-target handling, structure (per W fusion)" }
shadow_shield_kg = { value = 100000.0, status = "ASSUMPTION", note = "small shadow shield: point burn hundreds of m aft" }

[liquid_wall]
# IFD-CH hybrid: the open-cage core with flowing liquid-lithium films on the coil armour (protective flowing material).
wall_flux_MW_m2 = { optimistic = 50.0, central = 30.0, pessimistic = 15.0, status = "ASSUMPTION", note = "flowing Li films: projected 20-60 MW/m2, none demonstrated (Maingi 2020 models 10)" }
armour_shield_kg_m2 = { optimistic = 1200.0, central = 2000.0, pessimistic = 3000.0, status = "ASSUMPTION", note = "thin W backing + Li film + coil shield" }

[canon_reference]
# The current working propulsion assumptions (physics.operating_point), audited, not adopted.
directed_efficiency = { value = 0.8, status = "CANON", canon = "05!B9 / 64!B10 (exceeds the computed charged share)" }
burnup = { value = 0.8, status = "CANON", canon = "64!B25 hypothetical" }
recovery = { value = 0.95, status = "CANON", canon = "64!B26 hypothetical" }
absorbed_fraction = { value = 4.0e-5, status = "CANON", canon = "B01 requirement, no mechanism" }
