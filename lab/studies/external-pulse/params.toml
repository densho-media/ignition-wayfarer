name = "Mini-Mag Orion (Andrews Space; Lenard and Andrews, Acta Astronautica)"
claim = "Isp 10,000 to 30,000 s, thrust 1 to 2 MN, magnetic nozzle catches the pulse plasma"
isp_s = [10000.0, 30000.0]
evidence = "PROPONENT_CLAIM"
source = "https://en.wikipedia.org/wiki/Mini-Mag_Orion (secondary); https://www.flightglobal.com/nuclear-power-concept-revisited/47904.article"

[[precedent]]
id = "MAGORION"
concept = "B"
name = "MagOrion: superconducting loop as the pusher"
claim = "Isp above 10,000 s"
isp_s = [10000.0, 10000.0]
evidence = "PROPONENT_CLAIM"
source = "https://en.wikipedia.org/wiki/Nuclear_pulse_propulsion (secondary)"

[[precedent]]
id = "M2P2"
concept = "C"
name = "Mini-Magnetospheric Plasma Propulsion (Winglee et al.): plasma-inflated magnetic field"
claim = "Field inflated far beyond the coil by injected plasma (for solar-wind sailing, not pulse capture)"
isp_s = []
evidence = "PROPONENT_CLAIM"
source = "Winglee et al., J. Geophys. Res. 105 (2000); contested in later analyses; reach used here is UNVERIFIED"
