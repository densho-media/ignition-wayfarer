" y="163" fill="#1f2328">B: all brackets (incl. UNVERIFIED)</text><rect x="250" y="152" width="59.0" height="14" fill="#1f6feb" rx="2"/><text x="315.0" y="163" fill="#1f2328">1</text><text x="16" y="185" fill="#1f2328">B: no photon conversion</text><rect x="250" y="174" width="59.9" height="14" fill="#1f6feb" rx="2"/><text x="315.9" y="185" fill="#1f2328">1.02</text><text x="16" y="207" fill="#1f2328">B: isotropic pulse</text><rect x="250" y="196" width="148.6" height="14" fill="#1f6feb" rx="2"/><text x="404.6" y="207" fill="#1f2328">6.23</text><text x="16" y="229" fill="#1f2328">B: leak >= 1 % (Vertex 1.4)</text><rect x="250" y="218" width="323.5" height="14" fill="#1f6feb" rx="2"/><text x="579.5" y="229" fill="#1f2328">222</text><text x="16" y="251" fill="#1f2328">C: all brackets (incl. UNVERIFIED)</text><rect x="250" y="240" width="62.2" height="14" fill="#8250df" rx="2"/><text x="318.2" y="251" fill="#1f2328">1.07</text><text x="16" y="273" fill="#1f2328">C: no photon conversion</text><rect x="250" y="262" width="66.4" height="14" fill="#8250df" rx="2"/><text x="322.4" y="273" fill="#1f2328">1.16</text><text x="16" y="295" fill="#1f2328">C: isotropic pulse</text><rect x="250" y="284" width="190.6" height="14" fill="#8250df" rx="2"/><text x="446.6" y="295" fill="#1f2328">14.7</text><text x="16" y="317" fill="#1f2328">C: leak >= 1 % (Vertex 1.4)</text><rect x="250" y="306" width="370.0" height="14" fill="#8250df" rx="2"/><text x="626.0" y="317" fill="#1f2328">573</text></svg>
