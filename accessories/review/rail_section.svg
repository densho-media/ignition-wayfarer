<polygon points="399.6,476.8 375.6,435.2 275.9,492.8 299.9,534.4" fill="#90a4ae" stroke="#263238" stroke-width="2"/>
<line x1="354.6" y1="513.9" x2="321.0" y2="455.7" stroke="#111" stroke-width="2"/>
<polygon points="617.0,485.9 590.6,531.7 630.1,554.5 656.5,508.7" fill="#455a64"/>
<polygon points="524.4,435.2 500.4,476.8 600.1,534.4 624.1,492.8" fill="#90a4ae" stroke="#263238" stroke-width="2"/>
<line x1="579.0" y1="455.7" x2="545.4" y2="513.9" stroke="#111" stroke-width="2"/>
<line x1="378.0" y1="420.0" x2="522.0" y2="420.0" stroke="#111" stroke-width="1.5" marker-start="url(#m)" marker-end="url(#m)"/>
<text x="450.0" y="412.0" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">rail Ø60</text>
<line x1="293.4" y1="577.2" x2="606.6" y2="577.2" stroke="#111" stroke-width="1.5" marker-start="url(#m)" marker-end="url(#m)"/>
<text x="450.0" y="569.2" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">clamp opening 130</text>
<line x1="411.6" y1="621.2" x2="488.4" y2="621.2" stroke="#111" stroke-width="1.5" marker-start="url(#m)" marker-end="url(#m)"/>
<text x="450.0" y="613.2" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">web corridor ≤ 32</text>
<text x="900.0" y="140.0" font-size="17" font-weight="bold" fill="#111" text-anchor="start">What the section shows</text>
<text x="900.0" y="167.0" font-size="17" font-weight="normal" fill="#222" text-anchor="start">• Rail Ø60 mm, gauge 300 mm between the two rails (PROTOTYPE).</text>
<text x="900.0" y="194.0" font-size="17" font-weight="normal" fill="#222" text-anchor="start">• Three wheels Ø48 × 20 mm at 0° and ±120°: a load wheel on top,</text>
<text x="900.0" y="221.0" font-size="17" font-weight="normal" fill="#222" text-anchor="start">  two up-stop wheels under the rail on either side of the web:</text>
<text x="900.0" y="248.0" font-size="17" font-weight="normal" fill="#222" text-anchor="start">  captive in every direction (no reliance on gravity or magnets).</text>
<text x="900.0" y="275.0" font-size="17" font-weight="normal" fill="#555" text-anchor="start">  (wheels cut through their axles: seen edge-on as rectangles)</text>
<text x="900.0" y="302.0" font-size="17" font-weight="normal" fill="#222" text-anchor="start">• C-clamp frame R93 mm, open 108° at the bottom (130 mm gap)</text>
<text x="900.0" y="329.0" font-size="17" font-weight="normal" fill="#222" text-anchor="start">  so the truck passes every support web without opening.</text>
<text x="900.0" y="356.0" font-size="17" font-weight="normal" fill="#222" text-anchor="start"></text>
<text x="900.0" y="383.0" font-size="17" font-weight="bold" fill="#111" text-anchor="start">What the ship session is asked to keep</text>
<text x="900.0" y="410.0" font-size="17" font-weight="normal" fill="#1565c0" text-anchor="start">• Blue: support web corridor ≤ 32 mm wide from the rail down to</text>
<text x="900.0" y="437.0" font-size="17" font-weight="normal" fill="#1565c0" text-anchor="start">  75 mm below the rail centre (5 mm running clearance</text>
<text x="900.0" y="464.0" font-size="17" font-weight="normal" fill="#1565c0" text-anchor="start">  to each under-wheel, inner edge at ±21 mm).</text>
<text x="900.0" y="491.0" font-size="17" font-weight="normal" fill="#1565c0" text-anchor="start">• Wider brackets, feet and fasteners only below that depth.</text>
<text x="900.0" y="518.0" font-size="17" font-weight="normal" fill="#c62828" text-anchor="start">• Red dashed: swept truck envelope Ø206 mm around the rail axis,</text>
<text x="900.0" y="545.0" font-size="17" font-weight="normal" fill="#c62828" text-anchor="start">  free of structure, harness and markings along the whole track.</text>
<text x="900.0" y="572.0" font-size="17" font-weight="normal" fill="#222" text-anchor="start"></text>
<text x="900.0" y="599.0" font-size="17" font-weight="bold" fill="#111" text-anchor="start">Open before approval</text>
<text x="900.0" y="626.0" font-size="17" font-weight="normal" fill="#555" text-anchor="start">• rail section and material, web spacing, rail and wheel loads,</text>
<text x="900.0" y="653.0" font-size="17" font-weight="normal" fill="#555" text-anchor="start">  thermal expansion of rail vs. casing, joint and switch details,</text>
<text x="900.0" y="680.0" font-size="17" font-weight="normal" fill="#555" text-anchor="start">  truck preload, bearing rating in vacuum, dust/debris tolerance.</text>
<text x="900.0" y="707.0" font-size="17" font-weight="normal" fill="#555" text-anchor="start">• A request for a placement and section study, not an edit</text>
<text x="900.0" y="734.0" font-size="17" font-weight="normal" fill="#555" text-anchor="start">  of ship geometry: the ship session owns rails and anchors.</text>
<text x="40.0" y="950.0" font-size="14" font-weight="normal" fill="#666" text-anchor="start">Section across the rail (y across, z up), 2.4 px per mm. Grey web and foot: the review fixture's support, shown as the proposed pattern. Generated by src/wayfarer/presentation/rail_section.py.</text>
</svg>
