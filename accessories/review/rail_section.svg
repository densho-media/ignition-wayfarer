<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 980" width="1500" height="980" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d9534f" stroke-width="2"/></pattern></defs>
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><circle cx="4" cy="4" r="2.2" fill="#111"/></marker></defs>
<text x="40.0" y="48.0" font-size="24" font-weight="bold" fill="#222" text-anchor="start">CRAWLER RAIL CROSS-SECTION — interface request to the ship session (PROTOTYPE, not a rated section)</text>
<text x="40.0" y="78.0" font-size="16" font-weight="normal" fill="#555" text-anchor="start">One rail of a GU twin-rail track and the captive three-wheel truck of DR-EVA-01/02/03 (data/drone_bodies.toml). Rail loads, wheel and latch ratings: OPEN (DGT-004).</text>
<circle cx="450" cy="420" r="247.2" fill="#fbe9e7" stroke="#d9534f" stroke-dasharray="6 5"/>
<rect x="411.6" y="492.0" width="76.7" height="107.2" fill="#e3f2fd" stroke="#1e88e5" stroke-dasharray="4 4"/>
