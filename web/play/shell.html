<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>Enter Wayfarer · G.U. WAYFARER 001</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307090c'/%3E%3Cpath d='M2 8h12M8 3v10' stroke='%23e0a040' stroke-width='2'/%3E%3C/svg%3E">
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #d9e0e6; background: #07090c; overflow: hidden; touch-action: none; overscroll-behavior: none; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
/* The game surface only: no text selection, callout or double-tap zoom on the canvas (the launcher and the site keep normal zoom). */
#canvas { display: block; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#canvas:focus { outline: none; }
#status[hidden] { display: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; background: #07090c; padding: 16px; text-align: center; }
#status h1 { margin: 0; font-size: 18px; letter-spacing: 0.12em; font-weight: 600; }
#status p { margin: 0; color: #7d8a96; max-width: 520px; }
#bar { width: min(420px, 100%); height: 6px; background: #26303a; border-radius: 3px; overflow: hidden; }
#bar span { display: block; height: 100%; width: 0; background: #e0a040; transition: width 0.2s; }
#status.error #bar { display: none; }
#status.error #detail { color: #ff8070; white-space: pre-line; }
#exit { position: fixed; bottom: 8px; left: 8px; z-index: 2; color: #d9e0e6; background: rgba(12, 16, 21, 0.86); border: 1px solid #26303a;
  border-radius: 4px; padding: 4px 10px; text-decoration: none; font-size: 12px; }
#exit:hover, #exit:focus-visible, #full:hover, #full:focus-visible { border-color: #e0a040; outline: none; }
#full { display: none; }
/* MOB-001 touch-first devices: Exit and full screen at the top left inside the safe area, 44 px targets (the lower corners are the thumbs'). */
@media (pointer: coarse) and (not (any-pointer: fine)) {
  #exit, #full { top: calc(env(safe-area-inset-top) + 8px); bottom: auto; min-width: 44px; min-height: 44px; box-sizing: border-box;
    align-items: center; justify-content: center; font-size: 14px; padding: 0 12px; }
  #exit { display: inline-flex; }
  #exit { left: calc(env(safe-area-inset-left) + 8px); }
  #full { left: calc(env(safe-area-inset-left) + 100px); }
}
#full { position: fixed; z-index: 2; color: #d9e0e6; background: rgba(12, 16, 21, 0.86); border: 1px solid #26303a; border-radius: 4px; font: inherit; }
#turn[hidden] { display: none; }
#turn { position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px;
  padding: 24px; text-align: center; background: rgba(7, 9, 12, 0.92); }
#turn p { margin: 0; max-width: 320px; color: #b7c2cc; }
#turn button { min-height: 48px; padding: 0 18px; font: inherit; font-size: 16px; color: #07090c; background: #e0a040; border: 0; border-radius: 6px; }
#turn button.quiet { color: #d9e0e6; background: transparent; border: 1px solid #3a4652; }
a { color: #e0a040; }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas element.</canvas>
<noscript>Enter Wayfarer needs JavaScript and WebGL 2.</noscript>
<a id="exit" href="./" title="Leave the experience (unloads the engine)">← Exit</a>
<button id="full" type="button" title="Full screen">⛶ Full screen</button>
<div id="safe"></div>
<div id="turn" hidden role="dialog" aria-label="Turn your phone">
  <p><strong>Turn your phone sideways</strong></p>
  <p>Enter Wayfarer is laid out for landscape: one thumb moves, the other looks. It keeps running if you stay upright.</p>
  <button id="turn-full" type="button">Full screen, landscape</button>
  <button id="turn-stay" type="button" class="quiet">Continue upright</button>
</div>
<div id="status" role="status">
  <h1>ENTER WAYFARER</h1>
  <p id="detail">Loading the engine and the Wayfarer package…</p>
  <div id="bar"><span></span></div>
</div>
<script src="$GODOT_URL"></script>
<script>
// WEB-002 Godot shell: starts the walk (EXC-001) at once (the launcher page play/index.html is the click-to-load step).
// Checks may pass Godot arguments through ?arg= only from the allowed list below; ordinary visitors pass none. Leaving releases the
// WebGL context at once (the back-forward cache may still keep the page until the browser evicts it).
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
(function () {
  const status = document.getElementById('status');
  const detail = document.getElementById('detail');
  const bar = document.querySelector('#bar span');
  const ALLOWED = ['--disable-render-loop', '--fixed-fps', '30', '60', '--', '--touch', '--no-touch', '--touch-probe', '--check-excursion'];
  const asked = new URLSearchParams(location.search).getAll('arg');
  const args = asked.filter(a => ALLOWED.includes(a));
  function fail(err) {
    console.error(err);
    status.classList.add('error');
    status.hidden = false;
    detail.textContent = (err && err.message ? err.message : String(err)) +
      '\n\nReload to try again, or go back and open Explore Ship, which needs only WebGL.';
    window.wayfarerPlay = { state: 'failed', error: String(err && err.message || err) };
  }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length) {
    fail(new Error('This browser lacks features the Godot engine needs:\n' + missing.join('\n')));
    return;
  }
  // MOB-001 browser concerns stay in the page (Godot owns the game input): the safe-area insets for the touch layer
  // (window.wayfarerSafe, CSS px), a user-started full screen with an optional landscape lock that may be refused, the portrait
  // suggestion, and a blur of the canvas when the page is hidden, so Godot releases every held input (Web sends it no other signal).
  const canvas = document.getElementById('canvas');
  const touchFirst = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;
  const safeBox = document.getElementById('safe');
  function readSafe() {
    const cs = getComputedStyle(safeBox);
    window.wayfarerSafe = ['paddingLeft', 'paddingTop', 'paddingRight', 'paddingBottom'].map(k => parseFloat(cs[k]) || 0);
  }
  readSafe();
  const full = document.getElementById('full'), turn = document.getElementById('turn');
  const canFull = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  async function goFull() {
    try {
      const el = document.documentElement;
      await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen());
      await screen.orientation?.lock?.('landscape');
    } catch (e) { /* refused or unsupported (iPhone Safari): the game keeps running as it is */ }
    canvas.focus();
  }
  const showFull = () => { full.style.display = touchFirst && canFull && !document.fullscreenElement ? 'inline-flex' : 'none'; };
  showFull();
  full.addEventListener('click', goFull);
  document.addEventListener('fullscreenchange', showFull);
  let stayUpright = false;
  function orient() {
    readSafe();
    const portrait = innerHeight > innerWidth;
    turn.hidden = !(touchFirst && portrait && !stayUpright && window.wayfarerPlay?.state === 'running');
    document.getElementById('turn-full').hidden = !canFull;
  }
  addEventListener('resize', orient);
  screen.orientation?.addEventListener?.('change', orient);
  document.getElementById('turn-full').addEventListener('click', () => { stayUpright = true; orient(); goFull(); });
  document.getElementById('turn-stay').addEventListener('click', () => { stayUpright = true; orient(); canvas.focus(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) canvas.blur(); else canvas.focus(); });
  const engine = new Engine(GODOT_CONFIG);
  window.addEventListener('pagehide', () => {
    const gl = document.getElementById('canvas').getContext('webgl2');
    if (gl) gl.getExtension('WEBGL_lose_context')?.loseContext();
  });
  window.addEventListener('pageshow', e => { if (e.persisted && window.wayfarerPlay?.state === 'running') location.reload(); });
  const started = performance.now();
  window.wayfarerPlay = { state: 'loading', args };
  engine.startGame({
    args,
    onProgress(current, total) {
      if (total > 0) {
        const pct = Math.min(100, Math.round(100 * current / total));
        bar.style.width = pct + '%';
        detail.textContent = `Loading the engine and the Wayfarer package… ${pct} % of ${(total / 1e6).toFixed(0)} MB`;
      } else {
        detail.textContent = `Loading… ${(current / 1e6).toFixed(1)} MB`;
      }
    },
  }).then(() => {
    status.hidden = true;
    window.wayfarerPlay = { state: 'running', args, start_ms: Math.round(performance.now() - started) };
    orient();
  }, fail);
}());
</script>
</body>
</html>
